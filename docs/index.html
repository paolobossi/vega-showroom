<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vega Showroom</title>
<meta name="description" content="Vega: showroom order capture for wholesale. Clickable prototype.">
<meta name="theme-color" content="#EFF0EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1113" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vega">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300..600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-first app (portrait or landscape). On desktop it sits in a device frame beside a short demo guide. */
:root{
  --stage:#E1E2DE; --frame:#17181A;
  --bg:#EFF0EC; --surface:#FFFFFF; --surface-2:#F5F6F2; --studio:#E3E4DF;
  --ink:#141619; --muted:#62666B; --faint:#999DA1; --line:#DCDED8;
  --accent:#2238A6; --accent-ink:#FFFFFF; --accent-soft:#E3E7F8;
  --good:#1D7448; --good-bg:#E0EFE6; --warn:#946000; --warn-bg:#F7EAD2; --bad:#AE281C; --bad-bg:#F7E1DE;
  --silver:#9AA1A8; --gold:#B8903A; --platinum:#7C97AB; --diamond:#4C7BD9;
  --scrim:rgba(10,12,16,.42);
  --vf-bg:#0C0D0F; --vf-ink:#F2F2EF; --vf-dim:rgba(242,242,239,.62);
  --f-display:"Jost","Futura","Century Gothic","Avenir Next",sans-serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#050607; --frame:#2A2C30;
  --bg:#0F1113; --surface:#181A1E; --surface-2:#202328; --studio:#43464B;
  --ink:#ECEDEA; --muted:#A0A4A9; --faint:#6E7277; --line:#2C3036;
  --accent:#8C9DFF; --accent-ink:#0F1113; --accent-soft:#222A4C;
  --good:#58C48D; --good-bg:#15291E; --warn:#E5A93E; --warn-bg:#2E2414; --bad:#F27D72; --bad-bg:#331A18;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --stage:#050607; --frame:#2A2C30;
  --bg:#0F1113; --surface:#181A1E; --surface-2:#202328; --studio:#43464B;
  --ink:#ECEDEA; --muted:#A0A4A9; --faint:#6E7277; --line:#2C3036;
  --accent:#8C9DFF; --accent-ink:#0F1113; --accent-soft:#222A4C;
  --good:#58C48D; --good-bg:#15291E; --warn:#E5A93E; --warn-bg:#2E2414; --bad:#F27D72; --bad-bg:#331A18;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-ui);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
@media (min-width:900px){html,body{background:var(--stage)}}
[hidden]{display:none!important}
#root{height:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.code{font:12px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.01em}

/* ---------- shell / device ---------- */
.shell{height:100%;display:flex;align-items:center;justify-content:center;gap:48px}
.device{position:relative;height:100%;width:100%;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.statusbar{display:none}
.side{display:none}
@media (min-width:900px){
  .shell{padding:24px}
  .device{height:min(844px,calc(100vh - 48px));width:auto;aspect-ratio:390/844;border-radius:46px;box-shadow:0 0 0 11px var(--frame),0 30px 80px rgba(0,0,0,.28)}
  .device.landscape{height:auto;width:min(844px,calc(100vw - 440px));aspect-ratio:844/390}
  .device.portrait .statusbar{display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 30px 0 34px;font-weight:600;font-size:14px;flex:none;background:var(--bg)}
  .side{display:flex;flex-direction:column;gap:18px;width:300px;flex:none}
}
.sb-r{display:flex;gap:5px;align-items:center}
.sb-r i{display:block;width:4px;border-radius:1px;background:var(--ink)}
.sb-batt{width:24px;height:11px;border:1.5px solid var(--ink);border-radius:3px;padding:1.5px}
.sb-batt span{display:block;height:100%;width:70%;background:var(--ink);border-radius:1px}
.side-brand{font:400 44px/1 var(--f-display);letter-spacing:-.02em}
.side-lede{margin:0;color:var(--muted);line-height:1.5;text-wrap:pretty}
.steps{margin:0;padding:0 0 0 20px;display:flex;flex-direction:column;gap:8px;line-height:1.45}
.steps li::marker{font:12px var(--f-mono);color:var(--muted)}
.side-ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fine{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.linkbtn{color:var(--accent);font-weight:600;font-size:14px;padding:6px 2px}

/* ---------- app frame ---------- */
.app{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;container-type:size;container-name:app;background:var(--bg)}
.screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.tabbar{flex:none;display:flex;justify-content:space-around;border-top:1px solid var(--line);background:var(--surface);padding:6px 8px max(8px,env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--faint);min-width:72px;padding:4px 0}
.tab.on{color:var(--accent)}
.top{padding:14px 18px 6px}
.brandline{display:flex;justify-content:space-between;align-items:center;min-height:36px}
.maison{font:500 12.5px var(--f-display);letter-spacing:.34em;text-transform:uppercase}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.h1{font:400 36px/1.05 var(--f-display);margin:4px 0 0;letter-spacing:-.02em}
.sec{padding:16px 18px 6px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-head h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:18px;margin:0 -18px;padding:2px 18px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:20px;color:var(--ink)}
.icon-btn:active{background:var(--surface-2)}

/* ---------- chips, pills ---------- */
.cl{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px 3px 6px;border-radius:99px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.cl i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.s-none{background:var(--surface-2);color:var(--muted)}
.s-draft{background:var(--accent-soft);color:var(--accent)}
.s-shared{background:var(--warn-bg);color:var(--warn)}
.s-submitted{background:var(--good-bg);color:var(--good)}
.s-confirmed{background:var(--good);color:var(--surface)}
.by{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.by.client{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.ai{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{padding:6px 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg.full{display:flex}.seg.full button{flex:1}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:650;font-size:15.5px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.secondary{background:var(--surface-2);border:1px solid var(--line)}
.btn.ghost{color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn:active:not(:disabled){transform:scale(.985)}

/* ---------- product art ---------- */
.thumb{flex:none;display:grid;place-items:center;background:var(--studio);border-radius:12px;overflow:hidden;width:56px;height:56px}
.thumb.sm{width:44px;height:44px;border-radius:10px}
.thumb.lg{width:96px;height:96px;border-radius:16px}
.thumb svg{width:86%;height:86%}

/* ---------- today ---------- */
.look{scroll-snap-align:start;flex:none;width:236px;text-align:left;display:flex;flex-direction:column;gap:8px}
.look-tile{position:relative;height:150px;border-radius:16px;overflow:hidden;background:var(--studio)}
.look-tile svg{position:absolute;width:58%;height:auto}
.look-n{font:12px var(--f-mono);color:var(--muted)}
.look-t{font:500 19px/1.15 var(--f-display)}
.look-vm{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.appt{display:flex;gap:14px;align-items:stretch;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.appt-time{font:500 13px var(--f-mono);color:var(--muted);padding-top:3px;width:42px;flex:none}
.appt-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.appt-shop{font:500 20px/1.15 var(--f-display)}
.appt-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.appt-side{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:6px;flex:none}
.live{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.tile b{display:block;font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.foot{padding:18px;font-size:12px;color:var(--faint);text-align:center}
.today-grid{display:flex;flex-direction:column;padding-bottom:12px}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;text-align:left;width:100%;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-title{font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;text-align:right}
.row-val{font-weight:650;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);flex:none}
.szs{display:flex;gap:4px;flex-wrap:wrap}
.sz-chip{font:11.5px var(--f-mono);padding:1px 5px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.lock{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:650;color:var(--warn)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px;color:var(--muted)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;height:100%;color:var(--ink)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 8px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pcard .thumb{width:100%;height:auto;aspect-ratio:1;max-width:100%}
.pcard.locked .thumb{opacity:.5}
.pname{font-weight:620;font-size:14px;line-height:1.25}
.dots{display:flex;gap:4px}
.dots .sw{width:10px;height:10px}

/* ---------- order view ---------- */
.ov{display:flex;flex-direction:column;height:100%;min-height:0}
.ov-nav{flex:none;display:flex;align-items:center;gap:4px;padding:4px 8px 0;min-height:48px}
.ov-nav-t{flex:1;min-width:0;text-align:center}
.ov-shop{font:500 19px/1.15 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-id{font:11.5px var(--f-mono);color:var(--muted)}
.saved{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;color:var(--good);font-weight:600;animation:pulse .6s ease}
@keyframes pulse{from{opacity:.2}to{opacity:1}}
.ov-sub{flex:none;display:flex;flex-direction:column;gap:10px;padding:6px 16px 10px;border-bottom:1px solid var(--line)}
.ov-buyer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px}
.track{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.track div{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;color:var(--faint);min-width:0}
.track div::before{content:"";height:3px;border-radius:2px;background:var(--line)}
.track div.done{color:var(--muted)}.track div.done::before{background:var(--good)}
.track div.cur{color:var(--ink)}.track div.cur::before{background:var(--accent)}
.track-note{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ov-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.ov-kpi{padding:14px 16px 4px}
.ov-lines{padding:6px 16px 20px;display:flex;flex-direction:column;gap:14px}
.lines-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px}
.grp-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:0 2px 6px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.ov-bar{flex:none;display:flex;gap:10px;align-items:center;padding:10px 14px max(12px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.cap-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:27px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;white-space:nowrap;min-width:0}
.round{width:54px;height:54px;border-radius:27px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);flex:none}

/* ---------- KPI ---------- */
.kpi{display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.kpi-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi-label.row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi-label .chip{text-transform:none;letter-spacing:0}
.kpi-big{margin-top:4px;font-size:15px}
.kpi-big .num{font-size:28px;font-weight:650;letter-spacing:-.01em}
.bar{position:relative;height:8px;border-radius:4px;background:var(--surface-2);margin-top:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--accent);transition:width .35s ease}
.bar-fill.warn{background:var(--warn)}.bar-fill.bad{background:var(--bad)}
.kpi-meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:6px}
.kpi-mix{display:flex;flex-direction:column;gap:12px}
.mix-top{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.mix-val{font-variant-numeric:tabular-nums}
.mix-track{position:relative;height:6px;border-radius:3px;background:var(--surface-2);margin-top:6px}
.mix-fill{height:100%;border-radius:3px;background:var(--faint);transition:width .35s ease}
.mix-fill.ok{background:var(--good)}.mix-fill.warn{background:var(--warn)}.mix-fill.bad{background:var(--bad)}
.mix-target{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}
.mix-note{font-size:12px;font-weight:600;margin-top:4px}
.mix-note.warn{color:var(--warn)}.mix-note.bad{color:var(--bad)}
.kpi-foot{font-size:12px;color:var(--faint);line-height:1.45}

/* ---------- sheets ---------- */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:40;animation:fade .2s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:88%;z-index:41;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet.tall{height:88%}
.sheet-grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:8px 10px 6px 18px;flex:none}
.sheet-title{font:500 23px/1.15 var(--f-display);text-wrap:balance}
.sheet-sub{font:12px var(--f-mono);color:var(--muted);margin-top:3px}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:14px}
.sheet-body > *, .match > *, .ov-lines > *{flex-shrink:0}
.sheet-foot{flex:none;display:flex;gap:10px;padding:10px 18px max(14px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.sheet-foot .btn{flex:1}
.sheet-body:last-child{padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.callout{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.4;padding:10px 12px;border-radius:12px}
.callout.warn{background:var(--warn-bg);color:var(--warn)}
.callout.bad{background:var(--bad-bg);color:var(--bad)}
.callout.info{background:var(--accent-soft);color:var(--accent)}
.callout.good{background:var(--good-bg);color:var(--good)}
.callout svg{flex:none;margin-top:1px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}

/* size sheet */
.ss-top{display:flex;gap:14px;align-items:center}
.ss-info{display:flex;flex-direction:column;gap:6px;min-width:0}
.ss-total{font-size:15px}.ss-total b{font-size:20px;font-variant-numeric:tabular-nums}
.colours{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:0 18px 2px;scrollbar-width:none}
.colour{display:flex;align-items:center;gap:7px;padding:0 12px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap;flex:none}
.colour .sw{width:16px;height:16px}
.colour.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

.pre{font:11.5px/1.5 var(--f-mono);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;white-space:pre;max-height:340px;color:var(--ink);margin:0}

.rail{position:absolute;left:-5%;right:-5%;top:13%;height:4px;background:linear-gradient(90deg,#555,#999,#555);border-radius:2px}
.vf-sample{position:absolute;left:50%;top:52%;width:min(64%,46cqh);aspect-ratio:1;transform:translate(-50%,-50%);animation:sway 4s ease-in-out infinite;transition:filter .3s}
.vf-sample svg{width:100%;height:100%;filter:drop-shadow(0 18px 24px rgba(0,0,0,.45))}
.vf-sample.scan{animation:none}
.vf-sample.match{animation:none;filter:brightness(.55)}
@keyframes sway{0%,100%{transform:translate(-50%,-50%) rotate(-1.2deg)}50%{transform:translate(-49%,-51%) rotate(1.2deg)}}
.brackets i{position:absolute;width:34px;height:34px;border:3px solid var(--vf-ink);opacity:.85}
.brackets i:nth-child(1){left:12%;top:20%;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.brackets i:nth-child(2){right:12%;top:20%;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.brackets i:nth-child(3){left:12%;bottom:10%;border-right:0;border-top:0;border-radius:0 0 0 10px}
.brackets i:nth-child(4){right:12%;bottom:10%;border-left:0;border-top:0;border-radius:0 0 10px 0}
.scanline{position:absolute;left:12%;right:12%;height:2px;background:#9fb0ff;box-shadow:0 0 18px 4px rgba(140,157,255,.6);animation:scan 1.1s ease-in-out infinite alternate}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<script>
const {html, render, useState, useEffect, useMemo, useRef} = window.htmPreact;

/* =====================================================================
   Data — fictional Maison and SS27 catalogue. Mirrors the shape of the
   shared database the iOS app will write to (orders, lines, audit log).
   ===================================================================== */
const REP = {name:'Alex R.', full:'Alex Rinaldi'};
const COL = {

  Rose:['#D8A39E','7410'], Burgundy:['#6E1F2B','7690'], Sky:['#9DB8D3','5210'], Silver:['#BFC3C7','1450'],

const SZ = {wr:['34','36','38','40','42'], mr:['46','48','50','52','54'], ws:['36','37','38','39','40','41'], ms:['40','41','42','43','44','45'], u:['U']};

const PRODUCTS = [

  ['w-fold-clutch','W27B0305','Fold Clutch','Fold','W','bags',640,'clutch','u',['Black','Silver','Sky'],1,'D2'],

  ['w-runner','W27S2201','Flow Runner','Runner','W','shoes',430,'sneaker','ws',['White','Grey','Lime'],0,'D1'],
  ['w-sun','W27A3101','Oval Sunglasses','Eyewear','W','acc',230,'glasses','u',['Black','Tortoise'],0,'D1'],
  ['w-arc-card','W27A3204','Arc Cardholder','Arc','W','acc',190,'wallet','u',['Tan','Black','Rose'],0,'D1'],
  ['w-silk','W27A3302','Silk Square','Silk','W','acc',260,'scarf','u',['Ivory','Cobalt'],0,'D2'],
  ['m-messenger','M27B0510','Arc Messenger','Arc','M','bags',1180,'shoulder','u',['Tan','Black'],0,'D1'],
  ['m-arc-tote','M27B0512','Arc Tote Large','Arc','M','bags',1050,'tote','u',['Black','Khaki'],0,'D1'],
  ['m-backpack','M27B0601','Cube Backpack','Cube','M','bags',1260,'backpack','u',['Black','Navy'],1,'D2'],
  ['m-tee','M27R1210','Emblem Tee','Emblem','M','rtw',220,'tee','mr',['White','Black','Navy'],0,'D1'],
  ['m-overshirt','M27R1502','Boxy Overshirt','Tailoring','M','rtw',590,'shirt','mr',['Navy','Khaki'],0,'D1'],
  ['m-pleated','M27R1505','Pleated Trousers','Tailoring','M','rtw',540,'trousers','mr',['Grey','Black'],0,'D1'],
  ['m-car-coat','M27R1601','Wool Car Coat','Outerwear','M','rtw',1620,'coat','mr',['Navy','Sand'],2,'D2'],
  ['m-runner','M27S2210','Flow Runner','Runner','M','shoes',450,'sneaker','ms',['Grey','White','Black'],0,'D1'],
  ['m-loafer','M27S2302','Campo Loafer','Campo','M','shoes',610,'loafer','ms',['Black','Tan'],0,'D2'],
  ['m-belt','M27A3401','Arc Belt','Arc','M','acc',260,'belt','u',['Black','Tan'],0,'D1'],
  ['m-wallet','M27A3205','Arc Wallet','Arc','M','acc',260,'wallet','u',['Black','Tan'],0,'D1'],
].map(([id,code,name,family,div,cat,price,shape,sz,colours,min,drop,x]) => ({id,code,name,family,div,cat,price,shape,sizes:SZ[sz],colours,min,drop,...(x||{})}));
const P = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));

// Maison guidelines: target share of the order value per category, per cluster and division (±5 pts tolerance)
const GUIDE = {
  Silver:  {W:{bags:50,rtw:20,shoes:15,acc:15}, M:{bags:25,rtw:45,shoes:20,acc:10}},
  Gold:    {W:{bags:45,rtw:25,shoes:15,acc:15}, M:{bags:25,rtw:45,shoes:20,acc:10}},
  Platinum:{W:{bags:40,rtw:30,shoes:15,acc:15}, M:{bags:30,rtw:40,shoes:20,acc:10}},
  Diamond: {W:{bags:35,rtw:35,shoes:15,acc:15}, M:{bags:30,rtw:40,shoes:20,acc:10}},

const BUYERS = {
  dubois: {id:'dubois', shop:'Maison Dubois', city:'Paris', buyer:'Claire Dubois', cluster:'Platinum', divs:['W','M'], budget:{W:45000, M:22000}, time:'10:00', code:'DUB01'},
  linea:  {id:'linea', shop:'Linea Concept', city:'Milan', buyer:'Giulia Ferri', cluster:'Gold', divs:['W'], budget:{W:28000}, time:'12:30', code:'LIN04'},
  harbour:{id:'harbour', shop:'Harbour & Co.', city:'London', buyer:'Tom Whitlock', cluster:'Silver', divs:['M'], budget:{M:15000}, time:'15:00', code:'HAR02'},
  kanda:  {id:'kanda', shop:'Kanda Select', city:'Tokyo', buyer:'Aiko Mori', cluster:'Diamond', divs:['W','M'], budget:{W:90000, M:50000}, time:'17:00', code:'KAN07'},
};

const LOOKS = [
  {id:'L03', div:'W', n:3, title:'The tan story', items:[['w-drape-dress','Ivory'],['w-arc-tote','Tan'],['w-comet','Black']],
   vm:'Window lead for SS27. Tan is the hero colour: aim for at least 30% of Arc units in Tan, shown with the Ivory drape.'},
  {id:'L07', div:'W', n:7, title:'Cobalt evening', items:[['w-drape-dress','Cobalt'],['w-fold-clutch','Silver'],['w-comet-sandal','Silver']],
   vm:'Evening capsule. Present as one full look on a mannequin, clutch carried rather than hung.'},
  {id:'L12', div:'W', n:12, title:'Weekend utility', items:[['w-trench','Sand'],['w-wide-trouser','Black'],['w-runner','White'],['w-arc-mini','Tan']],
   vm:'Outerwear-led table. The trench anchors the RTW wall in Platinum and Diamond doors.'},
  {id:'M02', div:'M', n:2, title:'Soft tailoring', items:[['m-overshirt','Navy'],['m-pleated','Grey'],['m-loafer','Black'],['m-messenger','Tan']],
   vm:'Lead men’s story. Sell the overshirt and pleated trouser as a pair, same size run.'},
  {id:'M05', div:'M', n:5, title:'Runner club', items:[['m-tee','White'],['m-runner','Grey'],['m-backpack','Black']],
   vm:'Entry price point for Silver and Gold. Runner in Grey is the bestseller target.'},
];

// Other reps' orders at the same event (sample rows for the shared live view)
const OTHERS = [
  {id:'x1', shop:'Atelier Nove', city:'Rome', rep:'Sofia L.', cluster:'Gold', status:'submitted', by:'client', value:38450, units:96},
  {id:'x2', shop:'Brun & Fils', city:'Lyon', rep:'Marc D.', cluster:'Silver', status:'shared', by:null, value:22100, units:58, hoursLeft:31},
  {id:'x3', shop:'Sora Studio', city:'Seoul', rep:'Jin P.', cluster:'Diamond', status:'confirmed', by:'salesperson', value:74800, units:171},
  {id:'x4', shop:'Nordlys', city:'Copenhagen', rep:'Ida H.', cluster:'Gold', status:'draft', by:null, value:12600, units:33},
  {id:'x5', shop:'Casa Prisma', city:'Madrid', rep:'Sofia L.', cluster:'Platinum', status:'submitted', by:'salesperson', value:29900, units:77},
  {id:'x6', shop:'Wren', city:'New York', rep:'Marc D.', cluster:'Platinum', status:'confirmed', by:'client', value:51300, units:120},
];

/* ---------- helpers ---------- */
const fmt = n => '€' + Math.round(n).toLocaleString('en-GB');
const units = q => Object.values(q || {}).reduce((a, b) => a + b, 0);
const lineValue = l => units(l.qty) * P[l.pid].price;
const qkey = q => Object.keys(q).sort().map(k => k + ':' + q[k]).join(',');
const uid = () => Math.random().toString(36).slice(2, 9);
const hhmm = t => new Date(t).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
const todayAt = (h, m) => { const d = new Date(); d.setHours(h, m, 0, 0); return d.getTime(); };
const hash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
const rank = c => CLUSTERS.indexOf(c);
const orderNo = o => 'AUR-SS27-' + BUYERS[o.buyerId].code;
const whoName = (o, by) => by === 'client' ? BUYERS[o.buyerId].buyer : REP.name;
const clusterVar = c => ({'--c': `var(--${c.toLowerCase()})`});

function log(o, by, text) { o.log.push({at: Date.now(), by, text}); }

function kpi(order, div) {
  const b = BUYERS[order.buyerId], g = GUIDE[b.cluster][div];
  const byCat = {bags:0, rtw:0, shoes:0, acc:0};
  let total = 0, u = 0;
  order.lines.forEach(l => { const p = P[l.pid]; if (p.div !== div) return; const v = lineValue(l); byCat[p.cat] += v; total += v; u += units(l.qty); });
  const budget = b.budget[div] || 0;
  const mix = CATS.map(c => {
    const pct = total ? byCat[c] / total * 100 : 0, target = g[c], diff = pct - target;
    const st = !total ? 'none' : Math.abs(diff) <= 5 ? 'ok' : Math.abs(diff) <= 10 ? 'warn' : 'bad';
    return {cat:c, value:byCat[c], pct, target, diff, st};
  });
  const used = budget ? total / budget * 100 : 0;
  return {total, units:u, budget, used, bst: used > 115 ? 'bad' : used > 105 ? 'warn' : 'ok', mix};
}

function applyDraft(o, pid, draft, via, by) {
  const p = P[pid], now = Date.now();
  const idx = o.lines.findIndex(l => l.pid === pid);
  const old = o.lines.filter(l => l.pid === pid);
  const rest = o.lines.filter(l => l.pid !== pid);
  const fresh = [], msgs = [];
  for (const c of p.colours) {
    const q = {}; Object.entries(draft[c] || {}).forEach(([s, n]) => { if (n > 0) q[s] = n; });
    const prev = old.find(l => l.colour === c), u = units(q), pu = prev ? units(prev.qty) : 0;
    const same = prev && qkey(prev.qty) === qkey(q);
    if (u > 0) fresh.push(same ? prev : {id: prev ? prev.id : uid(), pid, colour:c, qty:q, via: prev ? prev.via : via, by, at: now});
    if (!prev && u > 0) msgs.push(`Added ${p.name} · ${c} ×${u}${via === 'photo' ? ' (photo match)' : via === 'suggestion' ? ' (suggestion)' : ''}`);
    else if (prev && u === 0) msgs.push(`Removed ${p.name} · ${c}`);
    else if (prev && !same) msgs.push(`Changed ${p.name} · ${c} ×${pu} → ×${u}`);
  }
  const at = idx < 0 ? rest.length : o.lines.slice(0, idx).filter(l => l.pid !== pid).length;
  rest.splice(at, 0, ...fresh);
  o.lines = rest;
  msgs.forEach(m => log(o, by, m));
  return msgs.length;
}

/* =====================================================================
   Catalogue — browse with per-cluster availability

function ProductList({div, q, cluster, onPick, grid}) {

  if (!items.length) return html`<div class="empty">No styles match “${q}”. Try a style name or code.</div>`;
  const lockOf = p => cluster && p.min > rank(cluster);
  if (grid) return html`<div class="pgrid">${items.map(p => html`<button class=${'pcard' + (lockOf(p) ? ' locked' : '')} onClick=${() => onPick(p)}>
    <${Thumb} pid=${p.id} colour=${p.colours[0]}/>
    <div class="pname">${p.name}</div>
    <div class="code">${p.code}</div>
    <div class="row-sub" style="justify-content:space-between"><span class="dots">${p.colours.map(c => html`<span class="sw" style=${{background:COL[c][0]}}></span>`)}</span><span class="num" style="color:var(--ink);font-weight:600">${fmt(p.price)}</span></div>
    ${lockOf(p) && html`<span class="lock"><${Icon} n="lock" s=${12} w=${2.2}/>${CLUSTERS[p.min]}+ only</span>`}
  </button>`)}</div>`;
  return html`<div class="list">${items.map(p => html`<button class="row" onClick=${() => onPick(p)}>
    <${Thumb} pid=${p.id} colour=${p.colours[0]}/>
    <div class="row-main"><div class="row-title">${p.name}</div><div class="row-sub"><span class="code">${p.code}</span> · ${CAT_LABEL[p.cat]}</div></div>
    <div class="row-side"><span class="row-val">${fmt(p.price)}</span>${lockOf(p) && html`<span class="lock"><${Icon} n="lock" s=${12} w=${2.2}/>${CLUSTERS[p.min]}+</span>`}</div>

/* =====================================================================
   Size & quantity entry — the step a photo can't do
   ===================================================================== */
const CURVES = {5:[['Core 1·2·2·1', [0,1,2,2,1]], ['Full 1·2·3·2·1', [1,2,3,2,1]]], 6:[['Core 1·2·2·1', [0,1,2,2,1,0]], ['Full 1·2·3·3·2·1', [1,2,3,3,2,1]]]};

function SizeSheet({sh, S, act}) {
  const order = S.orders[sh.orderId], p = P[sh.pid], b = BUYERS[order.buyerId];
  const actor = sh.actor || 'salesperson';
  const init = useMemo(() => Object.fromEntries(p.colours.map(c => [c, {...((order.lines.find(l => l.pid === p.id && l.colour === c) || {}).qty || {})}])), []);
  const [draft, setDraft] = useState(init);
  const existing = order.lines.some(l => l.pid === p.id);
  const [col, setCol] = useState(sh.colour || (order.lines.find(l => l.pid === p.id) || {}).colour || p.colours[0]);
  const locked = p.min > rank(b.cluster);
  const readOnly = order.status === 'confirmed' || (actor === 'client' && order.status === 'submitted');
  const q = draft[col] || {};
  const dirty = JSON.stringify(Object.fromEntries(Object.entries(draft).map(([c, x]) => [c, qkey(Object.fromEntries(Object.entries(x).filter(([, n]) => n > 0)))]))) !==
                JSON.stringify(Object.fromEntries(Object.entries(init).map(([c, x]) => [c, qkey(x)])));
  const setQty = (s, n) => setDraft(d => ({...d, [col]: {...d[col], [s]: Math.max(0, Math.min(99, n))}}));
  const setAll = arr => setDraft(d => ({...d, [col]: Object.fromEntries(p.sizes.map((s, i) => [s, arr[i] || 0]))}));
  const save = () => { if (dirty && !locked && !readOnly) { act.saveDraft(order.id, p.id, draft, sh.via || 'search', actor); return true; } return false; };
  const close = () => { if (save()) act.toast('Saved to order'); act.close(); };
  const done = () => { save(); act.close(); act.toast(existing ? 'Order updated' : `Added to ${b.shop}`); };
  const go = (pid, colour) => { if (save()) act.toast('Saved · ' + p.name); act.sheet({type:'size', orderId:order.id, pid, colour, via:'suggestion', actor}); };

  const projected = useMemo(() => { const o = JSON.parse(JSON.stringify(order)); applyDraft(o, p.id, draft, 'x', actor); return o; }, [draft, order]);
  const k0 = kpi(order, p.div), k1 = kpi(projected, p.div);
  const m0 = k0.mix.find(m => m.cat === p.cat), m1 = k1.mix.find(m => m.cat === p.cat);
  const tUnits = Object.values(draft).reduce((a, x) => a + units(x), 0);
  const family = PRODUCTS.filter(x => x.family === p.family && x.id !== p.id && x.div === p.div);
  const styled = []; LOOKS.filter(l => l.items.some(([x]) => x === p.id)).forEach(l => l.items.forEach(([x, c]) => { if (x !== p.id && !styled.some(s => s.pid === x)) styled.push({pid:x, colour:c, look:l}); }));
  const sug = (pid, colour, note) => { const xp = P[pid], lk = xp.min > rank(b.cluster), has = order.lines.some(l => l.pid === pid);
    return html`<button class="sug" onClick=${() => go(pid, colour)}><${Thumb} pid=${pid} colour=${colour}/><div class="sug-n">${xp.name}</div>
      <div class="small muted">${lk ? html`<span class="lock"><${Icon} n="lock" s=${11} w=${2.2}/>${CLUSTERS[xp.min]}+</span>` : has ? 'In order' : note || fmt(xp.price)}</div></button>`; };
  const curves = CURVES[p.sizes.length] || [];

  return html`<${Sheet} tall title=${p.name} sub=${`${p.code} · ${fmt(p.price)} wholesale`} onClose=${close}
    foot=${readOnly ? html`<button class="btn secondary" onClick=${act.close}>Close</button>` : html`
      ${existing && html`<button class="btn danger" style="flex:0 0 auto" onClick=${() => { act.saveDraft(order.id, p.id, {}, 'x', actor); act.close(); act.toast('Removed from order'); }}>Remove</button>`}
      <button class="btn primary" disabled=${locked || (!existing && tUnits === 0)} onClick=${done}>${existing ? 'Save changes' : tUnits ? `Add ${tUnits} to order` : 'Enter quantities'}</button>`}>
    <div class="ss-top">
      <${Thumb} cls="lg" pid=${p.id} colour=${col}/>
      <div class="ss-info">
        ${sh.via === 'photo' && html`<span class="chip ai" style="align-self:flex-start"><${Icon} n="spark" s=${13}/>Matched from photo</span>`}
        <div class="small muted">${DIV_LABEL[p.div]} · ${CAT_LABEL[p.cat]} · ${DROPS[p.drop]}</div>
        <div class="ss-total"><b>${tUnits}</b> units · <span class="num">${fmt(tUnits * p.price)}</span></div>
      </div>
    </div>
    ${locked && html`<div class="callout bad"><${Icon} n="lock" s=${18}/><div>${p.name} is for ${CLUSTERS[p.min]} clients and above. ${b.shop} is ${b.cluster}, so it can’t go on this order.</div></div>`}
    ${readOnly && html`<div class="callout info"><${Icon} n="lock" s=${18}/><div>This order is ${STATUS[order.status].toLowerCase()} and can’t be edited here.</div></div>`}
    <div class="lbl">Colour <span style="text-transform:none;letter-spacing:0;font-weight:500">· ${p.colours.length} options</span></div>
    <div class="colours">${p.colours.map(c => html`<button class=${'colour' + (c === col ? ' on' : '')} onClick=${() => setCol(c)}><span class="sw" style=${{background:COL[c][0]}}></span>${c}${units(draft[c]) > 0 && html`<span class="cnt">${units(draft[c])}</span>`}</button>`)}</div>
    ${!locked && !readOnly && html`
      <div class="lbl">${p.sizes.length > 1 ? 'Sizes' : 'Quantity'} · ${col}</div>
      ${p.sizes.length > 1 ? html`
        <div class="sizes">${p.sizes.map(s => html`<div class=${'size-cell' + (q[s] ? ' has' : '')}>
          <div class="sz">${s}</div>
          <button class="step" aria-label=${'Add one size ' + s} onClick=${() => setQty(s, (q[s] || 0) + 1)}>+</button>
          <div class="qty num">${q[s] || 0}</div>
          <button class="step" aria-label=${'Remove one size ' + s} onClick=${() => setQty(s, (q[s] || 0) - 1)}>−</button>
        </div>`)}</div>
        <div class="quick">${curves.map(([l, arr]) => html`<button class="qbtn" onClick=${() => setAll(arr)}>${l}</button>`)}
          <button class="qbtn" onClick=${() => setAll(p.sizes.map(s => (q[s] || 0) + 1))}>+1 each</button>
          <button class="qbtn" onClick=${() => setAll([])}>Clear</button></div>` : html`
        <div class="single">
          <button class="step lg" aria-label="Remove one" onClick=${() => setQty('U', (q.U || 0) - 1)}>−</button>
          <div class="qty xl num">${q.U || 0}</div>
          <button class="step lg" aria-label="Add one" onClick=${() => setQty('U', (q.U || 0) + 1)}>+</button>
        </div>
        <div class="quick">${[1, 2, 3, 4, 6].map(n => html`<button class="qbtn" onClick=${() => setQty('U', n)}>${n}</button>`)}<button class="qbtn" onClick=${() => setQty('U', 0)}>Clear</button></div>`}
      <div class="panel impact">
        <div class="impact-row"><span class="muted">${CAT_LABEL[p.cat]} share</span>
          <span class="num"><span class="muted">${Math.round(m0.pct)}% →</span> <b>${Math.round(m1.pct)}%</b> <span class=${'chip ' + m1.st}>target ${m1.target}%</span></span></div>
        <div class="impact-row"><span class="muted">${DIV_LABEL[p.div]} budget</span>
          <span class="num"><span class="muted">${Math.round(k0.used)}% →</span> <b>${Math.round(k1.used)}%</b> <span class="muted">of ${fmt(k1.budget)}</span></span></div>
      </div>`}
    ${family.length > 0 && html`<div class="lbl">Same family · ${p.family}</div><div class="sugs">${family.map(x => sug(x.id, x.colours.includes(col) ? col : x.colours[0]))}</div>`}
    ${styled.length > 0 && html`<div class="lbl">Styled with it · Look ${String(styled[0].look.n).padStart(2, '0')}</div><div class="sugs">${styled.map(s => sug(s.pid, s.colour, 'Look ' + String(s.look.n).padStart(2, '0')))}</div>`}
  <//>`;
}

/* =====================================================================
   Capture — photograph a sample, AI matches it to the catalogue
   ===================================================================== */
function Capture({order, div, act}) {
  const b = BUYERS[order.buyerId];
  const samples = useMemo(() => PRODUCTS.filter(p => p.div === div).map(p => ({pid:p.id, colour:p.colours[hash(p.id) % p.colours.length]})), [div]);
  const [idx, setIdx] = useState(() => hash(String(Date.now())) % samples.length);
  const [stage, setStage] = useState('aim');
  const t = useRef(0);
  useEffect(() => () => clearTimeout(t.current), []);
  const s = samples[idx], p = P[s.pid];
  const shoot = () => { setStage('scan'); t.current = setTimeout(() => setStage('match'), 1250); };
  const conf = confidence(p), sib = sibling(p), alts = alternatives(p);
  const locked = p.min > rank(b.cluster);
  const pick = (pid, colour) => act.sheet({type:'size', orderId:order.id, pid, colour, via:'photo'});
  return html`<div class="capture">
    <div class="vf-top">
      <button class="vf-btn" onClick=${() => act.capture(false)} aria-label="Close camera"><${Icon} n="x"/></button>
      <div class="vf-title">${b.shop} · ${DIV_LABEL[div]}</div>
      <button class="vf-btn" onClick=${() => act.sheet({type:'picker', orderId:order.id, div})} aria-label="Search the catalogue instead"><${Icon} n="search"/></button>
    </div>
    <div class="vf-scene">
      <div class="rail"></div>
      <div class=${'vf-sample ' + stage}><${Art} pid=${s.pid} colour=${s.colour}/></div>
      <div class="brackets"><i></i><i></i><i></i><i></i></div>
      ${stage === 'scan' && html`<div class="scanline"></div><div class="vf-status"><span>Matching against ${PRODUCTS.length} SS27 styles…</span></div>`}
      ${stage === 'aim' && html`<div class="vf-hint"><span>Frame the sample. No tag or barcode needed.</span></div>`}
    </div>
    <div class="vf-bottom">
      <div class="rail-label">Demo: pick which showroom sample is in front of the camera</div>
      <div class="sample-rail">${samples.map((x, i) => html`<button class=${'sample' + (i === idx ? ' on' : '')} onClick=${() => { setIdx(i); setStage('aim'); }} aria-label=${P[x.pid].name}><${Art} pid=${x.pid} colour=${x.colour}/></button>`)}</div>
      <div class="shutter-row"><button class="shutter" onClick=${shoot} disabled=${stage !== 'aim'} aria-label="Take photo"><span></span></button></div>
    </div>
    ${stage === 'match' && html`<div class="match" role="dialog" aria-label="Confirm the match">
      <div class="match-head"><span class="chip ai"><${Icon} n="spark" s=${13}/>Match found</span><span class=${'conf ' + (conf >= 90 ? 'hi' : 'mid')}>${conf}% confidence</span></div>
      <div class="match-main"><${Thumb} cls="lg" pid=${p.id} colour=${s.colour}/>
        <div style="min-width:0"><div class="m-name">${p.name}</div><div class="code" style="margin-top:4px">${p.code} · ${s.colour} ${COL[s.colour][1]}</div><div class="small muted" style="margin-top:2px">${CAT_LABEL[p.cat]} · ${fmt(p.price)} wholesale</div></div></div>
      ${sib && html`<div class="callout warn"><${Icon} n="alert" s=${18}/><div>Close to <b>${sib.name}</b> (${sib.code}). Check the sample before you confirm.</div></div>`}
      ${locked && html`<div class="callout bad"><${Icon} n="lock" s=${18}/><div>${CLUSTERS[p.min]}+ only. ${b.shop} is ${b.cluster}, so this style can’t be ordered.</div></div>`}
      <button class="btn primary block" disabled=${locked} onClick=${() => pick(p.id, s.colour)}>Confirm match · enter sizes</button>
      <div class="lbl" style="margin-top:2px">Not it? Next closest</div>
      <div class="alts">${alts.map((a, i) => html`<button class="row" onClick=${() => pick(a.id, a.colours.includes(s.colour) ? s.colour : a.colours[0])}>
        <${Thumb} cls="sm" pid=${a.id} colour=${a.colours.includes(s.colour) ? s.colour : a.colours[0]}/>
        <div class="row-main"><div class="row-title">${a.name}</div><div class="code">${a.code}</div></div>
        <span class="small muted num">${Math.max(8, (a === sib ? conf - 9 : 42 - i * 11))}%</span></button>`)}</div>
      <button class="btn ghost block" onClick=${() => setStage('aim')}>Retake photo</button>
    </div>`}
  </div>`;
}

function StatusTrack({o}) {
  const steps = ['draft', 'shared', 'submitted', 'confirmed'], i = steps.indexOf(o.status), b = BUYERS[o.buyerId];
  let note = 'Capturing with ' + b.buyer;
  if (o.status === 'shared') note = `With ${b.buyer} · closes in ${Math.max(0, 48 - Math.floor((Date.now() - o.sharedAt) / 36e5))}h`;
  if (o.status === 'submitted') note = `Submitted by ${whoName(o, o.submittedBy)} · your review due in 3 days`;
  if (o.status === 'confirmed') note = `Confirmed ${hhmm(o.confirmedAt)} · ready for the factory export`;
  return html`<div style="display:flex;flex-direction:column;gap:6px;min-width:0">
    <div class="track">${steps.map((s, j) => html`<div class=${j < i ? 'done' : j === i ? 'cur' : ''}>${STATUS[s]}</div>`)}</div>
    <div class="track-note">${o.submittedBy && html`<${By} by=${o.submittedBy}/>`}<span>${note}</span></div>
  </div>`;
}

function OrderView({S, ui, act, order}) {
  const b = BUYERS[order.buyerId], div = b.divs.includes(ui.div) ? ui.div : b.divs[0];
  const [group, setGroup] = useState('cat');
  const lines = order.lines.filter(l => P[l.pid].div === div);
  const groups = group === 'cat'
    ? CATS.map(c => ({key:c, label:CAT_LABEL[c], lines:lines.filter(l => P[l.pid].cat === c)}))
    : Object.keys(DROPS).map(d => ({key:d, label:DROPS[d], lines:lines.filter(l => P[l.pid].drop === d)}));
  const locked = order.status === 'confirmed';
  const edit = l => act.sheet({type:'size', orderId:order.id, pid:l.pid, colour:l.colour, via:l.via});
  return html`<div class="ov">
    <div class="ov-nav">
      <button class="icon-btn" onClick=${act.back} aria-label="Back to today"><${Icon} n="back"/></button>
      <div class="ov-nav-t"><div class="ov-shop">${b.shop}</div><div class="ov-id">${orderNo(order)}</div></div>
      <button class="icon-btn" onClick=${() => act.sheet({type:'history', orderId:order.id})} aria-label="Order history"><${Icon} n="history"/></button>
    </div>
    <div class="ov-sub">
      <div class="ov-buyer"><span>${b.buyer}</span><${Cluster} c=${b.cluster}/>
        ${S.savedAt && html`<span class="saved" key=${S.savedAt}><${Icon} n="check" s=${13} w=${2.4}/>Saved ${hhmm(S.savedAt)}</span>`}</div>
      <${StatusTrack} o=${order}/>
    </div>
    <div class="ov-body">
      <div class="ov-kpi">
        ${b.divs.length > 1 && html`<div style="margin-bottom:12px"><${Seg} full opts=${b.divs.map(d => [d, DIV_LABEL[d] + ' · ' + fmt(kpi(order, d).total)])} val=${div} on=${act.div}/></div>`}
        <${KpiPanel} order=${order} div=${div}/>
      </div>
      <div class="ov-lines">
        <div class="lines-head"><span class="lbl">${lines.length} lines · ${DIV_LABEL[div]}</span><${Seg} opts=${[['cat', 'Category'], ['drop', 'Delivery']]} val=${group} on=${setGroup}/></div>
        ${lines.length === 0 && html`<div class="empty"><${Icon} n="cam" s=${28}/><div><b style="color:var(--ink)">No ${DIV_LABEL[div].toLowerCase()} lines yet</b></div><div class="small">Photograph a sample to add the first style. Every line saves the moment it’s entered.</div></div>`}
        ${groups.filter(g => g.lines.length).map(g => html`<div>
          <div class="grp-head"><span>${g.label}</span><span class="num">${fmt(g.lines.reduce((a, l) => a + lineValue(l), 0))}</span></div>
          <div class="list">${g.lines.map(l => html`<${LineRow} key=${l.id} l=${l} onClick=${() => edit(l)}/>`)}</div>
        </div>`)}
      </div>
    </div>
    <div class="ov-bar">
      <button class="round" disabled=${locked} onClick=${() => act.sheet({type:'picker', orderId:order.id, div})} aria-label="Search the catalogue"><${Icon} n="search"/></button>
      <button class="cap-btn" disabled=${locked} onClick=${() => act.capture(true)}><${Icon} n="cam"/>Photograph sample</button>
      <button class="round" onClick=${() => act.sheet({type:'finish', orderId:order.id})} aria-label="Share, submit or export"><${Icon} n="share"/></button>
    </div>
  </div>`;
}

function issuesOf(o) {
  const b = BUYERS[o.buyerId], out = [];
  b.divs.forEach(d => { const k = kpi(o, d); if (!k.total) return;
    k.mix.filter(m => m.st !== 'ok').forEach(m => out.push({d, label:`${DIV_LABEL[d]} ${CAT_LABEL[m.cat].toLowerCase()}`, text:`${Math.round(m.pct)}% vs ${m.target}%`, st:m.st}));
    if (k.bst !== 'ok') out.push({d, label:`${DIV_LABEL[d]} budget`, text:`${Math.round(k.used)}% used`, st:k.bst}); });
  return out;
}

function FinishSheet({sh, S, act}) {
  const o = S.orders[sh.orderId], b = BUYERS[o.buyerId];
  const [confirmSubmit, setConfirmSubmit] = useState(false);
  const link = `aurore.vega.app/o/${b.code}-${o.id.length}K${String(o.lines.length).padStart(2, '0')}`;
  const issues = issuesOf(o);
  const empty = o.lines.length === 0;
  return html`<${Sheet} title=${o.status === 'submitted' ? 'Review and confirm' : o.status === 'confirmed' ? 'Confirmed order' : 'Finish the session'} sub=${orderNo(o)} onClose=${act.close}>
    ${(o.status === 'draft' || o.status === 'shared') && html`
      <div class="panel">
        <div style="font-weight:650">Share the basket with ${b.buyer}</div>
        <div class="small muted">${b.buyer.split(' ')[0]} can review and complete it from the shop within 48 hours. No account needed.</div>
        ${o.status === 'shared'
          ? html`<div class="linkbox"><code>${link}</code><button class="btn secondary" onClick=${() => copyText('https://' + link, act)}><${Icon} n="copy" s=${16}/>Copy</button></div>
                 <button class="btn primary block" onClick=${() => act.role('buyer', o.id)}>Open as ${b.buyer.split(' ')[0]} (demo)</button>`
          : html`<button class="btn primary block" disabled=${empty} onClick=${() => { act.share(o.id); act.toast('Basket shared · closes in 48h'); }}><${Icon} n="share" s=${18}/>Share basket</button>`}
      </div>
      <div class="panel">
        <div style="font-weight:650">Submit for the buyer</div>
        ${!confirmSubmit ? html`<div class="small muted">Use this when ${b.buyer.split(' ')[0]} asks you to place the order now.</div>
            <button class="btn secondary block" disabled=${empty} onClick=${() => setConfirmSubmit(true)}>Submit on ${b.buyer.split(' ')[0]}’s behalf</button>`
          : html`<div class="callout warn"><${Icon} n="alert" s=${18}/><div>The order will be recorded as submitted by you, ${REP.name}. If it contains an error, the Maison carries the cost of the production run.</div></div>
            <div style="display:flex;gap:10px"><button class="btn secondary" style="flex:1" onClick=${() => setConfirmSubmit(false)}>Cancel</button>
            <button class="btn primary" style="flex:1" onClick=${() => { act.submit(o.id, 'salesperson'); act.close(); act.toast('Submitted by salesperson'); }}>Submit as ${REP.name}</button></div>`}
      </div>`}
    ${o.status === 'submitted' && html`
      <div class="callout ${o.submittedBy === 'client' ? 'info' : 'warn'}"><${Icon} n="user" s=${18}/><div>Submitted by <b>${whoName(o, o.submittedBy)}</b> (${o.submittedBy === 'client' ? 'client' : 'salesperson'}) at ${hhmm(o.submittedAt)}. ${o.submittedBy === 'client' ? 'Errors in quantities are the client’s responsibility.' : 'The Maison carries the cost of any error.'}</div></div>
      <div class="panel">
        <div style="font-weight:650">Guideline check · ${b.cluster}</div>
        ${issues.length === 0 ? html`<div class="callout good"><${Icon} n="check" s=${18}/><div>Every category and budget is within the Maison guidelines.</div></div>`
          : html`<div>${issues.map(x => html`<div class="issue"><span>${x.label}</span><span class=${'chip ' + x.st}>${x.text}</span></div>`)}</div>
                 <div class="small muted">${issues.length} item${issues.length > 1 ? 's' : ''} outside guidelines. Email ${b.buyer.split(' ')[0]} to adjust, or confirm as is.</div>`}
        <button class="btn primary block" onClick=${() => { act.confirm(o.id); act.toast('Confirmed for production'); }}>Confirm for production</button>
      </div>`}
    ${o.status === 'confirmed' && html`<div class="callout good"><${Icon} n="check" s=${18}/><div>Confirmed at ${hhmm(o.confirmedAt)}. Submitted by ${whoName(o, o.submittedBy)} (${o.submittedBy}).</div></div>`}
    <button class="btn secondary block" disabled=${empty} onClick=${() => act.sheet({type:'export', orderId:o.id})}><${Icon} n="export" s=${18}/>Export for the factory</button>
  <//>`;
}

function ExportSheet({sh, S, act}) {
  const o = S.orders[sh.orderId], [fmtX, setFmt] = useState('xls');
  const text = fmtX === 'xls' ? toTSV(o) : toXML(o);
  return html`<${Sheet} tall title="Factory export" sub=${orderNo(o) + ' · ' + exportRows(o).length + ' rows'} onClose=${act.close}
    foot=${html`<button class="btn primary" onClick=${() => copyText(text, act)}><${Icon} n="copy" s=${18}/>Copy ${fmtX === 'xls' ? 'for Excel' : 'XML'}</button>`}>
    <${Seg} full opts=${[['xls', 'Excel'], ['xml', 'XML']]} val=${fmtX} on=${setFmt}/>
    <div class="small muted">${fmtX === 'xls' ? 'One row per style, colour and size. Paste into Excel and the columns line up.' : 'Structured order for systems that import XML.'} The export is a view of the shared database; it carries the submitter and how each line was captured.</div>
    <pre class="pre">${text}</pre>
  <//>`;
}

function HistorySheet({sh, S, act}) {
  const o = S.orders[sh.orderId];
  return html`<${Sheet} tall title="Order history" sub=${orderNo(o) + ' · ' + o.log.length + ' events'} onClose=${act.close}>
    <div class="panel log">${[...o.log].reverse().map(e => html`<div class="log-row"><div class="log-t">${hhmm(e.at)}</div><div>${e.text}<div class="log-who"><span class=${'by ' + e.by}><${Icon} n="user" s=${13} w=${2}/>${whoName(o, e.by)} · ${e.by === 'client' ? 'client' : 'salesperson'}</span></div></div></div>`)}</div>
  <//>`;
}

/* =====================================================================
   Buyer view — what the client sees from the shared link
   ===================================================================== */
function BuyerView({S, ui, act}) {
  const o = S.orders[ui.buyerOrder], b = BUYERS[o.buyerId];
  const div = b.divs.includes(ui.div) ? ui.div : b.divs[0];
  const [confirming, setConfirming] = useState(false);
  const lines = o.lines.filter(l => P[l.pid].div === div);
  const open = o.status === 'shared' || o.status === 'draft';
  const hoursLeft = o.sharedAt ? Math.max(0, 48 - Math.floor((Date.now() - o.sharedAt) / 36e5)) : 48;
  return html`<div class="ov">
    <div class="demo-bar"><span>Demo: buyer view from the shared link</span><button onClick=${() => act.role('sales')}>Back to salesperson</button></div>
    <div class="bv-head">
      <span class="maison">Maison Aurore</span>
      <div class="ov-shop" style="font-size:24px">Your SS27 order</div>
      <div class="small muted">${b.shop} · prepared with ${REP.name}</div>
      <div class="row-sub">${open ? html`<span class="pill s-shared"><${Icon} n="clock" s=${13} w=${2}/>Closes in ${hoursLeft}h</span>` : html`<${Pill} s=${o.status}/><${By} by=${o.submittedBy}/>`}</div>
    </div>
    <div class="ov-body">
      <div class="ov-kpi">
        ${b.divs.length > 1 && html`<div style="margin-bottom:12px"><${Seg} full opts=${b.divs.map(d => [d, DIV_LABEL[d]])} val=${div} on=${act.div}/></div>`}
        <${KpiPanel} order=${o} div=${div}/>
      </div>
      <div class="ov-lines">
        <div class="lines-head"><span class="lbl">${lines.length} styles</span>${open && html`<button class="linkbtn" onClick=${() => act.sheet({type:'picker', orderId:o.id, div, actor:'client'})}>Add from the collection</button>`}</div>
        <div class="list">${lines.map(l => html`<${LineRow} key=${l.id} l=${l} onClick=${() => act.sheet({type:'size', orderId:o.id, pid:l.pid, colour:l.colour, via:l.via, actor:'client'})}/>`)}</div>
        ${!open && html`<div class="callout good"><${Icon} n="check" s=${18}/><div>Thank you. ${REP.name} will review the order against the Maison guidelines within 3 days and confirm it for production.</div></div>`}
      </div>
    </div>
    ${open && html`<div class="ov-bar" style="flex-direction:column;align-items:stretch">
      ${confirming ? html`<div class="small muted" style="text-align:center">You’re submitting as ${b.buyer}. Quantities are produced exactly as ordered.</div>
        <div style="display:flex;gap:10px"><button class="btn secondary" style="flex:1" onClick=${() => setConfirming(false)}>Keep editing</button>
        <button class="btn primary" style="flex:1" onClick=${() => { act.submit(o.id, 'client'); setConfirming(false); act.toast('Order submitted'); }}>Submit order</button></div>`
      : html`<button class="btn primary block" onClick=${() => setConfirming(true)}>Review and submit · ${fmt(b.divs.reduce((a, d) => a + kpi(o, d).total, 0))}</button>`}
    </div>`}
  </div>`;
}

/* =====================================================================
   App shell
   ===================================================================== */
const GUIDE_STEPS = [
  'Open Maison Dubois. The session is already under way.',
  'Tap Photograph sample, pick a sample on the rail and press the shutter.',
  'Confirm the match, set sizes with a size curve, and watch the guideline mix move.',
  'Tap the share button, share the basket, then open it as the buyer and submit.',
  'Back as the salesperson, review the guideline check, confirm, and open the factory export.',
];

function AboutSheet({act}) {
  return html`<${Sheet} title="About this prototype" sub="Vega · POC v0.1" onClose=${act.close}>
    <p style="margin:0;line-height:1.5">Vega captures wholesale showroom orders on a phone. The salesperson photographs a sample, confirms the match and enters sizes, while the order is checked live against the Maison’s guidelines for the client’s cluster.</p>
    <div class="lbl">Try this</div>
    <ol class="steps">${GUIDE_STEPS.map(s => html`<li>${s}</li>`)}</ol>
    <div class="callout info"><${Icon} n="info" s=${18}/><div>Photo recognition is simulated against a fictional catalogue. Orders save in this browser only.</div></div>
    <button class="btn secondary block" onClick=${act.reset}>Reset demo data</button>
  <//>`;
}

function TabBar({tab, act}) {
  const T = [['today', 'Today', 'today'], ['orders', 'Orders', 'orders'], ['catalogue', 'Collection', 'grid']];
  return html`<nav class="tabbar">${T.map(([k, l, i]) => html`<button class=${'tab' + (tab === k ? ' on' : '')} onClick=${() => act.tab(k)} aria-current=${tab === k ? 'page' : null}><${Icon} n=${i}/>${l}</button>`)}</nav>`;
}

function makeActs(setS, setUi, onReset) {
  let toastT = 0;
  const a = {
    toast: msg => { setUi(u => ({...u, toast:msg, toastId:Date.now()})); clearTimeout(toastT); toastT = setTimeout(() => setUi(u => ({...u, toast:null})), 2200); },
    openOrder: bid => { const id = 'o-' + bid;
      setS(s => s.orders[id] ? s : {...s, orders:{...s.orders, [id]:newOrder(bid)}, savedAt:Date.now()});
      setUi(u => ({...u, view:id, lastOrder:id, div: u.view === id ? u.div : BUYERS[bid].divs[0], sheet:null, capture:false})); },
    back: () => setUi(u => ({...u, view:null, capture:false, sheet:null})),
    tab: t => setUi(u => ({...u, tab:t, view:null})),
    sheet: sh => setUi(u => ({...u, sheet:sh, capture: sh && sh.type === 'picker' ? false : sh && sh.type === 'size' ? false : u.capture})),
    close: () => setUi(u => ({...u, sheet:null})),
    capture: on => setUi(u => ({...u, capture:on, sheet:null})),
    div: d => setUi(u => ({...u, div:d})),
    mut: (id, fn) => setS(s => { const o = JSON.parse(JSON.stringify(s.orders[id])); fn(o); return {...s, orders:{...s.orders, [id]:o}, savedAt:Date.now()}; }),
    role: (r, id) => setUi(u => ({...u, role:r, buyerOrder:id || u.buyerOrder, sheet:null, capture:false})),
    reset: onReset,
  };
  a.saveDraft = (id, pid, draft, via, by) => a.mut(id, o => applyDraft(o, pid, draft, via, by));
  a.share = id => a.mut(id, o => { if (o.status === 'draft') { o.status = 'shared'; o.sharedAt = Date.now(); log(o, 'salesperson', `Basket shared with ${BUYERS[o.buyerId].buyer} · closes in 48h`); } });
  a.submit = (id, by) => a.mut(id, o => { o.status = 'submitted'; o.submittedBy = by; o.submittedAt = Date.now(); log(o, by, by === 'client' ? 'Order submitted by the buyer' : 'Order submitted by the salesperson on the buyer’s behalf'); });
  a.confirm = id => a.mut(id, o => { o.status = 'confirmed'; o.confirmedAt = Date.now(); log(o, 'salesperson', 'Reviewed against guidelines and confirmed for production'); });
  return a;
}

function App({onReset}) {
  const [S, setS] = useState(loadState);
  const [ui, setUi] = useState({tab:'today', view:null, sheet:null, capture:false, div:'W', role:'sales', toast:null, lastOrder:null});
  useEffect(() => { saveState(S); }, [S]);
  const act = useMemo(() => makeActs(setS, setUi, onReset), []);
  const order = ui.view && S.orders[ui.view];
  const sh = ui.sheet;
  const sheet = !sh ? null
    : sh.type === 'size' ? html`<${SizeSheet} key=${sh.pid + (sh.actor || '')} sh=${sh} S=${S} act=${act}/>`
    : sh.type === 'picker' ? html`<${PickerSheet} sh=${sh} act=${act}/>`
    : sh.type === 'finish' ? html`<${FinishSheet} sh=${sh} S=${S} act=${act}/>`
    : sh.type === 'export' ? html`<${ExportSheet} sh=${sh} S=${S} act=${act}/>`
    : sh.type === 'history' ? html`<${HistorySheet} sh=${sh} S=${S} act=${act}/>`
    : sh.type === 'look' ? html`<${LookSheet} id=${sh.id} S=${S} ui=${ui} act=${act}/>`
    : sh.type === 'product' ? html`<${ProductSheet} key=${sh.pid} pid=${sh.pid} S=${S} ui=${ui} act=${act}/>`
    : sh.type === 'other' ? html`<${OtherSheet} id=${sh.id} act=${act}/>`
    : sh.type === 'about' ? html`<${AboutSheet} act=${act}/>` : null;
  const toast = ui.toast && html`<div class="toast" key=${ui.toastId} role="status"><${Icon} n="check" s=${16} w=${2.4}/>${ui.toast}</div>`;

  if (ui.role === 'buyer' && S.orders[ui.buyerOrder]) return html`<div class="app"><${BuyerView} S=${S} ui=${ui} act=${act}/>${sheet}${toast}</div>`;
  return html`<div class="app">
    ${order ? html`<${OrderView} S=${S} ui=${ui} act=${act} order=${order}/>` : html`
      <div class="screen">
        ${ui.tab === 'today' && html`<${Today} S=${S} act=${act}/>`}
        ${ui.tab === 'orders' && html`<${OrdersTab} S=${S} act=${act}/>`}
        ${ui.tab === 'catalogue' && html`<${CatalogueTab} act=${act}/>`}
      </div>
      <${TabBar} tab=${ui.tab} act=${act}/>`}
    ${ui.capture && order && html`<${Capture} order=${order} div=${BUYERS[order.buyerId].divs.includes(ui.div) ? ui.div : BUYERS[order.buyerId].divs[0]} act=${act}/>`}
    ${sheet}${toast}
  </div>`;
}

function Shell() {
  const [orient, setOrient] = useState('portrait');
  const [k, setK] = useState(0);
  const reset = () => { clearState(); setK(x => x + 1); };
  return html`<div class="shell">
    <aside class="side">
      <div class="side-brand">Vega</div>
      <p class="side-lede">Showroom order capture for wholesale. A first web mockup of the iOS app: photo match, fast size entry, live guideline checks per cluster, and a record of who submitted each order.</p>
      <div class="lbl">Try this</div>
      <ol class="steps">${GUIDE_STEPS.map(s => html`<li>${s}</li>`)}</ol>
      <div class="side-ctrls"><${Seg} opts=${[['portrait', 'Portrait'], ['landscape', 'Landscape']]} val=${orient} on=${setOrient}/><button class="linkbtn" onClick=${reset}>Reset demo</button></div>
      <p class="fine">Prototype. Photo recognition is simulated against a fictional catalogue (Maison Aurore). Orders save in this browser only.</p>
    </aside>
    <div class=${'device ' + orient}>
      <div class="statusbar"><span>9:41</span><span class="sb-r"><i style="height:5px"></i><i style="height:7px"></i><i style="height:9px"></i><i style="height:11px"></i><span class="sb-batt"><span></span></span></span></div>
      <${App} key=${k} onReset=${reset}/>
    </div>
  </div>`;
}

render(html`<${Shell}/>`, document.getElementById('root'));
</script>
</body>
</html>

/* no box around a line: lines sit on the page, split by a 1px grey rule; the photo starts flush with the Order heading and is larger (72px) */
/* the division's total under the last line: the same edge-to-edge rule above it, Total on the left, units and value on the right */
.ord-tot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 -16px;padding:15px 16px 14px;background:linear-gradient(color-mix(in srgb,var(--line) 55%,var(--bg)),color-mix(in srgb,var(--line) 55%,var(--bg))) 16px 0 / calc(100% - 16px) 1px no-repeat;font-size:var(--fs-body)}
.ord-tot-v{display:flex;align-items:baseline;gap:10px}.ord-tot-v span{font-size:var(--fs-caption);color:var(--muted)}
.ov-lines .grp-box .list > .sel{background:linear-gradient(color-mix(in srgb,var(--line) 55%,var(--bg)),color-mix(in srgb,var(--line) 55%,var(--bg))) 16px 0 / calc(100% - 16px) 1px no-repeat;margin:0 -16px;padding:15px 16px 14px;border-top:0} /* the rule, a shade lighter than --line, starts where the photo starts and runs to the right edge */
.ov-lines .grp-box .list > .sel:first-child{background:none;padding-top:4px}
.grp-box .sel .thumb{width:72px;height:72px}
.grp-box .sel-ctl{padding-left:84px;padding-right:0}
.grp-box .sel-x{margin-right:-8px}.grp-box .sel-info{padding:0}
/* the − n + stepper on an order line: no grey fill, a grey outline pill */

.sel,.sel *{font-variant-numeric:normal}
.sel .stp{background:none;border:0;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line)} /* a grey outline pill, like Edit sizes */.sel .stp button{border-radius:999px}
.grp-box .sel .thumb{-webkit-mask-box-image:var(--squircle) 20 / var(--r-m) stretch}
@supports (-webkit-mask-box-image:none){.grp-box .list,.ov-lines .grp-box .list > .sel,.grp-box .sel .thumb{border-radius:0}}
.grp-box .sel-edit{background:var(--bg);border:0;box-shadow:inset 0 0 0 1px var(--line);corner-shape:squircle}
/* budget rows (Buying guidelines, client sheet): 1px apart, names and amounts 14px regular, Total bold */
/* guidelines rows (client sheet, order, client view): like the budget rows, the tag next to the name and the rule in grey under it */
.list.gl .row{align-items:flex-start}.list.gl .row-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;white-space:normal}.list.gl .row-val{white-space:nowrap}
.gl-h{margin-top:26px;margin-bottom:8px}.sheet-body > .gl-h{margin-bottom:-4px} /* 10px above the rows, like Budget */
.list.gl,.list.gl *{font-variant-numeric:normal} /* plain figures: the 1 without a foot */
.list.gapped.g1{gap:2px}
/* budget and guidelines as one white box with a thin grey outline (a grey squircle around a white one, like the Order tile) and light rules between rows */
.g-box{padding:1px;background:var(--line);border-radius:var(--r-xl);-webkit-mask-box-image:var(--squircle) 20 / var(--r-xl) stretch}
.g-box > .list.gapped.g1{gap:0;background:var(--bg);border:0;border-radius:calc(var(--r-xl) - 1px);-webkit-mask-box-image:var(--squircle) 20 / calc(var(--r-xl) - 1px) stretch}
.g-box > .list.gapped > .row{background:var(--bg);border-top:0}.g-box > .list.gapped.gl > .row{padding-top:8px;padding-bottom:8px}.g-box > .list.gapped.gl > .row:first-child{padding-top:12px}.g-box > .list.gapped.gl > .row:last-child{padding-bottom:12px}.g-box > .list.gapped:not(.gl) > .row{padding-top:5px;padding-bottom:5px}.g-box > .list.gapped:not(.gl) > .row:first-child{padding-top:12px}.g-box > .list.gapped:not(.gl) > .row:last-child{padding-bottom:12px} /* the budget box has no rules between rows */
@supports (-webkit-mask-box-image:none){.g-box,.g-box > .list.gapped.g1{border-radius:0}}.list.g1 .row-title,.list.g1 .row-val{font-size:14px;font-weight:400}.list.g1 .row.tot .row-title,.list.g1 .row.tot .row-val{font-weight:700}
/* a look's pieces, like the order lines: no box, a light 1px rule edge to edge, a 72px squircle photo flush left; wholesale price only, › opens the piece */
.list.look-rows{background:none;border:0;gap:0;overflow:visible;-webkit-mask-box-image:none}
.look-rows > .row{width:auto;background:none;margin:0 -18px;padding:14px 12px 14px 18px;border-top:1px solid color-mix(in srgb,var(--line) 55%,var(--bg))}

.g-box > .list.look-rows{background:var(--bg);padding:4px 0;border-radius:calc(var(--r-xl) - 1px);-webkit-mask-box-image:var(--squircle) 20 / calc(var(--r-xl) - 1px) stretch}
@supports (-webkit-mask-box-image:none){.g-box > .list.look-rows{border-radius:0}}

.g-box > .look-rows > .row:first-child{background:none;padding-top:10px}

.look-rows .row-val{font-size:var(--fs-caption);font-weight:600} /* as the Collection card price */

.look-rows .thumb{width:72px;height:72px;border-radius:0;-webkit-mask-box-image:var(--squircle) 20 / var(--r-m) stretch}
.list.gapped{background:none;border:0;gap:2px}.list.gapped > .row{background:var(--surface);border-top:0}

.pc-wrap{display:flex;min-width:0} /* no shadow on the Collection cards */

// Spend against budget per division and per category; percentages are on each category's own budget
function kpi(order, div) {
  const b = BUYERS[order.buyerId];
  const byCat = {bags:0, rtw:0, shoes:0, acc:0};
  let total = 0, u = 0, open = 0;
  order.lines.forEach(l => { const p = P[l.pid]; if (p.div !== div) return; const v = lineValue(l); byCat[p.cat] += v; total += v; u += units(l.qty); if (!units(l.qty)) open++; });
  const budget = divBudget(b, div);
  const mix = CATS.map(c => { const bud = catBudget(b, div, c), v = byCat[c];
    return {cat:c, value:v, budget:bud, used: bud ? v / bud * 100 : 0, st: usedSt(v, bud)}; });
  const used = budget ? total / budget * 100 : 0;
  const mine = order.lines.filter(l => P[l.pid].div === div);
  const valueOf = has => mine.filter(l => has(P[l.pid])).reduce((a, l) => a + lineValue(l), 0);
  const rules = (RULES[div] || []).filter(r => PRODUCTS.some(p => p.div === div && r.has(p) && catBudget(b, div, p.cat) > 0)).map(r => { const v = valueOf(r.has), share = total ? v / total * 100 : 0;
    return {...r, value:v, share, limit: total * (r.max != null ? r.max : r.min) / 100, st: !total ? 'none' : r.max != null ? (share > r.max ? 'bad' : 'ok') : (share < r.min ? 'warn' : 'ok')}; });
  // required looks the client can buy: done when every piece is in the order with a quantity
  const looks = LOOKS.filter(l => l.div === div && l.req && l.items.every(([pid]) => available(b, P[pid]))).map(l => {
    const have = l.items.filter(([pid, c]) => mine.some(x => x.pid === pid && x.colour === c && units(x.qty))).length;
    return {l, have, n:l.items.length, done: have === l.items.length}; });
  const drops = Object.keys(DROPS).map(k => { const ls = mine.filter(l => P[l.pid].drop === k);
    return {k, units: ls.reduce((a, l) => a + units(l.qty), 0), value: ls.reduce((a, l) => a + lineValue(l), 0)}; });
  return {total, units:u, open, budget, used, bst: usedSt(total, budget), mix, rules, looks, drops};
}

const Seg = ({opts, val, on, full}) => html`<div class=${'seg' + (full ? ' full' : '')} role="tablist">${full && html`<span class="seg-ind" aria-hidden="true" style=${{'--n': opts.length, '--i': Math.max(0, opts.findIndex(([v]) => v === val))}}></span>`}${opts.map(([v, l]) => html`<button role="tab" aria-selected=${v === val} class=${v === val ? 'on' : ''} onClick=${() => on(v)}>${l}</button>`)}</div>`;

// media: photos lead the sheet edge to edge, no header, close on the top left
// page: full screen with a back button instead of a sheet over a scrim
function Sheet({title, sub, onClose, children, tall, foot, media, page, center, fade, bare, grouped, thumb}) {
  return html`${!page && html`<div class="scrim" onClick=${onClose}></div>`}
    <div class=${'sheet' + (tall ? ' tall' : '') + (media ? ' media' : '') + (page ? ' page' : '') + (fade ? ' fade' : '') + (grouped ? ' grouped' : '')} role="dialog" aria-label=${title}>
      ${!page && html`<div class="sheet-grab"></div>`}
      ${bare ? null : media ? html`<button class="sheet-x" onClick=${onClose} aria-label=${page ? 'Back' : 'Close'}><${Icon} n=${page ? 'back' : 'x'} s=${20} w=${2.2}/></button>`
        : center ? html`<div class="sheet-head center"><span></span><div class="sheet-title">${title}</div>
        <button class="icon-btn" onClick=${onClose} aria-label="Close"><${Icon} n="x"/></button>${sub && html`<div class="sheet-sub">${sub}</div>`}</div>`
        : html`<div class="sheet-head"><div class="sheet-tt">${thumb && html`<div class="sheet-thumb">${thumb}</div>`}<div style="min-width:0"><div class="sheet-title">${title}</div>${sub && html`<div class="sheet-sub">${sub}</div>`}</div></div>
        <button class="icon-btn" onClick=${onClose} aria-label="Close"><${Icon} n="x"/></button></div>`}
      <div class="sheet-body">${media}${children}</div>
      ${foot && html`<div class="sheet-foot">${foot}</div>`}
    </div>`;
}

function copyText(text, act) {
  const done = () => act.toast('Copied');
  try { navigator.clipboard.writeText(text).then(done, () => act.toast('Select the text to copy it')); } catch (e) { act.toast('Select the text to copy it'); }
}

/* =====================================================================
   KPI recap — live guideline check per division
   ===================================================================== */
// Each division and category against its own budget; women's and men's budgets are separate and never added up.
// Without an order it shows the assigned split only.
function Budgets({b, order, divs, head=true}) {
  const ds = divs || b.divs;
  return html`<div class="kpi">
    ${ds.map(d => html`<${BudDiv} b=${b} d=${d} k=${order && kpi(order, d)} head=${head}/>`)}
    ${order && html`<div class="kpi-foot">Each bar is spend against that category’s own budget. Styles without a quantity don’t count yet.</div>`}
  </div>`;
}
// One division's budget as a bill: a row per category the client buys (spend of budget, with a bar on the order), then Total.
// Every number is the same size; categories the client doesn't buy are left out rather than shown as zero.
function BudDiv({b, d, k, head=true}) {
  const db = divBudget(b, d), cats = CATS.filter(c => catBudget(b, d, c) > 0 || (k && k.mix.find(x => x.cat === c).value));
  const bar = (key, st, used, ic, label, value, of, w) => html`<div class=${'bpill ' + st + (isPop('o-' + b.id + '|' + d + '|' + key) ? ' pop' : '')} key=${key}><span class="bpill-fill" style=${{width: Math.min(used, 100) + '%'}}></span>
      <span class="bpill-ic"><${Icon} n=${ic} s=${22} w=${w}/></span><span class="bpill-t"><span class="bpill-l">${label}</span><span class="bpill-v"><b>${fmt(value)}</b> <span>${of}</span></span></span></div>`;
  if (!k) return html`<div class="bud-div">
    ${head && html`<div class="bud-head"><span>${DIV_LABEL[d]}</span></div>`}
    ${cats.map(c => html`<div class="bud-row cat"><span>${CAT_LABEL[c]}</span><span class="num">${fmt(catBudget(b, d, c))}</span></div>`)}
    <div class="bud-row cat bud-tot"><span>Total</span><span class="num">${fmt(db)}</span></div>
  </div>`;
  const bars = [...cats.map(c => { const cb = catBudget(b, d, c), m = k.mix.find(x => x.cat === c);
      return bar(c, m.st, m.used, c, CAT_LABEL[c], m.value, cb ? 'of ' + fmtK(cb) : 'no budget', 2); }),
    bar('tot', 'bpill-tot ' + usedSt(k.total, db), db ? k.total / db * 100 : 0, 'wallet', 'Total', k.total, db ? 'of ' + fmtK(db) : 'no budget')];
  return html`<div class="bud-div">
    ${head && html`<div class="bud-head"><span>${DIV_LABEL[d]}</span></div>`}
    ${bars.length > 3 ? html`<${BarStack} key=${d} bars=${bars}/>` : bars}
  </div>`;
}
// More than 3 budget bars: they stack 3 at a time, a page per column; swipe sideways to page through (it snaps a page at a time),
// the carousel dots under it show which page is on and can be tapped; a last page with fewer than 3 bars is filled with light grey placeholders
function BarStack({bars}) {
  const pages = [], [at, setAt] = useState(0), box = useRef(null);
  for (let i = 0; i < bars.length; i += 3) { const pg = bars.slice(i, i + 3); while (pg.length < 3) pg.push(html`<div class="bpill bpill-ph" aria-hidden="true"></div>`); pages.push(pg); }
  const step = el => el.firstElementChild.offsetWidth + 18; // a page plus the gap between pages
  const onScroll = e => { const el = e.currentTarget, i = Math.round(el.scrollLeft / step(el)); if (i !== at) setAt(i); };
  const go = i => { const el = box.current; if (el) el.scrollTo({left: i * step(el), behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); };
  return html`<div class="bstack">
    <div class="bstack-pages" ref=${box} onScroll=${onScroll}>${pages.map(pg => html`<div class="bstack-page">${pg}</div>`)}</div>
    <div class="bstack-dots" role="tablist" aria-label="Budget pages">${pages.map((_, i) => html`<button role="tab" aria-selected=${i === at} aria-label=${'Page ' + (i + 1)} class=${i === at ? 'on' : ''} onClick=${() => go(i)}></button>`)}</div>
  </div>`;
}

// The client's guidelines for one division: mix rules per family, required looks, and how the order splits across the drops.
// Grey rows 1px apart like the budget rows; they sit under the budget in the client sheet, the order and the client view (no PDF, no separate sheet)
function MixChecks({o, d}) {
  const k = kpi(o, d), drops = k.drops.filter(x => x.units > 0);
  const tag = (st, word) => html`<span class=${'gtag ' + st}>${word}</span>`;
  const row = (name, st, word, sub, num) => html`<div class="row"><div class="row-main"><div class="row-title">${name}${st && tag(st, word)}</div><div class="row-sub">${sub}</div></div><span class="row-val num">${num}</span></div>`;
  return html`<div class="g-box"><div class="list gapped g1 gl">
    ${k.rules.map(r => { const cap = r.max != null ? r.max : r.min, word = r.max != null ? 'max' : 'min', gap = r.max != null ? r.value - r.limit : r.limit - r.value;
      const sub = r.st === 'none' ? `${word} ${cap}% of the order` : `${Math.round(r.share)}% of the order · ${word} ${cap}%${gap > 0 ? ` · ${fmt(gap)} ${r.max != null ? 'over' : 'to go'}` : ''}`;
      return row(r.label, r.st !== 'none' && r.st, RULE_WORD[r.st], sub, fmt(r.value)); })}
    ${k.looks.map(x => row(lookNo(x.l), x.done ? 'ok' : 'warn', x.done ? 'Done' : 'Open', 'Required look · every piece', `${x.have} of ${x.n}`))}
    ${drops.map(x => row(DROPS[x.k].split(' · ')[0], null, null, `${DROPS[x.k].split(' · ')[1]} · ${x.units} ${x.units === 1 ? 'unit' : 'units'}`, fmt(x.value)))}
  </div></div>`;
}
const Guides = ({o, d}) => html`<h2 class="cat-h gl-h">Guidelines</h2><${MixChecks} o=${o} d=${d}/>`;

/* =====================================================================
   Looks: lookbooks
   ===================================================================== */
function LookTile({look}) {
  return html`<div class="look-tile"><img src=${lookSrc(look)[0]} alt=${`${lookNo(look)}, ${SHOW}`} loading="lazy" decoding="async" draggable="false"/></div>`;
}

// a division's budget per category as grey rows 1px apart, then a bold Total (client sheet)
const BudRows = ({b, d}) => html`<div class="g-box"><div class="list gapped g1">${CATS.filter(c => catBudget(b, d, c)).map(c => html`<div class="row"><div class="row-main"><div class="row-title">${CAT_LABEL[c]}</div></div><span class="row-val num">${fmt(catBudget(b, d, c))}</span></div>`)}
  <div class="row tot"><div class="row-main"><div class="row-title">Total</div></div><span class="row-val num">${fmt(divBudget(b, d))}</span></div></div></div>`;

// The black "Add look to order" button at the bottom of a look's sheet: with a client checked in it adds every piece they can buy (no quantities yet);
// with nobody checked in it asks which client, like adding a single style
// with a client: a spinner turns inside the button for a moment, then the pieces go in and the button reads "Added to order", greyed out; the sheet stays open
function LookAdd({l, o, act, cls='btn primary'}) {
  const [busy, setBusy] = useState(false);
  if (!o) return html`<button class=${cls} onClick=${() => act.sheet({type:'pick', item:{look:l.id}})}>Add look to order</button>`;
  const out = l.items.filter(([pid, c]) => !o.lines.some(x => x.pid === pid && x.colour === c)), can = out.filter(([pid]) => !canTake(o, P[pid]));
  const add = () => { setBusy(true); setTimeout(() => { act.selectLook(o.id, l, true); setBusy(false); }, 900); };
  if (busy) return html`<button class=${cls + ' busy'} disabled aria-label="Adding the look to the order"><span class="spin" aria-hidden="true"></span></button>`;
  return html`<button class=${cls} disabled=${!can.length} onClick=${add}>${can.length ? 'Add look to order' : out.length ? canTake(o, P[out[0][0]]) : 'Added to order'}</button>`;
}

function Today({S, ui, act}) {
  // Women always first, then Men, whoever is checked in
  return html`
    <header class="top top-bar mid"><h1 class="h1">Looks</h1></header>
    <div class="today-grid">
      ${['W', 'M'].map(d => html`<section class="sec">
        <div class="sec-head"><h2 class="cat-h">${SEASONS[0].short} ${DIV_LABEL[d]} Lookbook</h2></div>
        <div class="look-list">
          ${LOOKS.filter(l => l.div === d).map(l => html`<button class="look" onClick=${() => act.sheet({type:'look', id:l.id})}>
            <${LookTile} look=${l}/>
            <div class="look-h"><span class="look-t">${lookNo(l)}</span></div>
          </button>`)}
        </div>
      </section>`)}
    </div>`;
}

/* =====================================================================
   Home: the seller's showroom days and appointments
   ===================================================================== */
// Tapping the Home title reloads the app, so the home-screen version (no browser bar) can pick up a new release.
// A fresh query string skips the cached page; orders and the session are kept in local storage.
const reloadApp = () => location.replace(location.pathname + '?r=' + Date.now() + location.hash);
// a ten-day showroom campaign: three days done, today, six to come
const DAY_OFFS = [-3, -2, -1, 0, 1, 2, 3, 4, 5, 6];
const SHOW_DAYS = DAY_OFFS.map(off => { const d = new Date(); d.setDate(d.getDate() + off); return d; });
const TODAY_IDX = DAY_OFFS.indexOf(0);
const dayOf = b => b.day || 0;
const dayLabel = (b, long) => !dayOf(b) ? 'Today' : SHOW_DAYS[DAY_OFFS.indexOf(dayOf(b))].toLocaleDateString('en-GB', {weekday:long ? 'long' : 'short', day:'numeric'});
const myBuyers = S => Object.values(BUYERS).filter(b => b.rep === S.rep).sort((x, y) => dayOf(x) - dayOf(y) || x.time.localeCompare(y.time));
const isOngoing = a => !!(a && a.in && !a.out);
// the client the seller is with right now (checked in, not yet out)
const ongoingBuyer = S => myBuyers(S).find(b => isOngoing(S.appts[b.id]));
// after the visit the row shows where the order stands
const CheckPill = ({a, o}) => !a || !a.in ? (o && o.lines.length ? html`<${Pill} s=${o.status}/>` : null) : a.out ? (o ? html`<${Pill} s=${o.status}/>` : null)
  : html`<span class="pill s-in" title=${'Checked in at ' + hhmm(a.in)}>Ongoing</span>`;

// a marker that slides to the selected item of a row: measures the item matching sel inside box and moves ind (a .slide-ind) there;
// it jumps into place on first show and glides from then on
// tapping an item near the edge of a row that scrolls (el must be position:relative): the row slides so the next item (or the one before, on the left) shows too
const revealNear = (el, a) => { if (!el || !a || el.scrollWidth <= el.clientWidth) return;
  const item = e => e && !e.classList.contains('slide-ind') ? e : null, prev = item(a.previousElementSibling) || a, next = item(a.nextElementSibling) || a, pad = 18;
  const lo = prev.offsetLeft - pad, hi = next.offsetLeft + next.offsetWidth + pad - el.clientWidth;
  let to = el.scrollLeft < hi ? Math.min(hi, a.offsetLeft - pad) : el.scrollLeft > lo ? Math.max(lo, a.offsetLeft + a.offsetWidth + pad - el.clientWidth) : null;
  // a row that snaps to its items (Home days) would pull an in-between stop back, so stop on the first item edge past the target
  const snaps = getComputedStyle(el).scrollSnapType !== 'none' ? [...el.children].filter(item).map(e => e.offsetLeft - pad) : null;
  if (to != null && snaps) to = to >= el.scrollLeft ? (snaps.find(x => x >= to - 1) ?? to) : (snaps.filter(x => x <= to + 1).pop() ?? to);
  if (to != null) el.scrollTo({left:to, behavior:matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); };
const useSlide = sel => { const box = useRef(null), ind = useRef(null), last = useRef(null);
  const place = () => { const el = box.current, i = ind.current, a = el && el.querySelector(sel); if (!i) return;
    if (!a) { i.style.opacity = '0'; return; }
    // sub-pixel position and size (offsetLeft / offsetWidth round to whole pixels, so a regular-weight label could leave the marker 1px off)
    const r = a.getBoundingClientRect(), e = el.getBoundingClientRect(), s = i.style; s.opacity = '';
    s.setProperty('--x', r.left - e.left - el.clientLeft + el.scrollLeft + 'px'); s.setProperty('--y', r.top - e.top - el.clientTop + el.scrollTop + 'px'); s.setProperty('--w', r.width + 'px'); s.setProperty('--h', r.height + 'px');
    if (!i.dataset.anim) requestAnimationFrame(() => requestAnimationFrame(() => { i.dataset.anim = '1'; }));
    // tapping an item near the edge of a row that scrolls: the row slides so the next item (or the one before, on the left) shows too
    else if (a !== last.current) revealNear(el, a);
    last.current = a; };
  useLayoutEffect(place);
  useEffect(() => { addEventListener('resize', place); if (document.fonts) document.fonts.ready.then(place); return () => removeEventListener('resize', place); }, []);
  return [box, ind]; };

function CalendarTab({S, act}) {
  const [day, setDay] = useState(TODAY_IDX), [strip, dayInd] = useSlide('.day.on');
  const dayFace = (d, i) => html`<span>${d.toLocaleDateString('en-GB', {weekday:'short'})}</span><b>${d.getDate()}</b><span class="dno">Day ${i + 1}</span>`;
  // open with today in view, one past day showing to its left
  useEffect(() => { const el = strip.current, t = el && el.children[TODAY_IDX]; if (t) el.scrollLeft = t.offsetLeft - el.offsetLeft - t.offsetWidth - 8; }, []);
  const all = myBuyers(S).filter(b => dayOf(b) === DAY_OFFS[day]), now = all.filter(b => isOngoing(S.appts[b.id])), list = all.filter(b => !now.includes(b));
  const row = b => html`<button class="appt" onClick=${() => act.sheet({type:'appt', bid:b.id})}>
          <div class="appt-time">${b.time}</div>
          <div class="appt-main">
            <div class="appt-head"><span class="appt-shop">${b.shop}</span><${CheckPill} a=${S.appts[b.id]} o=${S.orders['o-' + b.id]}/></div>
            <div class="appt-buyer"><${Icon} n="pin" s=${12} w=${2.2}/>${b.city}</div>
            <div class="appt-catg">${b.divs.map(d => html`<div class="appt-cats"><b>${DIV_TAB[d]}</b>${buyingCats(b, d).map(c => CAT_SHORT[c]).join(' · ') || 'No budget yet'}</div>`)}</div>
          </div>
        </button>`;
  return html`
    <header class="top top-bar mid"><h1 class="h1"><button class="h1-btn" onClick=${reloadApp} aria-label="Home. Tap to reload the app">Home</button></h1>
      <button class="avatar me" onClick=${() => act.sheet({type:'profile'})} aria-label=${'Profile, ' + REPS[S.rep].name}>${REPS[S.rep].ini}</button>
    </header>
    <section class="sec">
      <div class="days" role="tablist" ref=${strip}>${SHOW_DAYS.map((d, i) => html`<button role="tab" aria-selected=${i === day} class=${'day' + (i === day ? ' on' : '')} onClick=${() => setDay(i)}>${dayFace(d, i)}</button>`)}
        <span class="slide-ind" ref=${dayInd} aria-hidden="true"><span class="slide-copy">${SHOW_DAYS.map((d, i) => html`<button class="day" tabindex="-1">${dayFace(d, i)}</button>`)}</span></span></div>
      ${!all.length && html`<div class="empty">No appointments on this day.</div>`}
      ${now.length > 0 && html`<div class="lbl appt-lbl">Now</div><div class="appts-sh"><div class="appts now">${now.map(row)}</div></div>`}
      ${list.length > 0 && html`${now.length > 0 && html`<div class="lbl appt-lbl">Today</div>`}<div class="appts-sh"><div class="appts">${list.map(row)}</div></div>`}
    </section>`;
}

// Before the check-in only Check in shows, at the bottom where the thumb is; checking in opens the Collection for that client.
function ApptSheet({sh, S, ui, act}) {
  const b = BUYERS[sh.bid], o = S.orders['o-' + b.id], a = S.appts[b.id] || {}, isIn = isOngoing(a);
  const foot = !a.in ? html`<button class="btn go" onClick=${() => act.checkIn(b.id)}><${Icon} n="check" s=${18} w=${2.2}/>Check in</button>`
    : isIn ? html`<button class="btn ring leave-txt" onClick=${() => act.sheet({type:'leave', bid:b.id})}>Leave</button>
        <button class="btn primary" onClick=${() => act.addProducts(b.id)}>Add products</button>`
    : html`<button class="btn go" onClick=${() => act.checkIn(b.id)}><${Icon} n="check" s=${18} w=${2.2}/>Check in again</button>`;
  return html`<${Sheet} tall center fade title=${b.shop} sub=${dayLabel(b, true)} onClose=${act.close} foot=${foot}>
    ${o && html`<div class="sh-tiles"><${ApptOrder} o=${o} b=${b} act=${act}/></div>`}

    <h2 class="cat-h gl-h">Budget</h2>

    <${Guides} o=${o || {buyerId:b.id, lines:[]}} d=${divOf(b, ui)}/>
    <label class="field sh-sec"><span class="cat-h">Notes</span>
      <textarea class="inp area" placeholder="Add a note" value=${a.notes || ''} onInput=${e => act.note(b.id, e.target.value)}></textarea>
      <span class="small muted">Saved automatically</span></label>
  <//>`;
}

// the order behind an appointment: where it stands; tap to open it

}

  <//>`;
}

// Profile → Order history: every order of the signed-in seller, newest status first, filtered All / Draft / Sent; a row opens the order

/* =====================================================================
   Catalogue — in a visit, only the styles that client can buy
   ===================================================================== */
// every word must match somewhere: name, code, family, category, material, colours or keywords ("black leather bag")
const matches = (p, ql) => { if (!ql) return true;
  const hay = [p.name, p.code, p.family, CAT_LABEL[p.cat], p.material, p.keywords, ...p.colours].join(' ').toLowerCase();
  return ql.split(/\s+/).every(w => hay.includes(w.length > 3 ? w.replace(/s$/, '') : w)); };
// the colour a search names ("orange" → Sunrise Orange), so results show that colour
const hitColour = (p, ql) => { const ws = (ql || '').split(/\s+/).filter(w => w.length > 2); return p.colours.find(c => ws.some(w => c.toLowerCase().includes(w))); };
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-');
const SUBTYPE = {rtw:p => p.family, acc:p => p.family === 'Puzzle' ? 'Small leather goods' : p.family};

function ProductList({div, q, b, season, onPick}) {
  const ql = q.trim().toLowerCase();
  const items = PRODUCTS.filter(p => (!div || p.div === div) && (!season || p.season === season) && (!b || available(b, p)) && matches(p, ql));
  if (!items.length) return html`<div class="empty">${ql ? `No styles match “${q}”. Try a style, code, material or colour.` : `No ${DIV_LABEL[div].toLowerCase()} styles in this collection.`}</div>`;
  return html`<div class="list">${items.map(p => html`<button class="row" onClick=${() => onPick(p)}>
    <${Thumb} pid=${p.id} colour=${hitColour(p, ql) || p.colours[0]}/>
    <div class="row-main"><div class="row-title">${p.name}</div><div class="row-sub"><span class="code">${p.code}</span> · ${div ? CAT_LABEL[p.cat] : DIV_TAB[p.div] + ' · ' + CAT_SHORT[p.cat]}</div></div>
    <div class="row-side"><span class="row-val">${fmt(p.price)}</span></div>
  </button>`)}</div>`;
}

// Three levels, two controls: Women / Men is the page title, categories are one sticky row, and families are headings in the grid
function CatalogueTab({S, ui, act}) {
  // both divisions are always there; with a client checked in it opens on what they buy
  const so = activeOrder(S, ui), sb = so && BUYERS[so.buyerId], divs = ['W', 'M'];
  const [div, setDiv] = useState(sb ? sb.divs[0] : 'W'), [cat, setCat] = useState(null), [busy, setBusy] = useState(false);
  // collection tabs sit above the category pills; All shows every collection the client can buy
  const season = SEASONS.find(x => x.id === ui.catSeason) || {id:null, name:'All collections'}, filtered = !!(ui.catDrop || ui.catTag || ui.catMat);
  const items = PRODUCTS.filter(p => p.div === div && (!season.id || p.season === season.id) && (!sb || available(sb, p)) && (!ui.catDrop || p.drop === ui.catDrop) && hasTag(p, ui.catTag) && hasMat(p, ui.catMat));
  // category, then a sub-heading only where the family is a kind of product (Dresses, Hats); bags and shoes families are lines (Puzzle, Pebble), so they just sit together
  const all = CATS.map(c => { const ps = items.filter(p => p.cat === c), sub = SUBTYPE[c];
    return {cat:c, n:ps.length, fams:sub ? [...new Set(ps.map(sub))].map(f => ({f, id:c + '-' + slug(f), ps:ps.filter(p => sub(p) === f)}))
      : [...new Set(ps.map(p => p.family))].map(f => ({f:null, id:c + '-' + slug(f), ps:ps.filter(p => p.family === f)}))}; }).filter(g => g.n);
  // a pill filters the page to one category (All shows every one, each under its heading; a single category has no heading, the pill already names it); a category the division doesn't have falls back to All
  const on = all.some(g => g.cat === cat) ? cat : null, groups = on ? all.filter(g => g.cat === on) : all;
  const ref = useRef(null), t = useRef(0), nav = useRef(null), [collBox, collInd] = useSlide('.coll-t.on'), [catBox, catInd] = useSlide('.cn-cat.on');
  // the category bar slides away while scrolling down and slides back in from the top as soon as you scroll up
  useEffect(() => { const sc = ref.current && ref.current.closest('.screen'); if (!sc) return; let last = sc.scrollTop;
    const on = () => { const el = nav.current; if (!el) return; const y = sc.scrollTop, d = y - last;
      // in its own place (not yet stuck) it always shows; once stuck, down hides it, up brings it back
      const home = el.parentElement.getBoundingClientRect().top - sc.getBoundingClientRect().top + y, stuck = y > home + 4;
      // the bounce past the bottom edge (iOS) is not a scroll up
      if (y >= sc.scrollHeight - sc.clientHeight - 2 && d < 0) { last = y; return; }
      if (!stuck || d < -4) el.classList.remove('hid'); else if (d > 4) el.classList.add('hid');
      if (Math.abs(d) > 4) last = y; };
    sc.addEventListener('scroll', on, {passive:true}); return () => sc.removeEventListener('scroll', on); }, []);
  useEffect(() => () => clearTimeout(t.current), []);
  const top = () => { const sc = ref.current && ref.current.closest('.screen'); if (sc) sc.scrollTop = 0; };
  // a short skeleton while the page swaps, so the change reads as a new list
  const load = () => { clearTimeout(t.current); setBusy(true); top(); t.current = setTimeout(() => setBusy(false), 450); };
  const pickCat = c => { if (c === on) return; setCat(c); load(); };
  const pickDiv = d => { if (d === div) return; setDiv(d); load(); };
  const pickSeason = id => { if (id === season.id) return; act.set({catSeason:id}); load(); };
  return html`
    <header class="top top-bar mid"><h1 class="h1 div-title" role="tablist" aria-label="Collection">${divs.map(d => html`<button role="tab" aria-selected=${d === div} class=${d === div ? 'on' : ''} onClick=${() => pickDiv(d)}>${DIV_TAB[d]}</button>`)}</h1>
      <div class="hd-acts"><button class=${'icon-btn hd-ic hd-filter' + (filtered ? ' on' : '')} onClick=${() => act.sheet({type:'filter'})} aria-label=${['Filters', [ui.catDrop && DROPS[ui.catDrop].split(' · ')[0], ui.catTag && TAG_OPTS.find(x => x[0] === ui.catTag)[1], ui.catMat && MATS.find(x => x[0] === ui.catMat)[1]].filter(Boolean).join(', ')].filter(Boolean).join(': ')}><span class="hd-dot"><${Icon} n="filter" s=${22} w=${2}/></span></button>
        <button class="icon-btn hd-ic" onClick=${() => { primeKeyboard(); act.set({search:true}); }} aria-label="Search the collection"><${Icon} n="search" s=${24} w=${2}/></button></div></header>
    <section class="sec">
      ${(ui.catDrop || ui.catTag || ui.catMat) && html`<div class="fchips">
        ${ui.catDrop && html`<button class="fchip" onClick=${() => act.set({catDrop:null})} aria-label="Clear drop filter">${DROPS[ui.catDrop].split(' · ')[0]} · ${dropWhen(ui.catDrop).replace('Delivers ', '')}<${Icon} n="x" s=${14} w=${2.2}/></button>`}
        ${ui.catTag && html`<button class="fchip" onClick=${() => act.set({catTag:null})} aria-label="Clear priority filter">${TAG_OPTS.find(x => x[0] === ui.catTag)[1]}<${Icon} n="x" s=${14} w=${2.2}/></button>`}
        ${ui.catMat && html`<button class="fchip" onClick=${() => act.set({catMat:null})} aria-label="Clear material filter">${MATS.find(x => x[0] === ui.catMat)[1]}<${Icon} n="x" s=${14} w=${2.2}/></button>`}
      </div>`}
      <div ref=${ref}>
        <nav class="cat-nav" ref=${nav} aria-label="Collections and categories">
          <div class="coll-tabs" role="tablist" aria-label="Collections" ref=${collBox}>${SEASONS.map(x => [x.id, x.short, x.name]).map(([id, t, full]) => html`<button role="tab" aria-selected=${season.id === id} aria-label=${full} class=${'coll-t' + (season.id === id ? ' on' : '')} onClick=${() => pickSeason(id)}>${t}</button>`)}<span class="slide-ind" ref=${collInd} aria-hidden="true"></span></div>
          <div class="cn-row" ref=${catBox}>
            ${[null, ...all.map(g => g.cat)].map(c => html`<button role="tab" aria-selected=${on === c} class=${'cn-cat' + (on === c ? ' on' : '')} onClick=${() => pickCat(c)}>${c ? CAT_LABEL[c] : 'All'}</button>`)}
            <span class="slide-ind" ref=${catInd} aria-hidden="true"><span class="slide-copy">${[null, ...all.map(g => g.cat)].map(c => html`<button class="cn-cat" tabindex="-1">${c ? CAT_LABEL[c] : 'All'}</button>`)}</span></span></div>
        </nav>
        ${!items.length ? html`<div class="empty">No ${DIV_LABEL[div].toLowerCase()} styles in this collection${filtered ? ' with these filters' : ''}.</div>`
        : busy ? html`<div class="cat-main" aria-busy="true" aria-label="Loading">${!on && html`<div class="sk-h"></div>`}<div class="pgrid">${[0, 1, 2, 3, 4, 5].map(i => html`<div class="sk-card" key=${i}><div class="sk-img"></div><div class="sk-l"></div><div class="sk-l s"></div><div class="sk-l s"></div></div>`)}</div></div>`
        : html`<div class="cat-main">${groups.map(g => html`<div class="cat-sec">
          ${!on && html`<h2 class="cat-h">${CAT_LABEL[g.cat]}</h2>`}
          <div class="pgrid">${g.fams.map(f => html`${f.f && html`<div class="fam-h" key=${f.id}>${f.f}</div>`}${f.ps.map(p => html`<${PCard} key=${p.id} p=${p} o=${so} act=${act}/>`)}`)}</div>
        </div>`)}</div>`}
      </div>
    </section>`;
}

// iOS raises the keyboard only for a focus inside the tap itself: focus a stand-in field now, the search field takes over once it renders
function primeKeyboard() {
  const t = document.createElement('input');
  t.setAttribute('aria-hidden', 'true'); t.style.cssText = 'position:fixed;left:0;top:50%;width:1px;height:1px;opacity:0;font-size:17px;border:0;padding:0';
  document.body.appendChild(t); t.focus(); setTimeout(() => t.remove(), 1000);
}
const SEARCH_SUGG = ['Sunrise Orange', 'Leather bags', 'Sneakers', 'Cashmere'];
// Search: recents (a photo of the first match), suggestions, and results as you type; the field sits above the keyboard
function SearchPage({S, ui, act}) {
  const so = activeOrder(S, ui), sb = so && BUYERS[so.buyerId], season = ui.catSeason;
  const [q, setQ] = useState(''), [kb, setKb] = useState(0), inp = useRef(null), page = useRef(null);
  const recents = ui.recents || [], ql = q.trim().toLowerCase();
  const pool = PRODUCTS.filter(p => (!season || p.season === season) && (!sb || available(sb, p)));
  const n = ql ? pool.filter(p => matches(p, ql)).length : 0;
  const remember = t => { t = t.trim(); if (t) act.set({recents:[t, ...recents.filter(r => r.toLowerCase() !== t.toLowerCase())].slice(0, 6)}); };
  const use = t => { setQ(t); inp.current && inp.current.focus(); };
  useEffect(() => { inp.current && inp.current.focus(); }, []);
  // keep the field just above the keyboard: lift the page by however much of it the keyboard covers
  useEffect(() => { const vv = window.visualViewport; if (!vv) return;
    const fit = () => { const el = page.current && page.current.parentElement; if (!el) return;
      const r = el.getBoundingClientRect(); setKb(Math.max(0, Math.round(r.bottom - vv.offsetTop - vv.height))); };
    fit(); vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit);
    return () => { vv.removeEventListener('resize', fit); vv.removeEventListener('scroll', fit); }; }, []);
  const shot = t => { const tl = t.toLowerCase(), p = pool.find(x => matches(x, tl)) || PRODUCTS.find(x => matches(x, tl));
    return p ? imgSrc(p, hitColour(p, tl) || p.colours[0]) : null; };
  return html`<div class="srch" ref=${page} style=${kb ? `bottom:${kb}px` : ''} role="dialog" aria-label="Search">
    <div class="srch-body">

          <div class="rec-row">${recents.map(t => { const src = shot(t); return html`<button class="rec" onClick=${() => use(t)}>${src && html`<img src=${src} alt="" draggable="false"/>`}<span>“${t}”</span></button>`; })}</div>`}
        <div class="sugg">${SEARCH_SUGG.map(t => html`<button onClick=${() => use(t)}>${t}</button>`)}</div>`
      : html`<div class="srch-n">${n} ${n === 1 ? 'style' : 'styles'}${sb ? ` ${sb.shop} can buy` : ''}</div>
        <${ProductList} q=${q} b=${sb} season=${season} onPick=${p => { remember(q); act.sheet({type:'product', pid:p.id, colour:hitColour(p, ql)}); }}/>`}
    </div>
    <div class="srch-bar">
      <label class="search"><${Icon} n="search" s=${20}/><input ref=${inp} type="search" enterkeyhint="search" placeholder="Search the collection" aria-label="Search by style, code, material, colour or keyword"
        value=${q} onInput=${e => setQ(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter') { remember(q); e.target.blur(); } }}/></label>
      <button class="srch-x" onClick=${() => act.set({search:false})} aria-label="Close search"><${Icon} n="x"/></button>
    </div>
  </div>`;
}

// Signing in asks for the seller's 4-digit code: the passcode set in Profile (the avatar on Home), or any 4 digits until one is set.
// check returns an error to show (and the pad clears), or nothing to accept the code
function PinPad({rep, title, check, onDone, onBack}) {
  const [pin, setPin] = useState(''), [bad, setBad] = useState(null);
  const press = k => { setBad(null); setPin(p => k === 'del' ? p.slice(0, -1) : p.length < 4 ? p + k : p); };
  useEffect(() => { if (pin.length === 4) { const t = setTimeout(() => { const err = check && check(pin);
    if (err) { setBad(err); setPin(''); } else onDone(pin); }, 180); return () => clearTimeout(t); } }, [pin]);
  useEffect(() => { const key = e => { if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); };
    window.addEventListener('keydown', key); return () => window.removeEventListener('keydown', key); }, []);
  return html`<div class="pin">
    <span class="avatar">${rep.ini}</span>
    <div class=${'pin-t' + (bad ? ' bad' : '')} role="status">${bad || title || `Enter ${rep.name}’s code`}</div>
    <div class=${'pin-dots' + (bad ? ' bad' : '')} aria-label=${pin.length + ' of 4 digits entered'}>${[0, 1, 2, 3].map(i => html`<i class=${i < pin.length ? 'on' : ''}></i>`)}</div>
    <div class="pin-pad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', 'back', '0', 'del'].map(k => k === 'back'
      ? html`<button class="pin-k txt" onClick=${onBack}>Cancel</button>`
      : k === 'del' ? html`<button class="pin-k txt" onClick=${() => press('del')} aria-label="Delete" disabled=${!pin}><${Icon} n="back" s=${22}/></button>`
      : html`<button class="pin-k" onClick=${() => press(k)}>${k}</button>`)}</div>
  </div>`;
}

function PickBuyerSheet({S, sh, act}) {
  const it = sh.item, look = it && it.look && LOOKS.find(x => x.id === it.look), p = it && P[look ? look.items[0][0] : it.pid];
  const all = myBuyers(S), secs = [['Today', all.filter(b => !dayOf(b))], ['Past', all.filter(b => dayOf(b) < 0)], ['Upcoming', all.filter(b => dayOf(b) > 0)]]; // today, then past, then upcoming
  const row = b => { const o = S.orders['o-' + b.id], why = p && canTake(o || {buyerId:b.id, status:'draft'}, p);
    return html`<button class="row" disabled=${!!why} onClick=${() => it ? act.addFor(b.id, it) : act.checkIn(b.id, true)}>
      <div class="row-main"><div class="row-title">${b.shop}</div><div class="row-sub">${SHOW_DAYS[DAY_OFFS.indexOf(dayOf(b))].toLocaleDateString('en-GB', {weekday:'short', day:'numeric'})}</div></div>
      <div class="row-side">${why ? html`<span class="small muted">${why}</span>` : o && o.status !== 'none' && html`<${Pill} s=${o.status}/>`}<span class="chev"><${Icon} n="next" s=${18} w=${2}/></span></div>
    </button>`; };
  // a section per part of the show, each in a white box with a grey outline, the date under every name, Today's too (no time or city)
  const thumb = !it ? null : look ? html`<img src=${lookSrc(look)[0]} alt=""/>` : html`<${Thumb} pid=${it.pid} colour=${it.colour}/>`;
  return html`<${Sheet} tall grouped thumb=${thumb} title=${it ? 'Add to order' : 'Select client'} sub=${!it ? null : look ? `${lookNo(look)} · ${look.items.length} pieces` : `${p.name} · ${cname(it.colour)}`} onClose=${act.close}>
    ${secs.filter(([, l]) => l.length).map(([h, l]) => html`<section class="grp-sec"><h3 class="grp-h">${h}</h3><div class="grp pick"><div class="grp-in">${l.map(row)}</div></div></section>`)}
  <//>`;
}

function NewBuyerSheet({S, sh, act}) {
  const [f, setF] = useState({shop:'', city:'', divs:'WM', W:'40000', M:'20000'});
  const set = k => e => setF(x => ({...x, [k]: e.target.value}));
  const divs = f.divs === 'WM' ? ['W', 'M'] : [f.divs];
  const ok = f.shop.trim();
  const start = () => {
    const shop = f.shop.trim(), id = 'n' + uid();
    const code = (shop.replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase() || 'NEW') + String(10 + hash(id) % 90);
    // a walk-in client has no back-office profile yet, so it starts on the base one
    act.newBuyer({id, rep:S.rep, added:true, shop, city:f.city.trim() || 'Paris', cluster:CLUSTERS[0], divs,
      budget:Object.fromEntries(divs.map(d => [d, Math.max(0, Number(f[d]) || 0)])), time:hhmm(Date.now()), code}, sh.item, sh.appt, sh.stay);
  };
  return html`<${Sheet} tall title="New session" sub="Start an order with a client" onClose=${act.close}
    foot=${html`<button class=${'btn ' + (sh.appt ? 'primary' : 'go')} disabled=${!ok} onClick=${start}>${!sh.appt && html`<${Icon} n="check" s=${18} w=${2.2}/>`}Start session</button>`}>
    <label class="field"><span class="lbl">Shop</span><input class="inp" placeholder="e.g. Maison Dubois" value=${f.shop} onInput=${set('shop')} autocomplete="off"/></label>
    <label class="field"><span class="lbl">City</span><input class="inp" placeholder="e.g. Paris" value=${f.city} onInput=${set('city')} autocomplete="off"/></label>
    <div class="field"><span class="lbl">Buying for</span><${Seg} full opts=${[['WM', 'Women + Men'], ['W', 'Women'], ['M', 'Men']]} val=${f.divs} on=${v => setF(x => ({...x, divs:v}))}/></div>
    ${divs.map(d => html`<label class="field"><span class="lbl">${DIV_TAB[d]} budget (€)</span><input class="inp" inputmode="numeric" value=${f[d]} onInput=${set(d)}/></label>`)}
  <//>`;
}

// back-office priority filter: Must have, Essential, or the styles with no tag
const TAG_OPTS = [[null, 'All'], ['must', TAGS.must], ['ess', TAGS.ess], ['none', 'Standard']];
const hasTag = (p, t) => !t || (t === 'none' ? !p.tag : p.tag === t);
// "Delivers 15 January 2027": SS27 drops deliver in the new year
const dropWhen = k => { const [d, m] = DROPS[k].split(' · delivers ')[1].split(' '); return `Delivers ${d} ${MONTHS[m] || m} 2027`; };

function FilterSheet({ui, act}) {
  // picking an option keeps the sheet open, so collection, drop and tag can be set together
  const group = (label, key, opts) => html`<div class="lbl">${label}</div>
    <div class="list">${opts.map(([v, t, sub]) => html`<button class="row opt" onClick=${() => act.set({[key]:v})} aria-pressed=${v === ui[key]}>
      <div class="row-main"><div class="row-title">${t}</div>${sub && html`<div class="row-sub">${sub}</div>`}</div>
      <div class="row-side">${v === ui[key] && html`<${Icon} n="check" s=${20} w=${2.4}/>`}</div>
    </button>`)}</div>`;
  return html`<${Sheet} title="Filters" onClose=${act.close}>
    ${group('Drop', 'catDrop', [[null, 'All drops'], ...Object.keys(DROPS).map(k => [k, DROPS[k].split(' · ')[0], dropWhen(k)])])}
    ${group('Priority', 'catTag', TAG_OPTS)}
    ${group('Material', 'catMat', MATS)}
  <//>`;
}

// Product page: with a client in session, sizes and quantities are set right here and save at once. Entering the first
// quantity on a colour puts that colour in the order; there is no Add button.
// Copy scale keeps this style's size scale (per size range, until another one is copied); Paste scale fills it on the next style.
function ProductSheet({pid, colour, orderId, back, S, ui, act}) {
  const p = P[pid], o = orderId ? S.orders[orderId] : activeOrder(S, ui), b = o && BUYERS[o.buyerId], why = o && canTake(o, p);
  const [c, setC] = useState(() => { const l = o && o.lines.find(x => x.pid === pid); return colour || (l ? l.colour : p.colours[0]); }), [colBox, colInd] = useSlide('.colour.on');
  // a colour chip: swatch, name, code and, when that colour is in the order, a green check (drawn twice: the chip and its white copy inside the sliding black pill)
  const chip = x => html`<span class="sw" style=${{background:COL[x][0], color:inkOn(COL[x][0])}}>${lineOf(x) && html`<${Icon} n="check" s=${15} w=${2.6}/>`}</span><span class="nm">${x}</span><span class="code">${COL[x][1]}</span>`;
  const looks = LOOKS.filter(l => l.items.some(([x]) => x === pid));
  const pick = () => act.sheet({type:'pick', item:{pid, colour:c, via:'search', ret:'product'}}); // once a client is picked, back to this page
  const lineOf = x => o && o.lines.find(l => l.pid === pid && l.colour === x), line = lineOf(c);
  const q = line ? line.qty : {}, u = units(q), sized = p.sizes.length > 1, skey = p.sizes.join(' ');
  const clean = x => Object.fromEntries(Object.entries(x).filter(([, n]) => n > 0).map(([k, n]) => [k, Math.min(999, n)]));
  const setQ = next => { const n = clean(next);
    if (line) act.setQty(o.id, line.id, n); else if (units(n)) act.select(o.id, pid, c, 'search', n); };
  const close = back ? () => act.sheet(back) : act.close;
  const setQty = (sz, n) => setQ({...q, [sz]: Math.max(0, n)});
  const last = sized && ui.lastScale && ui.lastScale[skey], same = last && qkey(last) === qkey(clean(q));
  const copy = () => { act.set({lastScale: {...ui.lastScale, [skey]: clean(q)}}); act.toast('Scale copied', true); }; // from the top, like the quantity messages
  const edit = o && !why;
  const val = n => `${n} ${n === 1 ? 'unit' : 'units'}`;
  // tap the number to type it on the number pad (up to 999); + and − still step by one
  const num = (sz, cls = '') => html`<input class=${'qty num ' + cls + (q[sz] ? '' : ' zero')} inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" value=${q[sz] || 0}
    aria-label=${sz === 'U' ? 'Quantity' : 'Quantity, size ' + sz} onFocus=${e => e.target.select()} onKeyDown=${e => e.key === 'Enter' && e.target.blur()}
    onInput=${e => setQty(sz, Math.min(999, parseInt(e.target.value.replace(/\D/g, ''), 10) || 0))}/>`;
  return html`<${Sheet} tall title=${p.name} onClose=${close}
    media=${html`<div class="pd-media"><${Carousel} p=${p} colour=${c} at=${ui.photoAt} onOpen=${i => act.set({zoom:{pid, colour:c, i}})}/></div>`}>
    <div class="pd-head"><${TagLine} p=${p}/><h1 class="pd-name">${p.name}</h1></div>
    <div class="colours" ref=${colBox}>${p.colours.map(x => html`<button class=${'colour' + (x === c ? ' on' : '')} onClick=${() => setC(x)}>${chip(x)}</button>`)}
      <span class="slide-ind" ref=${colInd} aria-hidden="true"><span class="slide-copy">${p.colours.map(x => html`<button class="colour" tabindex="-1">${chip(x)}</button>`)}</span></span></div>
    ${edit && html`<div class="pd-qty">
      ${p.sizes.length > 1 ? html`
        <div class="sizes">${p.sizes.map(sz => html`<div class=${'size-cell' + (q[sz] ? ' has' : '')}>
          <div class="sz">${sz}</div>
          <button class="step" aria-label=${'Add one size ' + sz} onClick=${() => setQty(sz, (q[sz] || 0) + 1)}><${Icon} n="plus" s=${20} w=${2}/></button>
          ${num(sz)}
          <button class="step" aria-label=${'Remove one size ' + sz} onClick=${() => setQty(sz, (q[sz] || 0) - 1)}><${Icon} n="minus" s=${20} w=${2}/></button>
        </div>`)}</div>
        <div class="quick">
          <button class="qbtn" disabled=${!u || same} onClick=${copy}><${Icon} n="copy" s=${15} w=${2}/>Copy scale</button>
          <button class="qbtn" disabled=${!last || same} onClick=${() => setQ(last)}>Paste scale</button>
          <button class="qbtn" disabled=${!u} onClick=${() => setQ({})}>Clear</button></div>` : html`
        <div class="single">
          <button class="step lg" aria-label="Remove one" onClick=${() => setQty('U', (q.U || 0) - 1)}><${Icon} n="minus" s=${26} w=${2}/></button>
          ${num('U', 'xl')}
          <button class="step lg" aria-label="Add one" onClick=${() => setQty('U', (q.U || 0) + 1)}><${Icon} n="plus" s=${26} w=${2}/></button>
        </div>
`}
    </div>`}
    <div class="pd-cta">${!o ? html`<div class="g-box"><div class="pd-pick"><${Icon} n="checkin" s=${28}/><b>No client checked in</b><div>Pieces you add go into their order.</div>
        <button class="btn black" onClick=${pick}>Select client</button></div></div>`
      : why ? html`${line && html`<div class="pd-in">In order · ${u ? val(u) : 'no quantity'}</div>`}<button class="btn black" disabled>${b.shop} · ${why}</button>`
      : line ? html`<button class="btn outline danger" onClick=${() => act.unselect(o.id, pid, c)}>Remove from order</button>`
      : null}</div>
    <div class="g-box"><div class="facts">
      <div class="pd-hl"><div><small>Wholesale</small><b class="num">${fmt(p.price)}</b></div><div><small>Retail</small><b class="num">${fmt(p.rrp)}</b></div></div>
      <div><span>Code</span><span>${p.code}</span></div>
      ${p.material && html`<div><span>Material</span><span>${p.material}</span></div>`}
      <hr class="fx-sep"/>
      <div><span>Division</span><span>${p.div === 'W' ? 'Womenswear' : 'Menswear'}</span></div>
      <div><span>Category</span><span>${CAT_LABEL[p.cat]}</span></div>
      <div><span>Family</span><span>${p.family}</span></div>
      <hr class="fx-sep"/>
      <div><span>Sizes</span><span>${p.sizes.join(' · ')}</span></div>
      <div><span>Delivery</span><span>${dropName(p.drop)}</span></div>
      ${looks.length > 0 && html`<hr class="fx-sep"/><div><span>Appears in</span><span>${looks.map((l, i) => html`${i ? ', ' : ''}<button class="plain" onClick=${() => act.sheet({type:'look', id:l.id})}>${lookNo(l)}</button>`)}</span></div>`}
    </div></div>
  <//>`;
}

/* =====================================================================

function SizeSheet({sh, S, act}) {
  const order = S.orders[sh.orderId], p = P[sh.pid], b = BUYERS[order.buyerId];
  const actor = sh.actor || 'salesperson';
  const init = useMemo(() => Object.fromEntries(p.colours.map(c => [c, {...((order.lines.find(l => l.pid === p.id && l.colour === c) || {}).qty || {})}])), []);
  const [draft, setDraft] = useState(init);
  const existing = order.lines.some(l => l.pid === p.id);
  const [col, setCol] = useState(sh.colour || (order.lines.find(l => l.pid === p.id) || {}).colour || p.colours[0]), [colBox, colInd] = useSlide('.colour.on');
  const chip = c => html`<span class="sw" style=${{background:COL[c][0]}}></span><span class="nm">${c}</span><span class="code">${COL[c][1]}</span>${units(draft[c]) > 0 && html`<span class="cnt">${units(draft[c])}</span>`}`;
  const locked = !available(b, p);
  // once a part is sent it is read-only for the seller and the client alike
  const readOnly = partLocked(order, p.div);
  const q = draft[col] || {};
  const dirty = JSON.stringify(Object.fromEntries(Object.entries(draft).map(([c, x]) => [c, qkey(Object.fromEntries(Object.entries(x).filter(([, n]) => n > 0)))]))) !==
                JSON.stringify(Object.fromEntries(Object.entries(init).map(([c, x]) => [c, qkey(x)])));
  const setQty = (s, n) => setDraft(d => ({...d, [col]: {...d[col], [s]: Math.max(0, Math.min(99, n))}}));
  const setAll = arr => setDraft(d => ({...d, [col]: Object.fromEntries(p.sizes.map((s, i) => [s, arr[i] || 0]))}));
  const save = () => { if (dirty && !locked && !readOnly) { act.saveDraft(order.id, p.id, draft, sh.via || 'search', actor); return true; } return false; };
  const close = () => { if (save()) act.toast('Saved to order'); act.close(); };
  const done = () => { save(); act.close(); act.toast(existing ? 'Order updated' : 'Added to order'); };
  const go = (pid, colour) => { if (save()) act.toast('Saved to order'); act.sheet({type:'size', orderId:order.id, pid, colour, via:'suggestion', actor}); };

  const projected = useMemo(() => { const o = JSON.parse(JSON.stringify(order)); applyDraft(o, p.id, draft, 'x', actor); return o; }, [draft, order]);
  const k0 = kpi(order, p.div), k1 = kpi(projected, p.div);
  const m0 = k0.mix.find(m => m.cat === p.cat), m1 = k1.mix.find(m => m.cat === p.cat);
  const tUnits = Object.values(draft).reduce((a, x) => a + units(x), 0);
  const family = PRODUCTS.filter(x => x.family === p.family && x.id !== p.id && x.div === p.div && available(b, x));
  const sug = (pid, colour) => { const xp = P[pid], has = order.lines.some(l => l.pid === pid);
    return html`<button class="sug" onClick=${() => go(pid, colour)}><${Thumb} pid=${pid} colour=${colour}/><div class="sug-n">${xp.name}</div>
      <div class="small muted">${has ? 'Added' : fmt(xp.price)}</div></button>`; };
  return html`<${Sheet} tall title=${p.name} sub=${`${p.code} · ${prices(p)}`} onClose=${close}
    foot=${readOnly ? html`<button class="btn secondary" onClick=${act.close}>Close</button>` : html`
      ${existing && html`<button class="btn danger" style="flex:0 0 auto" onClick=${() => act.unselect(order.id, p.id, null, actor)}>Remove</button>`}
      <button class="btn primary" disabled=${locked || (!existing && tUnits === 0)} onClick=${done}>${existing ? 'Save changes' : tUnits ? `Add ${tUnits} to order` : 'Enter quantities'}</button>`}>
    <div class="ss-top">
      <${Thumb} cls="lg" pid=${p.id} colour=${col}/>
      <div class="ss-info">
        <div class="small muted">${DIV_LABEL[p.div]} · ${CAT_LABEL[p.cat]} · ${DROPS[p.drop]}</div>
        <div class="ss-total"><b>${tUnits}</b> units · <span class="num">${fmt(tUnits * p.price)}</span></div>
      </div>
    </div>
    ${locked && html`<div class="callout bad"><${Icon} n="lock" s=${18}/><div>${p.name} isn’t available to ${b.shop}, so it can’t go on this order.</div></div>`}
    ${readOnly && html`<div class="callout info"><${Icon} n="lock" s=${18}/><div>The ${DIV_LABEL[p.div].toLowerCase()} order has been sent and can’t be changed here.</div></div>`}
    <div class="lbl">Colour <span style="text-transform:none;letter-spacing:0;font-weight:400">· ${p.colours.length} options</span></div>
    <div class="colours" ref=${colBox}>${p.colours.map(c => html`<button class=${'colour' + (c === col ? ' on' : '')} onClick=${() => setCol(c)}>${chip(c)}</button>`)}
      <span class="slide-ind" ref=${colInd} aria-hidden="true"><span class="slide-copy">${p.colours.map(c => html`<button class="colour" tabindex="-1">${chip(c)}</button>`)}</span></span></div>
    ${!locked && !readOnly && html`
      <div class="lbl">${p.sizes.length > 1 ? 'Sizes' : 'Quantity'} · ${col}</div>
      ${p.sizes.length > 1 ? html`
        <div class="sizes">${p.sizes.map(s => html`<div class=${'size-cell' + (q[s] ? ' has' : '')}>
          <div class="sz">${s}</div>
          <button class="step" aria-label=${'Add one size ' + s} onClick=${() => setQty(s, (q[s] || 0) + 1)}><${Icon} n="plus" s=${20} w=${2}/></button>
          <div class=${'qty num' + (q[s] ? '' : ' zero')}>${q[s] || 0}</div>
          <button class="step" aria-label=${'Remove one size ' + s} onClick=${() => setQty(s, (q[s] || 0) - 1)}><${Icon} n="minus" s=${20} w=${2}/></button>
        </div>`)}</div>
        <div class="quick"><button class="qbtn" disabled=${!units(q)} onClick=${() => setAll([])}>Clear</button></div>` : html`
        <div class="single">
          <button class="step lg" aria-label="Remove one" onClick=${() => setQty('U', (q.U || 0) - 1)}><${Icon} n="minus" s=${26} w=${2}/></button>
          <div class=${'qty xl num' + (q.U ? '' : ' zero')}>${q.U || 0}</div>
          <button class="step lg" aria-label="Add one" onClick=${() => setQty('U', (q.U || 0) + 1)}><${Icon} n="plus" s=${26} w=${2}/></button>
        </div>`}
      <div class="panel impact">
        <div class="impact-row"><span class="muted">${CAT_LABEL[p.cat]} budget</span>
          <span class="num"><span class="muted">${fmt(m0.value)} →</span> <b class=${'st-' + m1.st}>${fmt(m1.value)}</b> <span class="muted">of ${fmt(m1.budget)}</span></span></div>
        <div class="impact-row"><span class="muted">${DIV_LABEL[p.div]} budget</span>
          <span class="num"><span class="muted">${fmt(k0.total)} →</span> <b>${fmt(k1.total)}</b> <span class="muted">of ${fmt(k1.budget)}</span></span></div>
      </div>`}
    ${family.length > 0 && html`<div class="lbl">Same family · ${p.family}</div><div class="sugs">${family.map(x => sug(x.id, x.colours.includes(col) ? col : x.colours[0]))}</div>`}
  <//>`;
}

/* =====================================================================
   Capture — photograph a sample, AI matches it to the catalogue
   ===================================================================== */
// a match offers View item (its page) and Add to order: with a client checked in it goes on their order, without one you pick the client
function Capture({order, div, act}) {
  const b = order && BUYERS[order.buyerId];
  const [stage, setStage] = useState('aim');
  const t = useRef(0);
  useEffect(() => () => clearTimeout(t.current), []);
  const s = CAMERA_SCENE, p = P[s.pid];
  const shoot = () => { setStage('scan'); t.current = setTimeout(() => setStage('match'), 1250); };
  const alts = alternatives(p);
  const why = order && canTake(order, p);
  const pick = (pid, colour) => { act.capture(false); if (order) act.select(order.id, pid, colour, 'photo'); else act.sheet({type:'pick', item:{pid, colour, via:'photo'}}); };
  const view = (pid, colour) => { act.capture(false); act.sheet({type:'product', pid, colour, orderId:order && order.id}); };
  return html`<div class="capture">
    <div class="vf-top">
      <button class="vf-btn" onClick=${() => act.capture(false)} aria-label="Close camera"><${Icon} n="x"/></button>
      <div class="vf-title">${b ? b.shop : 'Scan a sample'}</div>
      <span style="width:42px" aria-hidden="true"></span>
    </div>
    <div class="vf-scene">
      <div class=${'vf-stage s-' + stage}><img src=${s.src} alt="Camera view of a showroom sample on a shelf" draggable="false"/>
        ${stage !== 'match' && html`<div class="brackets"><i></i><i></i><i></i><i></i>${stage === 'scan' && html`<div class="scanline"></div>`}</div>`}</div>
      ${stage === 'scan' && html`<div class="flash"></div><div class="vf-status"><span>Finding the style…</span></div>`}
      ${stage === 'aim' && html`<div class="vf-hint"><span>Frame the sample. No tag or barcode needed.</span></div>`}
    </div>
    ${stage !== 'match' && html`<div class="vf-bottom">
      <div class="shutter-row"><button class="shutter" onClick=${shoot} disabled=${stage !== 'aim'} aria-label="Take photo"><span></span></button></div>
    </div>`}
    ${stage === 'match' && html`<div class="match" role="dialog" aria-label=${p.name}>
      <div class="match-main"><${Thumb} cls="lg" pid=${p.id} colour=${s.colour}/>
        <div style="min-width:0;display:flex;flex-direction:column;gap:4px"><div class="m-name">${p.name}</div><span class="pc-code">${p.code}</span><span class="small muted"><${Colour} c=${s.colour}/></span><${Prices} p=${p}/></div></div>
      ${why && html`<div class="callout bad"><${Icon} n="lock" s=${18}/><div>${b.shop} · ${why}, so this style can’t go on the order.</div></div>`}
      <div class="match-acts"><button class="btn secondary" onClick=${() => view(p.id, s.colour)}>View item</button>
        <button class="btn primary" disabled=${!!why} onClick=${() => pick(p.id, s.colour)}>Add to order</button></div>
      <div class="lbl" style="margin-top:2px">Not this one?</div>
      <div class="alts">${alts.map((a, i) => html`<button class="row" onClick=${() => pick(a.id, a.colours.includes(s.colour) ? s.colour : a.colours[0])}>
        <${Thumb} cls="sm" pid=${a.id} colour=${a.colours.includes(s.colour) ? s.colour : a.colours[0]}/>
        <div class="row-main"><div class="row-title">${a.name}</div><div class="code">${a.code}</div></div></button>`)}</div>
      <button class="btn ghost block" onClick=${() => setStage('aim')}>Retake photo</button>
    </div>`}
  </div>`;
}

function PickerSheet({sh, act}) {

function issuesOf(o, divs) {
  const out = [];
  divs.forEach(d => { const k = kpi(o, d); if (!k.total) return;
    // budget is not a guideline: spend against it shows in red (under half), yellow (from half) or green (reached) on the budget card
    k.rules.filter(r => r.st === 'bad' || r.st === 'warn').forEach(r => out.push({label:`${DIV_TAB[d]} · ${r.label}`, text:`${fmt(r.value)}, ${ruleLimit(r)}`, st:r.st}));
    k.looks.filter(x => !x.done).forEach(x => out.push({label:`${DIV_TAB[d]} · ${lookNo(x.l)}`, text:`${x.have} of ${x.n} pieces`, st:'warn'})); });
  return out;
}

// Finishing the visit: the client always signs, then the seller sends the order to the commercial team (closed, waiting for
// confirmation, with a copy to the client; not while a style has no quantity) or back to the client to finish from an email link (still a draft). Women's and men's can go together or one at a time.
function FinishSheet({sh, S, act}) {
  const o = S.orders[sh.orderId], b = BUYERS[o.buyerId];
  const open = b.divs.filter(d => !partLocked(o, d)), filled = d => kpi(o, d).units > 0;
  const [pick, setPick] = useState(() => open.filter(filled));
  const sel = pick.filter(d => open.includes(d));
  const toggle = d => setPick(p => p.includes(d) ? p.filter(x => x !== d) : [...p, d]);
  const noQty = o.lines.filter(l => sel.includes(P[l.pid].div) && !units(l.qty)).length;
  const [name, setName] = useState(''), [email, setEmail] = useState(b.email || `buying@${b.shop.toLowerCase().replace(/[^a-z0-9]/g, '')}.com`);
  const [signed, setSigned] = useState(false), [done, setDone] = useState(null);
  const ok = sel.length > 0 && name.trim() && /^\S+@\S+\.\S+$/.test(email.trim()) && signed;

  const toTeam = () => { act.send(o.id, sel, 'client', name.trim(), email.trim());
    setDone({title:'Sent to the commercial team', line:`${visit ? b.shop + ' is checked out. ' : ''}A copy is on its way to ${email.trim()}.`}); };
  const toClient = () => { act.share(o.id, sel, name.trim(), email.trim());
    setDone({title:`Sent to ${b.shop}`, line:`The link is on its way to ${email.trim()}.`, client:true}); };
  // Continue ends the visit and goes back to Home, ready for the next client
  const next = () => visit ? act.endVisit(b.id, null) : act.close();
  if (done) return html`<${FullPage} title=${done.title} onClose=${next}
    foot=${html`<div class="finish-btns"><button class="btn black" onClick=${next}>Continue</button>
      ${done.client && html`<button class="btn ghost" onClick=${() => act.role('buyer', o.id)}>Open as the client (demo)</button>`}</div>`}>
    <div class="done" role="status"><span class="done-ic"><${Icon} n="check" s=${46} w=${3}/></span>
      <h1 class="h1">${done.title}</h1><p class="muted">${done.line}</p></div>
  <//>`;
  return html`<${FullPage} title="Finalize order" onClose=${act.close}
    foot=${!open.length ? html`<div class="finish-btns">
      ${visit ? html`<button class="btn black" onClick=${() => act.endVisit(b.id, 'Checked out')}>Check out</button>
        <div class="small muted">Nothing left to send: the visit ends and you go back to Home.</div>`
        : html`<button class="btn black" onClick=${act.close}>Close</button>`}</div>`

      <div class="small muted">The order is closed. The commercial team confirms it for production; the client gets a copy by email.</div>
      <button class="btn white" disabled=${!ok} onClick=${toClient}>Send to client to finish</button>

    ${!open.length ? html`<div class="callout good"><${Icon} n="check" s=${18}/><div>Everything is sent. The commercial team reviews the order and confirms it for production.</div></div>` : html`
      ${shared && html`<button class="btn secondary block" onClick=${() => act.role('buyer', o.id)}>Open as the client (demo)</button>`}
      ${b.divs.length > 1 && html`<div class="field"><span class="lbl">What to send</span>

          return html`<button class="row opt" disabled=${!can} aria-pressed=${sel.includes(d)} onClick=${() => toggle(d)}>
            <div class="row-main"><div class="row-title">${DIV_LABEL[d]}</div><div class="row-sub"><${Pill} s=${st}/><span class="num">${k.units} units · ${fmt(k.total)}</span></div></div>

// Signature pad: finger or mouse, drawn on a canvas
function SignPad({onSigned}) {
  const ref = useRef(null), on = useRef(false);
  useEffect(() => { const c = ref.current, r = c.getBoundingClientRect(), k = window.devicePixelRatio || 1;
    c.width = r.width * k; c.height = r.height * k; const x = c.getContext('2d'); x.scale(k, k);
    x.lineWidth = 2.4; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = getComputedStyle(c).color; }, []);
  const at = e => { const r = ref.current.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const down = e => { ref.current.setPointerCapture(e.pointerId); on.current = true; const x = ref.current.getContext('2d'); x.beginPath(); x.moveTo(...at(e)); };
  const move = e => { if (!on.current) return; const x = ref.current.getContext('2d'); x.lineTo(...at(e)); x.stroke(); onSigned(true); };
  const up = () => { on.current = false; };
  const clear = () => { const c = ref.current; c.getContext('2d').clearRect(0, 0, c.width, c.height); onSigned(false); };
  return html`<div class="sign">
    <canvas ref=${ref} class="sign-pad" onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up} aria-label="Signature"></canvas>
    <span class="sign-hint">Sign here</span>
    <button class="linkbtn sign-clear" onClick=${clear}>Clear</button>
  </div>`;
}

function SignSheet({sh, S, act}) {
  const o = S.orders[sh.orderId], b = BUYERS[o.buyerId];

  const sent = `${sh.divs.map(d => DIV_TAB[d]).join(' + ')} sent`;
  const send = () => { act.send(o.id, sh.divs, 'client', name.trim());
    if (isOngoing(S.appts[b.id])) act.endVisit(b.id, `${sent} · Checked out`); else { act.close(); act.toast(sent); } };
  return html`<${FullPage} title="Sign the order" onClose=${act.close}
    foot=${html`<button class="btn primary" disabled=${!name.trim() || !signed} onClick=${send}>Confirm and send · ${fmt(value)}</button>`}>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vega Showroom</title>
<meta name="description" content="Vega: showroom order capture for wholesale. Clickable prototype.">
<meta name="theme-color" content="#EFF0EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1113" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vega">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
/* Layout: one phone-first app (portrait or landscape). On desktop it sits in a device frame beside a short demo guide. */
:root{
  /* type: four sizes (caption, body, heading, title), three weights (400, 600, 700), two line heights */
  --fs-caption:12px; --fs-body:15px; --fs-heading:17px; --fs-title:28px;
  --lh-tight:1.2; --lh-body:1.4;
  /* radius: xs for chips and bars, s for photos, m for controls, l for cards and groups, xl for sheets; round is 999px */
  --r-xs:4px; --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:22px;
  /* depth: light from above; raised controls, floating buttons and bars, sheets */
  --shadow-raised:0 1px 3px rgba(0,0,0,.12); --shadow-float:0 8px 24px rgba(0,0,0,.16); --shadow-sheet:0 -8px 32px rgba(0,0,0,.18);
  --stage:#E1E2DE; --frame:#17181A;
  --bg:#EFF0EC; --surface:#FFFFFF; --surface-2:#F5F6F2; --studio:#E3E4DF;
  --ink:#141619; --muted:#62666B; --faint:#808489; --line:#DCDED8;
  --band:#000000; --band-ink:#FFFFFF; /* client band: black in light and dark mode */
  --accent:#2238A6; --accent-ink:#FFFFFF; --accent-soft:#E3E7F8;
  --good:#1D7448; --good-bg:#E0EFE6; --warn:#946000; --warn-bg:#F7EAD2; --bad:#AE281C; --bad-bg:#F7E1DE;
  --scrim:rgba(10,12,16,.42);
  --vf-bg:#0C0D0F; --vf-ink:#F2F2EF; --vf-dim:rgba(242,242,239,.62);
  --f-display:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-ui:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#050607; --frame:#2A2C30;
  --bg:#0F1113; --surface:#181A1E; --surface-2:#202328; --studio:#43464B;
  --ink:#ECEDEA; --muted:#A0A4A9; --faint:#6E7277; --line:#2C3036;
  --accent:#8C9DFF; --accent-ink:#0F1113; --accent-soft:#222A4C;
  --good:#58C48D; --good-bg:#15291E; --warn:#E5A93E; --warn-bg:#2E2414; --bad:#F27D72; --bad-bg:#331A18;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --stage:#050607; --frame:#2A2C30;
  --bg:#0F1113; --surface:#181A1E; --surface-2:#202328; --studio:#43464B;
  --ink:#ECEDEA; --muted:#A0A4A9; --faint:#6E7277; --line:#2C3036;
  --accent:#8C9DFF; --accent-ink:#0F1113; --accent-soft:#222A4C;
  --good:#58C48D; --good-bg:#15291E; --warn:#E5A93E; --warn-bg:#2E2414; --bad:#F27D72; --bad-bg:#331A18;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:var(--fs-body)/var(--lh-body) var(--f-ui);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
/* home-screen app: the status bar is see-through with white icons (fixed by iOS at launch), so the strip behind it is always black like the client band */
html::before{content:"";position:fixed;z-index:100;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--band);pointer-events:none}
@media (min-width:900px){html,body{background:var(--stage)}}
[hidden]{display:none!important}
#root{height:100%}
/* no double-tap zoom anywhere; scrolling and pinch still work */
*,*::before,*::after{touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:var(--fs-caption)}
.code{font-size:var(--fs-caption);line-height:var(--lh-tight);color:var(--muted)}

/* ---------- shell / device ---------- */
.shell{height:100%;display:flex;align-items:center;justify-content:center;gap:48px}
.device{position:relative;height:100%;width:100%;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.statusbar{display:none}
.side{display:none}
@media (min-width:900px){
  .shell{padding:24px}
  .device{height:min(844px,calc(100vh - 48px));width:auto;aspect-ratio:390/844;border-radius:46px;box-shadow:0 0 0 11px var(--frame),0 30px 80px rgba(0,0,0,.28)}
  .device.landscape{height:auto;width:min(844px,calc(100vw - 440px));aspect-ratio:844/390}
  .device.portrait .statusbar{display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 30px 0 34px;font-weight:600;font-size:var(--fs-body);flex:none;background:var(--bg)}
  .side{display:flex;flex-direction:column;gap:18px;width:300px;flex:none}
}
.sb-r{display:flex;gap:6px;align-items:center}
.sb-r i{display:block;width:4px;border-radius:var(--r-xs);background:var(--ink)}
.sb-batt{width:24px;height:11px;border:1.5px solid var(--ink);border-radius:var(--r-xs);padding:2px}
.sb-batt span{display:block;height:100%;width:70%;background:var(--ink);border-radius:var(--r-xs)}
.side-brand{font:700 var(--fs-title)/var(--lh-tight) var(--f-display);letter-spacing:-.035em}
.side-lede{margin:0;color:var(--muted);line-height:var(--lh-body);text-wrap:pretty}
.steps{margin:0;padding:0 0 0 20px;display:flex;flex-direction:column;gap:8px;line-height:var(--lh-body)}
.steps li::marker{font:600 var(--fs-caption) var(--f-ui);color:var(--muted)}
.side-ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fine{margin:0;font-size:var(--fs-caption);color:var(--muted);line-height:var(--lh-body)}
.linkbtn{color:var(--accent);font-weight:600;font-size:var(--fs-body);padding:6px 2px}

/* ---------- app frame ---------- */
.app{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;container-type:size;container-name:app;background:var(--bg)}
.screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
/* floating pill tab bar; content scrolls underneath */
.screen.tabbed{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.screen.tabbed.with-pill{padding-bottom:calc(154px + env(safe-area-inset-bottom,0px))}
/* the client pill and the tab bar float together at the bottom; the pill takes the tab bar's width */
.dock{position:absolute;z-index:20;left:50%;transform:translateX(-50%);bottom:max(14px,calc(env(safe-area-inset-bottom,0px) - 6px));display:flex;flex-direction:column;gap:8px}
.tabbar{display:flex;gap:2px;padding:6px;border-radius:999px;
  background:color-mix(in srgb,var(--surface) 78%,transparent);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:var(--shadow-float)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:var(--fs-caption);font-weight:600;color:var(--muted);min-width:74px;padding:8px 10px 6px;border-radius:999px;transition:background .2s,color .2s}
.tab.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
/* client in session: a black pill above the tab bar, on every tab, with the first two pieces added as photos (they stay put as more are added); tapping it opens the order */
.sbar{align-self:center;display:flex;align-items:center;gap:12px;max-width:100%;min-width:0;padding:4px 22px 4px 4px;border-radius:999px;background:var(--band);color:var(--band-ink);text-align:left;border:1px solid rgba(255,255,255,.1);box-shadow:var(--shadow-float);animation:rise .3s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.sbar-ph{position:relative;flex:none;display:flex}
.sbar-c{width:42px;height:42px;border-radius:50%;border:2px solid var(--band);background:#fff;overflow:hidden}
/* the right photo always sits on top, cut out from the left one by a thick black ring */
.sbar-c + .sbar-c{position:relative;z-index:1;margin-left:-18px;border:4px solid var(--band)}
/* the photos are full-length shots: zoom in so the piece fills the circle */
.sbar-c img{width:100%;height:100%;object-fit:cover;object-position:50% 62%;transform:scale(1.5)}
.sbar-none{display:grid;width:42px;height:42px;border-radius:50%;border:2px solid var(--band);place-items:center;background:#2A2C30 !important;color:rgba(255,255,255,.7)}
@keyframes beat{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}
.sbar-t{min-width:0;display:flex;flex-direction:column;gap:2px;line-height:var(--lh-tight)}
.sbar-t b,.sbar-t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar-t b{font-size:var(--fs-body);font-weight:700;letter-spacing:-.01em}
.sbar-t span{font-size:var(--fs-caption);font-weight:400;opacity:.7}
.top{padding:14px 18px 6px}
/* Profile: the seller, their orders, passcode and sign out */
.prof{display:flex;align-items:center;gap:14px;padding:4px 2px 6px}
.prof .avatar{width:58px;height:58px;font-size:var(--fs-heading)}
.prof-n{font:700 var(--fs-heading)/var(--lh-tight) var(--f-display);letter-spacing:-.02em}
.row-ic{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:var(--r-s);background:var(--surface-2);color:var(--ink)}
.row.out{color:var(--bad)}
.row.out .row-ic{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
/* a page inside a tab (Profile → Orders): back on the left, small centred title, like the order page; stays on top while scrolling */
.sub-bar{position:sticky;top:0;z-index:5;background:var(--bg)}
.sub-bar h1{margin:0}
.fb-shots{display:flex;gap:8px;flex-wrap:wrap}
.fb-shot{position:relative;width:76px;height:76px;border-radius:var(--r-m);overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.fb-shot img{width:100%;height:100%;object-fit:cover}
.fb-shot button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.6);color:#fff}
.fb-add{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:999px;border:1px dashed var(--muted);color:var(--ink);font-weight:600;cursor:pointer}
.fb-add input{display:none}
.signin .fpage-body{justify-content:center}
.maison{font:600 var(--fs-caption) var(--f-display);letter-spacing:.28em;text-transform:uppercase}
.eyebrow{font-size:var(--fs-caption);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.h1{font:700 var(--fs-title)/var(--lh-tight) var(--f-display);margin:4px 0 0;letter-spacing:-.03em}
.sec{padding:16px 18px 6px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-head h2{margin:0;font-size:var(--fs-heading);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:999px;color:var(--ink)}
.avatar{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);font:600 var(--fs-caption) var(--f-ui);letter-spacing:.02em}
.avatar.me{width:40px;height:40px;font-size:var(--fs-body)}
.avatar.me:active{opacity:.7}
.avatar.sm{width:34px;height:34px;font-size:var(--fs-caption)}
.round-btn{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--ink);margin-top:6px}
.top-bar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.top-bar.mid{align-items:center;padding-top:18px}
.h1-btn{font:inherit;letter-spacing:inherit;color:inherit;text-align:left}
.h1-btn:active{opacity:.5}
.fpage{position:absolute;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;animation:fade .2s ease}
.fpage-head{flex:none;display:flex;justify-content:space-between;align-items:center;padding:4px 4px 0}
.fpage-body{flex:1;min-height:0;overflow-y:auto;width:100%;max-width:640px;margin:0 auto;padding:4px 20px max(24px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.fpage-body > *{flex-shrink:0}
.fpage-body > .pin{margin:auto 0}
.fpage-body:has(+ .fpage-foot){padding-bottom:18px}
.fpage-foot{width:100%}
.pd-head{display:flex;flex-direction:column;gap:4px;margin-top:-4px}
.pd-name{margin:0;font:700 var(--fs-title)/var(--lh-tight) var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.pd-sub{font-size:var(--fs-body);color:var(--muted)}
.pd-sub .code{color:var(--ink);font-weight:400}
/* product page actions sit in the page under the prices, as full pills */
.pd-cta{display:flex;flex-direction:column;gap:10px;margin:10px 0 14px}
.pd-cta .btn{width:100%;min-height:52px;border-radius:999px}
.btn.black{background:var(--ink);color:var(--bg)}
.btn.outline{border:1px solid var(--ink)}
.btn.outline.danger{border-color:var(--bad)}
.pd-qty{display:flex;flex-direction:column;gap:10px}
.pd-qty .quick{flex-wrap:nowrap;overflow-x:auto;margin:0 -18px;padding:0 18px;scrollbar-width:none}
.pd-qty .qbtn{flex:none}
.pd-in{display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:var(--fs-body)}
.pd-in svg{color:var(--good)}
.pd-hint{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 16px;border-radius:999px;border:1px dashed var(--line);color:var(--muted);font-size:var(--fs-body);font-weight:600;text-align:center}
.pin{display:flex;flex-direction:column;align-items:center;gap:14px;padding:4px 0 6px}
.pin-t{font-size:var(--fs-heading);font-weight:600}
.pin-dots{display:flex;gap:16px;margin:2px 0 6px}
.pin-dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink);transition:background .12s}
.pin-dots i.on{background:var(--ink)}
.pin-t.bad{color:var(--bad)}
.pin-dots.bad{animation:shake .32s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 26px}
.pin-k{width:72px;height:72px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:var(--fs-title);font-weight:400;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.pin-k:active:not(:disabled){background:var(--surface-2)}
.pin-k.txt{background:none;border:0;font-size:var(--fs-body);font-weight:600;color:var(--accent)}
.top-acts{display:flex;align-items:center;gap:10px}.top-acts .round-btn{margin-top:0}
.field{display:flex;flex-direction:column;gap:6px}
.inp.area{height:auto;min-height:104px;padding:12px 14px;line-height:var(--lh-body);resize:vertical}
.days{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin:0 -18px;padding:0 18px;scroll-padding:0 18px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 66px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.day b{font-size:var(--fs-heading);font-weight:600;line-height:var(--lh-tight)}
.day span{font-size:var(--fs-caption);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day.on{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.day.on span{color:inherit;opacity:.8}
.inp{height:46px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);padding:0 14px;font:var(--fs-heading) var(--f-ui);color:var(--ink);outline:0;width:100%}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.icon-btn:active{background:var(--surface-2)}

/* ---------- chips, pills ---------- */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-caption);font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.s-none{background:var(--surface-2);color:var(--muted)}
.s-draft{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.s-shared{background:var(--warn-bg);color:var(--warn)}
.s-submitted,.s-partial{background:var(--accent-soft);color:var(--accent)}
.s-confirmed{background:var(--good);color:var(--surface)}
.s-in{background:var(--good-bg);color:var(--good)}
.s-out{background:var(--surface-2);color:var(--muted)}
.live-dot{position:relative;width:7px;height:7px;border-radius:50%;background:currentColor}
.live-dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;animation:beat 1.8s ease-out infinite}
.by{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-caption);font-weight:600;color:var(--muted);white-space:nowrap}
.by.client{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-caption);font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.ai{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-s);padding:2px;gap:2px}
.seg button{padding:6px 14px;border-radius:var(--r-s);font-size:var(--fs-body);font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-raised)}
.seg.full{display:flex}.seg.full button{flex:1}

/* ---------- buttons ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r-m);font-weight:600;font-size:var(--fs-body)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.secondary{background:var(--surface-2);border:1px solid var(--line)}
.btn.go{background:var(--good);color:var(--surface)}
.btn.ghost{color:var(--accent)}
.btn.white{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn:active:not(:disabled){transform:scale(.985)}

/* ---------- product art ---------- */
.thumb{flex:none;display:grid;place-items:center;background:var(--studio);border-radius:var(--r-m);overflow:hidden;width:56px;height:56px}
.thumb.sm{width:44px;height:44px;border-radius:var(--r-s)}
.thumb.lg{width:96px;height:96px;border-radius:var(--r-l)}
.thumb img,.ph{width:100%;height:100%;object-fit:cover;display:block}
.ph{background:#EDEDED}
.cc{display:inline-flex;align-items:center;gap:6px;min-width:0}
.cc .code{font-weight:inherit;font-size:inherit;color:var(--muted)}
.pc-code{font-size:var(--fs-caption);font-weight:600;letter-spacing:.02em;color:var(--ink)}
.pc-info .pc-code{font-weight:400}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.prices span{display:flex;flex-direction:column;min-width:0}
.prices small{font-size:var(--fs-caption);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.prices b{font-size:var(--fs-body);font-weight:600;color:var(--ink)}
.prices.lg{padding:2px 0}
.prices.lg b{font-size:var(--fs-heading)}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);overflow:hidden}
.stp button{width:38px;height:36px;display:grid;place-items:center;color:var(--ink)}
.stp button:active{background:var(--surface-2)}
.stp span{min-width:30px;text-align:center;font-weight:600;font-size:var(--fs-body)}
.st-ok{color:var(--good)}.st-warn{color:var(--warn)}.st-bad{color:var(--bad)}.st-none{color:var(--muted)}
.flag-txt{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-caption);font-weight:700;color:var(--good)}
.flag-dot{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--good);color:#fff}
/* carousel: portrait shots, swipe; tap opens them full screen (and tap there comes back) */
.car{position:relative;display:flex;flex-direction:column}
.car-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:var(--r-l);background:#F0F0F0}
.car-track::-webkit-scrollbar{display:none}
.car-slide{position:relative;flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/5;max-height:52cqh;background:#F0F0F0}
.car-slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.car.cover .car-slide img{object-fit:cover;object-position:50% 30%}
.car-dots{position:absolute;z-index:2;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;padding:6px 8px;border-radius:999px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);pointer-events:none}
.car-dots i{width:6px;height:6px;border-radius:50%;background:rgba(20,22,25,.25);transition:background .2s,width .2s}
.car-dots i.on{background:#141619;width:16px;border-radius:var(--r-xs)}
.zoom{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;animation:fade .2s ease}
.zoom-top{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 4px 4px 18px}
/* close on the full-screen photos and full-screen pages: a 52px target, easy to hit with a thumb */
.zoom-top .icon-btn,.fpage-head .icon-btn{width:52px;height:52px;border-radius:999px}
.zoom-t{font:600 var(--fs-heading)/var(--lh-tight) var(--f-display);letter-spacing:-.015em}
.zoom .car{flex:1;min-height:0}
.zoom .car-track{flex:1;min-height:0;border-radius:0}
.zoom .car-slide{aspect-ratio:auto;max-height:none;height:100%}
.pdf-prev{position:relative;display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:#fff}
.pdf-prev img{display:block;width:100%;height:auto}
.pdf-tag{position:absolute;right:8px;bottom:8px;display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--band);color:var(--band-ink);font-size:var(--fs-caption);font-weight:600}
.pdf-scroll{flex:1;min-height:0;overflow:auto;background:var(--surface-2);padding:12px}
.pdf-page{display:block;width:100%;height:auto;background:#fff;box-shadow:var(--shadow-raised)}
.pdf-page.big{width:220%;max-width:none}
.zoom-foot{flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 18px max(14px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}

/* ---------- today ---------- */
.look{position:relative;scroll-snap-align:start;flex:none;width:236px;text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:8px}
.look-tile{position:relative;border-radius:var(--r-m);overflow:hidden;background:var(--studio)}
/* the runway front shot, cropped to the model */
.look-tile{aspect-ratio:4/5}
.look-tile img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.look-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.look-t{font:600 var(--fs-heading)/var(--lh-tight) var(--f-display);letter-spacing:-.01em}
/* on the Looks page the name sits on the photo, bottom left, white over a soft dark fade */
.look > .look-h{position:absolute;left:8px;right:8px;bottom:8px;padding:48px 16px 14px;border-radius:0 0 var(--r-m) var(--r-m);background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.55));color:#fff;pointer-events:none}
.look > .look-h .look-t{font-size:var(--fs-heading);text-shadow:0 1px 2px rgba(0,0,0,.25)}
.look-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.look-list .look{width:auto}
.appts{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.appt{display:flex;gap:14px;align-items:stretch;text-align:left;width:100%;padding:14px;border-top:1px solid var(--line)}
.appt:first-child{border-top:0}
.appts.now{border:1.5px solid var(--good)}
.appt-time{font:600 var(--fs-caption) var(--f-ui);font-variant-numeric:tabular-nums;color:var(--muted);padding-top:4px;width:42px;flex:none}
.appt-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.appt-shop{font:600 var(--fs-heading)/var(--lh-tight) var(--f-display);letter-spacing:-.015em}
.appt-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.appt-buyer{display:flex;align-items:center;gap:4px;font-size:var(--fs-body);color:var(--ink);margin-top:-4px}
.appt-buyer svg{flex:none;color:var(--muted)}
.appt-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.appt-head .pill{flex:none;margin-top:2px}
.appt-cats{font-size:var(--fs-caption);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* section headings on Home (Now, Today) and in the order (Ready-to-wear, Bags…): sentence case, black, a step above body text */
.lbl.appt-lbl{margin-top:14px;font-size:var(--fs-heading);font-weight:600;letter-spacing:-.01em;text-transform:none;color:var(--ink)}
.appt-cats b{color:var(--ink);font-weight:600;margin-right:4px}
.kv{display:flex;align-items:center;gap:10px;font-size:var(--fs-body);color:var(--muted)}
.live{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px;min-width:0}
.tile b{display:block;font-size:var(--fs-heading);font-weight:600;font-variant-numeric:tabular-nums}
.tile span{font-size:var(--fs-caption);color:var(--muted)}
.foot{padding:18px;font-size:var(--fs-caption);color:var(--muted);text-align:center}
.today-grid{display:flex;flex-direction:column;padding-bottom:12px}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;text-align:left;width:100%;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:var(--fs-caption);color:var(--muted)}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;text-align:right}
.row-val{font-weight:600;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);flex:none}
.szs{display:flex;gap:4px;flex-wrap:wrap}
.sz-chip{font:400 var(--fs-caption) var(--f-ui);font-variant-numeric:tabular-nums;padding:2px 6px;border-radius:var(--r-xs);background:var(--surface-2);color:var(--muted)}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-caption);font-weight:600;color:var(--warn)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 16px;height:44px;color:var(--muted)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;height:100%;color:var(--ink)}
.searchrow{display:flex;gap:8px}.searchrow .search{flex:1;min-width:0}
.sq-btn{position:relative;flex:none;width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:50%;color:var(--ink)}
.sq-btn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.fchip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-caption);font-weight:600;padding:6px 8px 6px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.fchip svg{color:var(--muted)}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.opt .row-side{color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* collection: category rail on the left, products grouped by category and family */
/* category tabs stick under the top while the grid scrolls; sub-categories of the current one sit beneath */
.cat-nav{position:sticky;top:0;z-index:5;margin:0 -18px;padding:6px 0 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
.cn-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 18px;scroll-padding:0 18px}
.cn-row::-webkit-scrollbar{display:none}
.cn-cat{flex:none;position:relative;display:flex;align-items:baseline;gap:6px;font-size:var(--fs-body);font-weight:600;color:var(--muted);padding:10px 6px 10px;margin-right:8px;white-space:nowrap}
.cn-cat span{font-size:var(--fs-caption);font-weight:600;opacity:.75}
.cn-cat::after{content:"";position:absolute;left:6px;right:6px;bottom:2px;height:2.5px;border-radius:var(--r-xs);background:var(--ink);transform:scaleX(0);transition:transform .25s ease}
.cn-cat.on{color:var(--ink)}.cn-cat.on::after{transform:scaleX(1)}
/* in the Collection the categories are rounded pills, the current one filled */
.cat-nav .cn-row{gap:6px}
.cat-nav .cn-cat{align-items:center;height:34px;padding:0 14px;margin-right:0;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:var(--fs-body);font-weight:600;color:var(--ink);transition:background .2s,color .2s}
.cat-nav .cn-cat::after{display:none}
.cat-nav .cn-cat.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
/* Women / Men as the page title: the current one in ink, the other faded beside it */
.div-title{display:flex;gap:16px}
.div-title button{font:inherit;letter-spacing:inherit;color:var(--faint);transition:color .2s}
.div-title button.on{color:var(--ink)}
/* family headings run across the grid */
.fam-h{grid-column:1 / -1;display:flex;align-items:baseline;gap:6px;margin:12px 2px 0;font-size:var(--fs-body);font-weight:600;color:var(--muted)}
.fam-h:first-child{margin-top:0}
/* filter chips (Orders) */
.ftabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.ftabs::-webkit-scrollbar{display:none}
.ftab{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:var(--fs-body);font-weight:600;color:var(--ink);white-space:nowrap;transition:background .2s,color .2s}
.ftab span{font-weight:400;opacity:.6}
.ftab.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.cat-main{display:flex;flex-direction:column;gap:24px;min-width:0;padding-top:16px}
.cat-sec{display:flex;flex-direction:column;gap:8px}
.cat-h{margin:0;display:flex;align-items:baseline;gap:8px;font:700 var(--fs-heading)/var(--lh-tight) var(--f-display);letter-spacing:-.02em}
.cat-h span{font-size:var(--fs-caption);font-weight:600;color:var(--muted)}
.pc-fam{font-size:var(--fs-caption);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pc-photo{position:relative}
.pc-img{display:block;width:100%}
.pc-photo .thumb{width:100%;height:auto;aspect-ratio:1;border-radius:var(--r-s)}
.pcard.locked .pc-img{opacity:.5}
/* under the card info: Add in black, or Edit outlined once the style is in the order (with its units across colours); both open the product page */
.pc-act{margin-top:auto;display:flex;align-items:center;justify-content:center;width:100%;height:40px;border:1.5px solid color-mix(in srgb,var(--ink) 20%,transparent);border-radius:var(--r-m);background:var(--surface);color:var(--ink);font-size:var(--fs-body);font-weight:600}
.pcard{text-align:left;color:inherit;font:inherit}
/* in-order badge: the same height as the Must have / Essential tag, green like the in-order mark on colours */
.pc-in{position:absolute;z-index:2;right:6px;top:6px;--h:calc(var(--fs-caption) * var(--lh-body) + 8px);width:var(--h);height:var(--h);border-radius:50%;display:grid;place-items:center;background:var(--good);color:#fff}
.pc-lock{position:absolute;left:5px;top:5px;display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-caption);font-weight:700;padding:4px 8px 4px 6px;border-radius:999px;max-width:calc(100% - 44px);white-space:nowrap;overflow:hidden}
/* back-office tag on the photo: Must have in black, Essential in white */
.ptag{position:absolute;z-index:2;left:6px;top:6px;padding:4px 10px;border-radius:999px;font-size:var(--fs-caption);font-weight:700;letter-spacing:.02em;white-space:nowrap;pointer-events:none}
.ptag.must{background:var(--band);color:var(--band-ink)}
.ptag.ess{background:#fff;color:#141619;box-shadow:0 0 0 1px rgba(20,22,25,.14)}
.pd-media{position:relative}
.pd-media .ptag{left:0;top:auto;bottom:14px;font-size:var(--fs-caption);padding:6px 12px}
.pc-lock{background:var(--surface);color:var(--warn);border:1px solid var(--line)}
.pc-info{display:flex;flex-direction:column;gap:8px;text-align:left;padding:2px 2px 6px;min-width:0}
.row-sub.one-line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname{font-weight:600;font-size:var(--fs-body);line-height:var(--lh-tight)}
.pcard .prices{grid-template-columns:1fr;gap:4px}
.pcard .prices span{flex-direction:row;justify-content:space-between;align-items:baseline;gap:4px}
.pcard .prices small{text-transform:none;letter-spacing:0;font-size:var(--fs-caption);font-weight:400}
.pcard .prices b{font-size:var(--fs-caption)}
.dots{display:flex;gap:4px}
.dots .sw{width:10px;height:10px}

/* ---------- order view ---------- */
.ov{display:flex;flex-direction:column;height:100%;min-height:0}
.ov-nav{flex:none;display:flex;align-items:center;gap:4px;padding:4px 8px 4px;min-height:52px;border-bottom:1px solid var(--line)}
.ov-nav-t{flex:1;min-width:0;text-align:center}
.ov-shop{font:600 var(--fs-heading)/var(--lh-tight) var(--f-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-caption);color:var(--good);font-weight:600;animation:pulse .6s ease}
@keyframes pulse{from{opacity:.2}to{opacity:1}}
/* order facts: three labelled columns at the top of the page, scrolling with it */
.ov-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:12px 14px}
.ov-meta > div{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0;font-size:var(--fs-body);font-weight:600}
.ov-meta .saved{font-size:var(--fs-body)}
.ov-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.ov-actions{position:absolute;z-index:19;left:50%;transform:translateX(-50%);bottom:max(16px,calc(env(safe-area-inset-bottom,0px) - 4px));width:min(calc(100% - 28px),420px);display:flex;gap:10px}
.ov-actions .cap-btn{box-shadow:var(--shadow-float)}
.ov-actions .round{background:var(--surface);box-shadow:var(--shadow-float)}
.ov-actions .cap-btn.ghost{flex:none;padding:0 22px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-float)}
.sel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 4px;padding:12px 8px 12px 14px;border-top:1px solid var(--line)}
.sel:first-child{border-top:0}
.sel-info{display:flex;gap:12px;align-items:center;text-align:left;min-width:0}
.sel-x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);align-self:start}
.sel-ctl{grid-column:1 / -1;display:flex;align-items:center;gap:10px;padding-left:68px;padding-right:6px;flex-wrap:wrap}
/* sized lines: Enter sizes / Edit sizes as a full-width button, like Edit on the Collection cards */
.sel-edit{grid-column:1 / -1;margin:2px 6px 0 0}
.sel-val{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;line-height:var(--lh-tight)}
.sel-val small{font-size:var(--fs-caption);color:var(--muted)}
.sel-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:var(--fs-caption)}
.sel-code{color:var(--ink);font-weight:400;letter-spacing:.02em}
/* the delivery drop: white tag with a grey outline next to the item code */
.drop-tag{font-size:var(--fs-caption);font-weight:600;line-height:1;padding:4px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.sel.open .sel-val small{color:var(--warn);font-weight:600}
/* Women / Men on the order: underlined tabs; the budget summary below opens Budgets & KPIs */
.ov-divs{display:flex;gap:6px;margin:4px -6px -6px;border-bottom:1px solid var(--line)}
.ov-sum{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:12px 14px 12px}
.ov-sum .bar{margin-top:8px}
.ov-sum-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:var(--fs-body)}
.ov-sum-top .num{white-space:nowrap}
.ov-sum-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:var(--fs-caption);font-weight:600;white-space:nowrap}
.ov-sum-foot > span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ov-sum-go{flex:none;display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-size:var(--fs-caption)}
.ov-sum-go svg{transform:rotate(-90deg)}
.ov-sum.slim{flex-direction:row;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;font-size:var(--fs-body);font-weight:600;white-space:nowrap}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:10px}
.cat-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.cat-n{font-size:var(--fs-caption);font-weight:600;color:var(--muted)}
.cat-v{font-size:var(--fs-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-v .muted{font-size:var(--fs-caption)}
.cat-t .mix-track{display:block;margin-top:4px}
.cat-t .mix-fill{display:block}
.cat-t.off .cat-v{font-size:var(--fs-caption);color:var(--muted)}
.ov-sum-foot{padding-top:10px;margin-top:12px;border-top:1px solid var(--line)}
.ov-sum-st{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ov-sum-st svg{flex:none}
.guide-row{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px 14px 14px 16px;font-size:var(--fs-body);font-weight:600;color:var(--ink);text-align:left}
.guide-row svg{transform:rotate(-90deg);color:var(--muted)}
.ov-lines{padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px}
.lines-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px}
.grp-head{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--fs-heading);font-weight:600;letter-spacing:-.01em;color:var(--ink);padding:0 2px 8px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-l);padding:22px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.ov-bar{flex:none;display:flex;gap:10px;align-items:center;padding:10px 14px max(12px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.cap-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:var(--fs-body);white-space:nowrap;min-width:0}
.cap-btn.two{flex-direction:column;gap:2px;height:64px;border-radius:999px}
.cap-btn.two > span{display:flex;align-items:center;gap:8px}
.cap-btn.two small{font-size:var(--fs-caption);font-weight:400;opacity:.85;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.finish-btns{flex:1;display:flex;flex-direction:column;gap:6px}
.finish-btns .small{text-align:center;margin:0 6px 6px}
.done{margin:auto 0;padding:32px 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.done .h1{margin-top:8px}
.done p{margin:0;font-size:var(--fs-body)}
.done-ic{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--good);color:#fff;animation:pop .45s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.round{width:54px;height:54px;border-radius:999px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);flex:none}

/* ---------- KPI ---------- */
.kpi{display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px}
.kpi-label{font-size:var(--fs-caption);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi-label.row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi-label .chip{text-transform:none;letter-spacing:0}
.kpi-big{margin-top:4px;font-size:var(--fs-body)}
.kpi-big .num{font-size:var(--fs-title);font-weight:600;letter-spacing:-.01em}
.bar{position:relative;height:8px;border-radius:999px;background:var(--surface-2);margin-top:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:var(--r-xs);background:var(--accent);transition:width .35s ease}
.bar-fill.warn{background:var(--warn)}.bar-fill.bad{background:var(--bad)}
.kpi-meta{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-caption);color:var(--muted);margin-top:6px}
.bud-div{display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid var(--line)}
.bud-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:var(--fs-body);padding-bottom:4px}
.bud-head .num{font-weight:400;font-size:var(--fs-body)}.bud-head .num b{font-weight:700}
.bud-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px 10px;align-items:baseline;font-size:var(--fs-body);padding:6px 0}
.bud-row b{min-width:42px;text-align:right}
.bud-row.cat{grid-template-columns:minmax(0,1fr) auto}
.bud-row .num{text-align:right;font-variant-numeric:tabular-nums}
.bud-tot{font-weight:600;border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
.bud-row.rule{align-items:start}
.bud-row.rule .small{display:block;margin-top:2px}
.bud-row.rule .num{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.bud-row.rule .num small{font-size:var(--fs-caption);font-weight:600;margin-top:2px}
.bud-row .mix-track{grid-column:1 / -1;margin-top:4px}
.kpi > .bud-div:first-child{border-top:0;padding-top:0}
.sign{position:relative}
.sign-pad{display:block;width:100%;height:170px;border-radius:var(--r-m);border:1.5px dashed var(--line);background:var(--surface);color:var(--ink);touch-action:none;cursor:crosshair}
.sign-hint{position:absolute;left:14px;bottom:10px;font-size:var(--fs-caption);color:var(--faint);pointer-events:none}
.sign-clear{position:absolute;right:12px;top:8px}
.bud-row.off{color:var(--muted);grid-template-columns:1fr auto;font-size:var(--fs-caption)}
.inp-eur{position:relative}.inp-eur span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.inp-eur .inp{padding-left:28px;text-align:right;font-variant-numeric:tabular-nums}
.mix-track{position:relative;height:6px;border-radius:999px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.mix-fill{height:100%;border-radius:var(--r-xs);background:var(--faint);transition:width .35s ease}
.mix-fill.ok{background:var(--good)}.mix-fill.warn{background:var(--warn)}.mix-fill.bad{background:var(--bad)}
.kpi-foot{font-size:var(--fs-caption);color:var(--muted);line-height:var(--lh-body)}

/* ---------- sheets ---------- */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:40;animation:fade .2s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:88%;z-index:41;background:var(--bg);border-radius:var(--r-xl) var(--r-xl) 0 0;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-sheet)}
.sheet.tall{height:88%}
.sheet-grab{width:38px;height:5px;border-radius:var(--r-xs);background:var(--line);margin:8px auto 0;flex:none}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:8px 10px 6px 18px;flex:none}
.sheet-title{font:700 var(--fs-heading)/var(--lh-tight) var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.sheet-sub{font-size:var(--fs-caption);color:var(--muted);margin-top:4px}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:14px}
.sheet-body > *, .match > *, .ov-lines > *{flex-shrink:0}
.sheet-foot{flex:none;display:flex;gap:10px;padding:10px 18px max(14px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.sheet-foot .btn{flex:1}
.sheet-body:last-child{padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
/* media sheet: photos run edge to edge under the rounded top, close floats on the top left */
.sheet.media{overflow:hidden}
/* the product page rises almost to the top, over the page title; a sliver stays visible so it still reads as a sheet */
.sheet.media.tall{height:calc(100% - 12px);max-height:none;animation:slide .32s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateY(100%)}to{transform:none}}
.sheet.media .sheet-grab{position:absolute;z-index:3;top:0;left:0;right:0;background:rgba(20,22,25,.22)}
.sheet.media .sheet-body{padding-top:0}
.sheet.media .car{margin:0 -18px}
.sheet.media .car-track{border-radius:0}
/* in a sheet the photo is kept short (5:4, the whole product shown) so the name, prices and sizes are on screen without scrolling */
.sheet.media .car-slide{aspect-ratio:5/4;max-height:none}
.sheet.media .car:not(.cover) .car-slide img{object-fit:contain}
/* page: the product detail fills the screen like a page, over the tab bar, and slides in from the right */
.sheet.media.page{top:0;bottom:0;height:auto;max-height:none;max-width:none;border-radius:0;box-shadow:none;animation:push .26s cubic-bezier(.2,.8,.2,1)}
.sheet.page .sheet-x{top:max(12px,env(safe-area-inset-top,0px))}
.sheet-x{position:absolute;z-index:3;top:10px;left:10px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.88);color:#141619;box-shadow:var(--shadow-raised);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
/* product page close: a 44px circle with an invisible margin around it, so a near miss still closes */
.sheet-x::after{content:'';position:absolute;inset:-10px;border-radius:50%}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@keyframes push{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.lbl{font-size:var(--fs-caption);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.callout{display:flex;gap:8px;align-items:flex-start;font-size:var(--fs-body);line-height:var(--lh-body);padding:10px 12px;border-radius:var(--r-m)}
.callout.warn{background:var(--warn-bg);color:var(--warn)}
.callout.bad{background:var(--bad-bg);color:var(--bad)}
.callout.info{background:var(--accent-soft);color:var(--accent)}
.callout.good{background:var(--good-bg);color:var(--good)}
.callout svg{flex:none;margin-top:2px}
/* order page: where the order stands, once it has left the draft */
.ov-state{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r-l);box-shadow:none !important}
.ov-state > div{min-width:0}
.ov-state-ic{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:currentColor}
.ov-state-ic svg{color:var(--surface)}
.s-confirmed .ov-state-ic{background:var(--surface)} .s-confirmed .ov-state-ic svg{color:var(--good)}
.ov-state b{display:block;font:600 var(--fs-heading)/var(--lh-tight) var(--f-display);letter-spacing:-.01em}
.ov-state div span{display:block;font-size:var(--fs-caption);line-height:var(--lh-body);margin-top:2px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px;display:flex;flex-direction:column;gap:10px}

/* size sheet */
.ss-top{display:flex;gap:14px;align-items:center}
.ss-info{display:flex;flex-direction:column;gap:6px;min-width:0}
.ss-total{font-size:var(--fs-body)}.ss-total b{font-size:var(--fs-heading);font-variant-numeric:tabular-nums}
.colours{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:0 18px 2px;scrollbar-width:none}
.colour{display:flex;align-items:center;gap:8px;padding:0 12px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:var(--fs-body);white-space:nowrap;flex:none}
.colour .sw{width:16px;height:16px}
.colour .code{font-size:inherit;line-height:inherit;font-weight:inherit}
.colour.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cnt{font-size:var(--fs-caption);font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 6px}
.sizes{display:flex;gap:6px;overflow-x:auto;margin:0 -18px;padding:0 18px 2px;scrollbar-width:none}
.size-cell{flex:1 0 54px;display:flex;flex-direction:column;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.size-cell.has{border-color:var(--accent)}
.sz{font:600 var(--fs-caption) var(--f-ui);font-variant-numeric:tabular-nums;text-align:center;padding:8px 0 4px;color:var(--muted)}
.size-cell.has .sz{color:var(--accent)}
.step{height:42px;display:grid;place-items:center;color:var(--ink)}
.step:active{background:var(--surface-2)}
.qty{text-align:center;font-size:var(--fs-title);font-weight:600;padding:2px 0}
.size-cell .step:first-of-type{border-bottom:1px solid var(--line)}
.size-cell .step:last-of-type{border-top:1px solid var(--line)}
.single{display:flex;align-items:center;justify-content:center;gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:8px}
.step.lg{width:64px;height:64px;border-radius:999px;background:var(--surface-2)}
.qty.xl{font-size:var(--fs-title);min-width:70px}
input.qty{width:100%;min-width:0;border:0;background:transparent;color:inherit;font-family:inherit;outline:none;-webkit-appearance:none;border-radius:var(--r-s)}
input.qty:focus{background:var(--surface-2)}
input.qty.xl{width:120px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.qbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:var(--fs-caption);font-weight:600}
.qbtn:disabled{color:var(--faint)}
.qbtn:active{background:var(--surface-2)}
.impact{display:flex;flex-direction:column;gap:6px;font-size:var(--fs-body)}
/* product facts: grey label on the left, value on the right, one size throughout */
.facts{gap:0;padding:4px 14px}
.facts > div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:12px 0;border-top:1px solid var(--line);font-size:var(--fs-body)}
.facts > div:first-child{border-top:0}
.facts > div > span:first-child{flex:none;color:var(--muted)}
.facts > div > span:last-child{text-align:right;color:var(--ink)}
.facts .plain{font:inherit;color:inherit;padding:0}
.impact-row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.sugs{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}
.sug{flex:none;width:118px;text-align:left;display:flex;flex-direction:column;gap:6px}
.sug .thumb{width:118px;height:118px}
.sug-n{font-size:var(--fs-caption);font-weight:600;line-height:var(--lh-tight)}
.pre{font:var(--fs-caption)/var(--lh-body) var(--f-ui);font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px;overflow:auto;white-space:pre;max-height:340px;color:var(--ink);margin:0}
.log{display:flex;flex-direction:column}
.log-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:var(--fs-caption)}
.log-row:first-child{border-top:0}
.log-row .log-t{line-height:var(--lh-body)}
.log-t{font-size:var(--fs-caption);font-variant-numeric:tabular-nums;color:var(--muted);padding-top:2px}
.log-who{margin-top:4px}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:6px 6px 6px 12px}
.linkbox code{flex:1;min-width:0;font:var(--fs-caption) var(--f-ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:all}
.linkbox .btn{min-height:38px;padding:0 14px;font-size:var(--fs-body)}
.issue{display:flex;justify-content:space-between;gap:10px;font-size:var(--fs-body);padding:6px 0;border-top:1px solid var(--line)}
.issue:first-of-type{border-top:0}

/* ---------- capture ---------- */
.capture{position:absolute;inset:0;z-index:30;background:var(--vf-bg);color:var(--vf-ink);display:flex;flex-direction:column;animation:fade .2s ease}
.vf-top{position:absolute;z-index:3;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:8px 10px 28px;background:linear-gradient(rgba(0,0,0,.5),transparent)}
.vf-btn{width:42px;height:42px;border-radius:999px;display:grid;place-items:center;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--vf-ink)}
.vf-title{font-size:var(--fs-body);font-weight:600;color:var(--vf-ink);text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.5)}
/* live viewfinder: the shelf photo fills the screen like the iPhone camera (cover); brackets stay locked on the sample */
.vf-scene{position:absolute;inset:0;overflow:hidden;background:#000}
.vf-stage{position:absolute;left:50%;top:50%;width:max(100cqw,calc(100cqh * 941 / 1672));height:max(100cqh,calc(100cqw * 1672 / 941));transform:translate(-50%,-50%)}
.vf-stage img{width:100%;height:100%;display:block;animation:hand 5s ease-in-out infinite;transition:filter .3s}
.vf-stage.s-scan img,.vf-stage.s-match img{animation:none}
.vf-stage.s-match img{filter:brightness(.5)}
@keyframes hand{0%,100%{transform:scale(1.03) translate(0,0)}35%{transform:scale(1.03) translate(-.5%,.35%) rotate(.25deg)}70%{transform:scale(1.03) translate(.4%,-.25%) rotate(-.2deg)}}
.brackets{position:absolute;left:18%;right:19%;top:25%;bottom:39%}
.brackets i{position:absolute;width:30px;height:30px;border:3px solid var(--vf-ink);opacity:.9;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.brackets i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:var(--r-s) 0 0 0}
.brackets i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 var(--r-s) 0 0}
.brackets i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 var(--r-s)}
.brackets i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 var(--r-s) 0}
.scanline{position:absolute;left:4%;right:4%;height:2px;background:#9fb0ff;box-shadow:0 0 18px 4px rgba(140,157,255,.6);animation:scan 1.1s ease-in-out infinite alternate}
@keyframes scan{from{top:2%}to{top:98%}}
.flash{position:absolute;inset:0;z-index:4;background:#fff;pointer-events:none;animation:flash .4s ease-out forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.vf-status,.vf-hint{position:absolute;z-index:3;left:0;right:0;bottom:calc(128px + env(safe-area-inset-bottom,0px));text-align:center;font-size:var(--fs-caption);color:var(--vf-ink)}
.vf-status span,.vf-hint span{background:rgba(0,0,0,.55);padding:6px 12px;border-radius:999px}
.vf-bottom{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:40px 0 max(20px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.shutter-row{display:flex;justify-content:center;padding-top:4px}
.shutter{width:72px;height:72px;border-radius:999px;border:4px solid var(--vf-ink);display:grid;place-items:center}
.shutter span{width:56px;height:56px;border-radius:999px;background:var(--vf-ink);transition:transform .15s}
.shutter:active span{transform:scale(.9)}
.match{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:86%;overflow-y:auto;z-index:5;background:var(--bg);color:var(--ink);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:16px 18px max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .26s cubic-bezier(.2,.8,.2,1)}
.match-main{display:flex;gap:14px;align-items:center}
.m-name{font:700 var(--fs-heading)/var(--lh-tight) var(--f-display);letter-spacing:-.02em}
.alts{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}

/* ---------- buyer view ---------- */
.bv-head{flex:none;padding:12px 18px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.demo-bar{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 12px 6px 16px;background:var(--ink);color:var(--bg);font-size:var(--fs-caption);font-weight:600}
.demo-bar button{color:var(--bg);text-decoration:underline;font-weight:700;padding:6px 4px}
/* every message slides up from the bottom edge of the screen, over the tab bar and the floating buttons */
.toast{position:absolute;left:50%;bottom:max(16px,calc(env(safe-area-inset-bottom,0px) - 4px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:var(--fs-body);font-weight:600;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;animation:toast .32s cubic-bezier(.2,.8,.2,1);display:flex;gap:6px;align-items:center}
@keyframes toast{from{transform:translate(-50%,calc(100% + 40px))}}
/* quantity saved: drops in from the top so it is seen while the thumb is on the sizes */
.toast.top{bottom:auto;top:max(10px,calc(env(safe-area-inset-top,0px) + 6px));animation-name:toast-top}
@keyframes toast-top{from{transform:translate(-50%,calc(-100% - 40px))}}

/* ---------- landscape: horizontal working layout ---------- */
@container app (orientation: landscape){
  .ov-nav{min-height:40px;padding-top:2px}
  .ov-bar{padding:6px 14px max(6px,env(safe-area-inset-bottom,0px))}
  .cap-btn,.round{height:42px}
  .round{width:42px}
  .dock{bottom:max(8px,calc(env(safe-area-inset-bottom,0px) - 8px))}
  .tabbar{padding:4px}
  .tab{flex-direction:row;gap:6px;font-size:var(--fs-caption);padding:6px 16px}
  .screen.tabbed{padding-bottom:64px}
  .screen.tabbed.with-pill{padding-bottom:114px}
  .ov-body{padding-bottom:72px}
  .ov-actions{bottom:max(8px,calc(env(safe-area-inset-bottom,0px) - 8px))}
}
@container app (orientation: landscape) and (min-width: 600px){
  .today-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
  .h1{font-size:var(--fs-title)}
  .pgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .vf-stage{transform:translate(-50%,-42%)}
  .sheet,.match{max-height:94%}
  .sheet.tall{height:94%}
}
@container app (min-width: 700px) and (orientation: portrait){
  .pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.umd.js"></script>
<script>
const {html, render, useState, useEffect, useMemo, useRef} = window.htmPreact;

/* =====================================================================
   Data — catalogue built from loewe.com (styles, colour codes, photos; wholesale prices indicative). Mirrors the shape of the
   shared database the iOS app will write to (orders, lines, audit log).
   ===================================================================== */
// Sellers working the showroom; each sees only their own appointments and orders
const REPS = {
  roberto:{id:'roberto', name:'Roberto D.', full:'Roberto D.', ini:'RD'},
  sofia:  {id:'sofia', name:'Sofia L.', full:'Sofia L.', ini:'SL'},
  marc:   {id:'marc', name:'Marc D.', full:'Marc D.', ini:'MD'},
};

// Spend against budget per division and per category; percentages are on each category's own budget
function kpi(order, div) {
  const b = BUYERS[order.buyerId];
  const byCat = {bags:0, rtw:0, shoes:0, acc:0};
  let total = 0, u = 0, open = 0;
  order.lines.forEach(l => { const p = P[l.pid]; if (p.div !== div) return; const v = lineValue(l); byCat[p.cat] += v; total += v; u += units(l.qty); if (!units(l.qty)) open++; });
  const budget = divBudget(b, div);
  const mix = CATS.map(c => { const bud = catBudget(b, div, c), v = byCat[c];
    return {cat:c, value:v, budget:bud, used: bud ? v / bud * 100 : 0, st: usedSt(v, bud)}; });
  const used = budget ? total / budget * 100 : 0;
  const mine = order.lines.filter(l => P[l.pid].div === div);
  const valueOf = has => mine.filter(l => has(P[l.pid])).reduce((a, l) => a + lineValue(l), 0);
  const rules = (RULES[div] || []).map(r => { const v = valueOf(r.has), share = total ? v / total * 100 : 0;
    return {...r, value:v, share, limit: total * (r.max != null ? r.max : r.min) / 100, st: !total ? 'none' : r.max != null ? (share > r.max ? 'bad' : 'ok') : (share < r.min ? 'warn' : 'ok')}; });
  // required looks the client can buy: done when every piece is in the order with a quantity
  const looks = LOOKS.filter(l => l.div === div && l.req && l.items.every(([pid]) => available(b, P[pid]))).map(l => {
    const have = l.items.filter(([pid, c]) => mine.some(x => x.pid === pid && x.colour === c && units(x.qty))).length;
    return {l, have, n:l.items.length, done: have === l.items.length}; });
  const drops = Object.keys(DROPS).map(k => { const ls = mine.filter(l => P[l.pid].drop === k);
    return {k, units: ls.reduce((a, l) => a + units(l.qty), 0), value: ls.reduce((a, l) => a + lineValue(l), 0)}; });
  return {total, units:u, open, budget, used, bst: usedSt(total, budget) === 'none' ? 'ok' : usedSt(total, budget), mix, rules, looks, drops};
}

function applyDraft(o, pid, draft, via, by) {
  const p = P[pid], now = Date.now();
  const idx = o.lines.findIndex(l => l.pid === pid);
  const old = o.lines.filter(l => l.pid === pid);
  const rest = o.lines.filter(l => l.pid !== pid);
  const fresh = [], msgs = [];
  for (const c of p.colours) {
    const q = {}; Object.entries(draft[c] || {}).forEach(([s, n]) => { if (n > 0) q[s] = n; });
    const prev = old.find(l => l.colour === c), u = units(q), pu = prev ? units(prev.qty) : 0;
    if (!prev && !u) continue;
    // a colour already in the order stays selected at zero; only Remove takes it out
    const same = prev && qkey(prev.qty) === qkey(q);
    fresh.push(same ? prev : prev ? {...prev, qty:q, at:now} : {id:uid(), pid, colour:c, qty:q, via, by, at:now});
    if (!prev) msgs.push(`Added ${p.name} · ${cname(c)} ×${u}${via === 'photo' ? ' (photo match)' : via === 'suggestion' ? ' (suggestion)' : ''}`);
    else if (!same) msgs.push(u ? `Changed ${p.name} · ${cname(c)} ×${pu} → ×${u}` : `Cleared quantities for ${p.name} · ${cname(c)}`);
  }
  const at = idx < 0 ? rest.length : o.lines.slice(0, idx).filter(l => l.pid !== pid).length;
  rest.splice(at, 0, ...fresh);
  o.lines = rest;
  msgs.forEach(m => log(o, by, m));
  return msgs.length;
}

// one client visit at a time on this device: only the latest check-in stays ongoing; on launch ('-') every visit is ended, so the app always opens with nobody checked in
function oneOngoing(appts, keep) {
  const on = Object.keys(appts).filter(k => appts[k] && appts[k].in && !appts[k].out);
  keep = keep || on.sort((x, y) => (appts[y].back || appts[y].in) - (appts[x].back || appts[x].in))[0];
  on.forEach(k => { if (k !== keep) appts[k] = {...appts[k], out:Date.now()}; });

}

// a ten-day showroom campaign: three days done, today, six to come
const DAY_OFFS = [-3, -2, -1, 0, 1, 2, 3, 4, 5, 6];
const SHOW_DAYS = DAY_OFFS.map(off => { const d = new Date(); d.setDate(d.getDate() + off); return d; });
const TODAY_IDX = DAY_OFFS.indexOf(0);

const dayLabel = b => !dayOf(b) ? 'Today' : SHOW_DAYS[DAY_OFFS.indexOf(dayOf(b))].toLocaleDateString('en-GB', {weekday:'short', day:'numeric'});

/* =====================================================================
   Catalogue — in a visit, only the styles that client can buy
   ===================================================================== */
// every word must match somewhere: name, code, family, category, material, colours or keywords ("black leather bag")
const matches = (p, ql) => { if (!ql) return true;
  const hay = [p.name, p.code, p.family, CAT_LABEL[p.cat], p.material, p.keywords, ...p.colours].join(' ').toLowerCase();
  return ql.split(/\s+/).every(w => hay.includes(w.length > 3 ? w.replace(/s$/, '') : w)); };
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-');
const SUBTYPE = {rtw:p => p.family, acc:p => p.family === 'Puzzle' ? 'Small leather goods' : p.family};

function ProductList({div, q, b, season, onPick}) {
  const ql = q.trim().toLowerCase();
  const items = PRODUCTS.filter(p => (!div || p.div === div) && (!season || p.season === season) && (!b || available(b, p)) && matches(p, ql));
  if (!items.length) return html`<div class="empty">${ql ? `No styles match “${q}”. Try a style, code, material or colour.` : `No ${DIV_LABEL[div].toLowerCase()} styles in this collection.`}</div>`;
  return html`<div class="list">${items.map(p => html`<button class="row" onClick=${() => onPick(p)}>
    <${Thumb} pid=${p.id} colour=${p.colours[0]}/>
    <div class="row-main"><div class="row-title">${p.name}</div><div class="row-sub"><span class="code">${p.code}</span> · ${CAT_LABEL[p.cat]}</div></div>
    <div class="row-side"><span class="row-val">${fmt(p.price)}</span></div>
  </button>`)}</div>`;
}

// Three levels, two controls: Women / Men is the page title, categories are one sticky row, and families are headings in the grid
function CatalogueTab({S, ui, act}) {
  // both divisions are always there; with a client checked in it opens on what they buy
  const so = activeOrder(S, ui), sb = so && BUYERS[so.buyerId], divs = ['W', 'M'];
  const [q, setQ] = useState(''), [div, setDiv] = useState(sb ? sb.divs[0] : 'W'), [cur, setCur] = useState(null);
  const season = SEASONS.find(x => x.id === ui.catSeason);
  const ql = q.trim().toLowerCase();
  const items = PRODUCTS.filter(p => p.div === div && p.season === season.id && (!sb || available(sb, p)) && (!ui.catDrop || p.drop === ui.catDrop) && hasTag(p, ui.catTag) && hasMat(p, ui.catMat) && matches(p, ql));
  // category, then a sub-heading only where the family is a kind of product (Dresses, Hats); bags and shoes families are lines (Puzzle, Pebble), so they just sit together
  const groups = CATS.map(c => { const ps = items.filter(p => p.cat === c), sub = SUBTYPE[c];
    return {cat:c, n:ps.length, fams:sub ? [...new Set(ps.map(sub))].map(f => ({f, id:c + '-' + slug(f), ps:ps.filter(p => sub(p) === f)}))
      : [...new Set(ps.map(p => p.family))].map(f => ({f:null, id:c + '-' + slug(f), ps:ps.filter(p => p.family === f)}))}; }).filter(g => g.n);
  const ref = useRef(null), nav = useRef(null), hold = useRef(0);
  const navBottom = () => nav.current ? nav.current.getBoundingClientRect().bottom : 0;
  // scroll-spy: the last category heading that has passed under the sticky tabs is the current one
  useEffect(() => { const sc = ref.current && ref.current.closest('.screen'); if (!sc) return;
    const spy = () => { if (Date.now() < hold.current) return; const top = navBottom() + 12; let id = null;
      ref.current.querySelectorAll('[data-spy]').forEach(el => { if (el.getBoundingClientRect().top <= top) id = el.dataset.spy; }); setCur(id); };
    spy(); sc.addEventListener('scroll', spy, {passive:true}); return () => sc.removeEventListener('scroll', spy); }, [div, ql, season.id, ui.catDrop, ui.catTag, ui.catMat, groups.length]);
  // tap: glide to the target just below the tabs; the spy waits so the tabs don't flicker on the way
  const go = id => { const el = document.getElementById('c-' + id), sc = ref.current && ref.current.closest('.screen'); if (!el || !sc) return;
    hold.current = Date.now() + 700; setCur(id);
    // aim for where the tabs end once they are stuck to the top, not where they sit before the page scrolls
    const stuck = sc.getBoundingClientRect().top + nav.current.offsetHeight;
    sc.scrollTo({top: sc.scrollTop + el.getBoundingClientRect().top - stuck - 10, behavior:'smooth'}); };
  const curCat = groups.some(g => g.cat === cur) ? cur : groups[0] && groups[0].cat;
  // keep the active tab in view inside its scrolling row
  useEffect(() => { if (!nav.current) return; nav.current.querySelectorAll('.cn-cat.on').forEach(el => { const row = el.parentElement;
    row.scrollLeft = el.offsetLeft - row.clientWidth / 2 + el.offsetWidth / 2; }); }, [curCat]); // instant: a second smooth scroll would cancel the vertical glide in Chrome
  const pickDiv = d => { setDiv(d); setCur(null); const sc = ref.current && ref.current.closest('.screen'); if (sc) sc.scrollTop = 0; };
  return html`
    <header class="top top-bar mid"><h1 class="h1 div-title" role="tablist" aria-label="Collection">${divs.map(d => html`<button role="tab" aria-selected=${d === div} class=${d === div ? 'on' : ''} onClick=${() => pickDiv(d)}>${DIV_TAB[d]}</button>`)}</h1></header>
    <section class="sec">
      <div class="searchrow">
        <label class="search"><${Icon} n="search" s=${18}/><input id="cat-q" placeholder="Search" aria-label="Search by style, code, material, colour or keyword" value=${q} onInput=${e => setQ(e.target.value)}/></label>
        ${so && html`<button class="sq-btn" onClick=${() => { act.set({capDiv:div}); act.capture(true); }} aria-label="Photograph a sample"><${Icon} n="cam" s=${20} w=${2}/></button>`}
        <button class=${'sq-btn' + (ui.catDrop || ui.catTag || ui.catMat || season.id !== SEASONS[0].id ? ' on' : '')} onClick=${() => act.sheet({type:'filter'})} aria-label=${`Filters: ${season.name}` + (ui.catDrop ? `, ${DROPS[ui.catDrop].split(' · ')[0]}` : '') + (ui.catTag ? `, ${TAG_OPTS.find(x => x[0] === ui.catTag)[1]}` : '') + (ui.catMat ? `, ${MATS.find(x => x[0] === ui.catMat)[1]}` : '')}><${Icon} n="filter" s=${20} w=${2}/></button>
      </div>
      ${(ui.catDrop || ui.catTag || ui.catMat) && html`<div class="fchips">
        ${ui.catDrop && html`<button class="fchip" onClick=${() => act.set({catDrop:null})} aria-label="Clear drop filter">${DROPS[ui.catDrop].split(' · ')[0]} · ${dropWhen(ui.catDrop).replace('Delivers ', '')}<${Icon} n="x" s=${14} w=${2.2}/></button>`}
        ${ui.catTag && html`<button class="fchip" onClick=${() => act.set({catTag:null})} aria-label="Clear priority filter">${TAG_OPTS.find(x => x[0] === ui.catTag)[1]}<${Icon} n="x" s=${14} w=${2.2}/></button>`}
        ${ui.catMat && html`<button class="fchip" onClick=${() => act.set({catMat:null})} aria-label="Clear material filter">${MATS.find(x => x[0] === ui.catMat)[1]}<${Icon} n="x" s=${14} w=${2.2}/></button>`}
      </div>`}
      ${!items.length ? html`<div class="empty">${ql ? `No styles match “${q}”. Try a style, code, material or colour.` : `No ${DIV_LABEL[div].toLowerCase()} styles in this collection.`}</div>`
      : html`<div ref=${ref}>
        <nav class="cat-nav" ref=${nav} aria-label="Categories">
          <div class="cn-row" role="tablist">${groups.map(g => html`<button role="tab" aria-selected=${curCat === g.cat} class=${'cn-cat' + (curCat === g.cat ? ' on' : '')} onClick=${() => go(g.cat)}>${CAT_LABEL[g.cat]}</button>`)}</div>
        </nav>
        <div class="cat-main">${groups.map(g => html`<div class="cat-sec">
          <h2 class="cat-h" id=${'c-' + g.cat} data-spy=${g.cat}>${CAT_LABEL[g.cat]}</h2>
          <div class="pgrid">${g.fams.map(f => html`${f.f && html`<div class="fam-h" key=${f.id}>${f.f}</div>`}${f.ps.map(p => html`<${PCard} key=${p.id} p=${p} o=${so} act=${act}/>`)}`)}</div>
        </div>`)}</div>
      </div>`}
    </section>`;
}

// Signing in asks for the seller's 4-digit code: the passcode set in Profile (the avatar on Home), or any 4 digits until one is set.
// check returns an error to show (and the pad clears), or nothing to accept the code
function PinPad({rep, title, check, onDone, onBack}) {
  const [pin, setPin] = useState(''), [bad, setBad] = useState(null);
  const press = k => { setBad(null); setPin(p => k === 'del' ? p.slice(0, -1) : p.length < 4 ? p + k : p); };
  useEffect(() => { if (pin.length === 4) { const t = setTimeout(() => { const err = check && check(pin);
    if (err) { setBad(err); setPin(''); } else onDone(pin); }, 180); return () => clearTimeout(t); } }, [pin]);
  useEffect(() => { const key = e => { if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); };
    window.addEventListener('keydown', key); return () => window.removeEventListener('keydown', key); }, []);
  return html`<div class="pin">
    <span class="avatar">${rep.ini}</span>
    <div class=${'pin-t' + (bad ? ' bad' : '')} role="status">${bad || title || `Enter ${rep.name}’s code`}</div>
    <div class=${'pin-dots' + (bad ? ' bad' : '')} aria-label=${pin.length + ' of 4 digits entered'}>${[0, 1, 2, 3].map(i => html`<i class=${i < pin.length ? 'on' : ''}></i>`)}</div>
    <div class="pin-pad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', 'back', '0', 'del'].map(k => k === 'back'
      ? html`<button class="pin-k txt" onClick=${onBack}>Cancel</button>`
      : k === 'del' ? html`<button class="pin-k txt" onClick=${() => press('del')} aria-label="Delete" disabled=${!pin}><${Icon} n="back" s=${22}/></button>`
      : html`<button class="pin-k" onClick=${() => press(k)}>${k}</button>`)}</div>
  </div>`;
}

// Sellers’ feedback on the app itself (for the Vega team): a note and screenshots. In this mockup it stays on the device (the note and how many screenshots, not the images)
function FeedbackSheet({act}) {
  const [text, setText] = useState(''), [shots, setShots] = useState([]);
  const pick = e => { [...e.target.files].forEach(f => { const r = new FileReader(); r.onload = () => setShots(x => [...x, {id:uid(), src:r.result}]); r.readAsDataURL(f); }); e.target.value = ''; };

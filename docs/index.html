// Product page: with a client in session, sizes and quantities are set right here and save at once. Entering the first
// quantity on a colour puts that colour in the order; there is no Add button.
// Copy scale keeps this style's size scale (per size range, until another one is copied); Paste scale fills it on the next style.
function ProductSheet({pid, colour, orderId, S, ui, act}) {
  const p = P[pid], o = orderId ? S.orders[orderId] : activeOrder(S, ui), b = o && BUYERS[o.buyerId], why = o && canTake(o, p);
  const [c, setC] = useState(() => { const l = o && o.lines.find(x => x.pid === pid); return colour || (l ? l.colour : p.colours[0]); });
  const looks = LOOKS.filter(l => l.items.some(([x]) => x === pid));
  const pick = () => act.sheet({type:'pick', item:{pid, colour:c, via:'search'}});
  const lineOf = x => o && o.lines.find(l => l.pid === pid && l.colour === x), line = lineOf(c);
  const q = line ? line.qty : {}, u = units(q), sized = p.sizes.length > 1, skey = p.sizes.join(' ');
  const clean = x => Object.fromEntries(Object.entries(x).filter(([, n]) => n > 0).map(([k, n]) => [k, Math.min(999, n)]));
  const setQ = next => { const n = clean(next);
    if (line) act.setQty(o.id, line.id, n); else if (units(n)) act.select(o.id, pid, c, 'search', n); };
  const close = act.close;
  const setQty = (sz, n) => setQ({...q, [sz]: Math.max(0, n)});
  const last = sized && ui.lastScale && ui.lastScale[skey], same = last && qkey(last) === qkey(clean(q));
  const copy = () => { act.set({lastScale: {...ui.lastScale, [skey]: clean(q)}}); act.toast('Scale copied'); };
  const edit = o && !why;
  const val = n => `${n} ${n === 1 ? 'unit' : 'units'}`;
  // tap the number to type it on the number pad (up to 999); + and − still step by one
  const num = (sz, cls = '') => html`<input class=${'qty num ' + cls} inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" value=${q[sz] || 0}
    aria-label=${sz === 'U' ? 'Quantity' : 'Quantity, size ' + sz} onFocus=${e => e.target.select()} onKeyDown=${e => e.key === 'Enter' && e.target.blur()}
    onInput=${e => setQty(sz, Math.min(999, parseInt(e.target.value.replace(/\D/g, ''), 10) || 0))}/>`;
  return html`<${Sheet} tall title=${p.name} onClose=${close}
    media=${html`<div class="pd-media"><${Carousel} p=${p} colour=${c} at=${ui.photoAt} onOpen=${i => act.set({zoom:{pid, colour:c, i}})}/><${Tag} p=${p}/></div>`}>
    <div class="pd-head"><h1 class="pd-name">${p.name}</h1>
      <div class="pd-sub"><span class="code">${p.code}</span></div></div>
    <div class="colours">${p.colours.map(x => html`<button class=${'colour' + (x === c ? ' on' : '')} onClick=${() => setC(x)}><span class="sw" style=${{background:COL[x][0]}}></span>${x}<span class="code">${COL[x][1]}</span>${lineOf(x) && html`<span class="flag-dot" title="In order"><${Icon} n="check" s=${12} w=${3}/></span>`}</button>`)}</div>
    <${Prices} cls="lg" p=${p}/>
    ${edit && html`<div class="pd-qty">
      ${p.sizes.length > 1 ? html`
        <div class="sizes">${p.sizes.map(sz => html`<div class=${'size-cell' + (q[sz] ? ' has' : '')}>
          <div class="sz">${sz}</div>
          <button class="step" aria-label=${'Add one size ' + sz} onClick=${() => setQty(sz, (q[sz] || 0) + 1)}><${Icon} n="plus" s=${20} w=${2}/></button>
          ${num(sz)}
          <button class="step" aria-label=${'Remove one size ' + sz} onClick=${() => setQty(sz, (q[sz] || 0) - 1)}><${Icon} n="minus" s=${20} w=${2}/></button>
        </div>`)}</div>
        ${(last || u > 0) && html`<div class="quick">
          ${u > 0 && html`<button class="qbtn" disabled=${same} onClick=${copy}><${Icon} n="copy" s=${15} w=${2}/>Copy scale</button>`}
          ${last && html`<button class="qbtn" disabled=${same} onClick=${() => setQ(last)}>Paste scale</button>`}
          ${u > 0 && html`<button class="qbtn" onClick=${() => setQ({})}>Clear</button>`}</div>`}` : html`
        <div class="single">
          <button class="step lg" aria-label="Remove one" onClick=${() => setQty('U', (q.U || 0) - 1)}><${Icon} n="minus" s=${26} w=${2}/></button>
          ${num('U', 'xl')}
          <button class="step lg" aria-label="Add one" onClick=${() => setQty('U', (q.U || 0) + 1)}><${Icon} n="plus" s=${26} w=${2}/></button>
        </div>
`}
    </div>`}
    <div class="pd-cta">${!o ? html`<button class="btn black" onClick=${pick}>Add to order</button>`
      : why ? html`${line && html`<div class="pd-in">In order · ${u ? val(u) : 'no quantity'}</div>`}<button class="btn black" disabled>${b.shop} · ${why}</button>`
      : line ? html`<button class="btn outline danger" onClick=${() => act.unselect(o.id, pid, c)}>Remove from order</button>`
      : html`<div class="pd-hint">${sized ? 'Enter quantities' : 'Tap +'} to add ${c}</div>`}</div>
    <div class="panel facts">
      ${p.material && html`<div><span>Material</span><span>${p.material}</span></div>`}
      <div><span>Division</span><span>${p.div === 'W' ? 'Womenswear' : 'Menswear'}</span></div>
      <div><span>Category</span><span>${CAT_LABEL[p.cat]}</span></div>
      ${looks.length > 0 && html`<div><span>Appears in</span><span>${looks.map((l, i) => html`${i ? ', ' : ''}<button class="plain" onClick=${() => act.sheet({type:'look', id:l.id})}>${lookNo(l)}</button>`)}</span></div>`}
      <div><span>Family</span><span>${p.family}</span></div>
      <div><span>Sizes</span><span>${p.sizes.join(' · ')}</span></div>
      <div><span>Delivery</span><span>${dropName(p.drop)}</span></div>
    </div>
  <//>`;
}

function SizeSheet({sh, S, act}) {
  const order = S.orders[sh.orderId], p = P[sh.pid], b = BUYERS[order.buyerId];
  const actor = sh.actor || 'salesperson';
  const init = useMemo(() => Object.fromEntries(p.colours.map(c => [c, {...((order.lines.find(l => l.pid === p.id && l.colour === c) || {}).qty || {})}])), []);
  const [draft, setDraft] = useState(init);
  const existing = order.lines.some(l => l.pid === p.id);
  const [col, setCol] = useState(sh.colour || (order.lines.find(l => l.pid === p.id) || {}).colour || p.colours[0]);
  const locked = !available(b, p);
  // once a part is sent it is read-only for the seller and the client alike
  const readOnly = partLocked(order, p.div);
  const q = draft[col] || {};
  const dirty = JSON.stringify(Object.fromEntries(Object.entries(draft).map(([c, x]) => [c, qkey(Object.fromEntries(Object.entries(x).filter(([, n]) => n > 0)))]))) !==
                JSON.stringify(Object.fromEntries(Object.entries(init).map(([c, x]) => [c, qkey(x)])));
  const setQty = (s, n) => setDraft(d => ({...d, [col]: {...d[col], [s]: Math.max(0, Math.min(99, n))}}));
  const setAll = arr => setDraft(d => ({...d, [col]: Object.fromEntries(p.sizes.map((s, i) => [s, arr[i] || 0]))}));
  const save = () => { if (dirty && !locked && !readOnly) { act.saveDraft(order.id, p.id, draft, sh.via || 'search', actor); return true; } return false; };
  const close = () => { if (save()) act.toast('Saved to order'); act.close(); };
  const done = () => { save(); act.close(); act.toast(existing ? 'Order updated' : 'Added to order'); };
  const go = (pid, colour) => { if (save()) act.toast('Saved to order'); act.sheet({type:'size', orderId:order.id, pid, colour, via:'suggestion', actor}); };

  const projected = useMemo(() => { const o = JSON.parse(JSON.stringify(order)); applyDraft(o, p.id, draft, 'x', actor); return o; }, [draft, order]);
  const k0 = kpi(order, p.div), k1 = kpi(projected, p.div);
  const m0 = k0.mix.find(m => m.cat === p.cat), m1 = k1.mix.find(m => m.cat === p.cat);
  const tUnits = Object.values(draft).reduce((a, x) => a + units(x), 0);
  const family = PRODUCTS.filter(x => x.family === p.family && x.id !== p.id && x.div === p.div && available(b, x));
  const sug = (pid, colour) => { const xp = P[pid], has = order.lines.some(l => l.pid === pid);
    return html`<button class="sug" onClick=${() => go(pid, colour)}><${Thumb} pid=${pid} colour=${colour}/><div class="sug-n">${xp.name}</div>
      <div class="small muted">${has ? 'Added' : fmt(xp.price)}</div></button>`; };
  return html`<${Sheet} tall title=${p.name} sub=${`${p.code} · ${prices(p)}`} onClose=${close}
    foot=${readOnly ? html`<button class="btn secondary" onClick=${act.close}>Close</button>` : html`
      ${existing && html`<button class="btn danger" style="flex:0 0 auto" onClick=${() => act.unselect(order.id, p.id, null, actor)}>Remove</button>`}
      <button class="btn primary" disabled=${locked || (!existing && tUnits === 0)} onClick=${done}>${existing ? 'Save changes' : tUnits ? `Add ${tUnits} to order` : 'Enter quantities'}</button>`}>
    <div class="ss-top">
      <${Thumb} cls="lg" pid=${p.id} colour=${col}/>
      <div class="ss-info">
        <div class="small muted">${DIV_LABEL[p.div]} · ${CAT_LABEL[p.cat]} · ${DROPS[p.drop]}</div>
        <div class="ss-total"><b>${tUnits}</b> units · <span class="num">${fmt(tUnits * p.price)}</span></div>
      </div>
    </div>
    ${locked && html`<div class="callout bad"><${Icon} n="lock" s=${18}/><div>${p.name} isn’t available to ${b.shop}, so it can’t go on this order.</div></div>`}
    ${readOnly && html`<div class="callout info"><${Icon} n="lock" s=${18}/><div>The ${DIV_LABEL[p.div].toLowerCase()} order has been sent and can’t be changed here.</div></div>`}
    <div class="lbl">Colour <span style="text-transform:none;letter-spacing:0;font-weight:400">· ${p.colours.length} options</span></div>
    <div class="colours">${p.colours.map(c => html`<button class=${'colour' + (c === col ? ' on' : '')} onClick=${() => setCol(c)}><span class="sw" style=${{background:COL[c][0]}}></span>${c}<span class="code">${COL[c][1]}</span>${units(draft[c]) > 0 && html`<span class="cnt">${units(draft[c])}</span>`}</button>`)}</div>
    ${!locked && !readOnly && html`
      <div class="lbl">${p.sizes.length > 1 ? 'Sizes' : 'Quantity'} · ${col}</div>
      ${p.sizes.length > 1 ? html`
        <div class="sizes">${p.sizes.map(s => html`<div class=${'size-cell' + (q[s] ? ' has' : '')}>
          <div class="sz">${s}</div>
          <button class="step" aria-label=${'Add one size ' + s} onClick=${() => setQty(s, (q[s] || 0) + 1)}><${Icon} n="plus" s=${20} w=${2}/></button>
          <div class="qty num">${q[s] || 0}</div>
          <button class="step" aria-label=${'Remove one size ' + s} onClick=${() => setQty(s, (q[s] || 0) - 1)}><${Icon} n="minus" s=${20} w=${2}/></button>
        </div>`)}</div>
        ${units(q) > 0 && html`<div class="quick"><button class="qbtn" onClick=${() => setAll([])}>Clear</button></div>`}` : html`
        <div class="single">
          <button class="step lg" aria-label="Remove one" onClick=${() => setQty('U', (q.U || 0) - 1)}><${Icon} n="minus" s=${26} w=${2}/></button>
          <div class="qty xl num">${q.U || 0}</div>
          <button class="step lg" aria-label="Add one" onClick=${() => setQty('U', (q.U || 0) + 1)}><${Icon} n="plus" s=${26} w=${2}/></button>
        </div>`}
      <div class="panel impact">
        <div class="impact-row"><span class="muted">${CAT_LABEL[p.cat]} budget</span>
          <span class="num"><span class="muted">${fmt(m0.value)} →</span> <b class=${'st-' + m1.st}>${fmt(m1.value)}</b> <span class="muted">of ${fmt(m1.budget)}</span></span></div>
        <div class="impact-row"><span class="muted">${DIV_LABEL[p.div]} budget</span>
          <span class="num"><span class="muted">${fmt(k0.total)} →</span> <b>${fmt(k1.total)}</b> <span class="muted">of ${fmt(k1.budget)}</span></span></div>
      </div>`}
    ${family.length > 0 && html`<div class="lbl">Same family · ${p.family}</div><div class="sugs">${family.map(x => sug(x.id, x.colours.includes(col) ? col : x.colours[0]))}</div>`}
  <//>`;
}

function issuesOf(o, divs) {
  const out = [];
  divs.forEach(d => { const k = kpi(o, d); if (!k.total) return;
    k.mix.filter(m => m.st === 'warn' || m.st === 'bad').forEach(m => out.push({label:`${DIV_LABEL[d]} ${CAT_LABEL[m.cat].toLowerCase()}`, text: m.budget ? `${fmt(m.value)} of ${fmt(m.budget)}` : 'No budget', st:m.st}));
    if (k.bst !== 'ok') out.push({label:`${DIV_LABEL[d]} budget`, text:`${fmt(k.total)} of ${fmt(k.budget)}`, st:k.bst});
    k.rules.filter(r => r.st === 'bad' || r.st === 'warn').forEach(r => out.push({label:`${DIV_TAB[d]} · ${r.label}`, text:`${fmt(r.value)}, ${ruleLimit(r)}`, st:r.st}));
    k.looks.filter(x => !x.done).forEach(x => out.push({label:`${DIV_TAB[d]} · ${lookNo(x.l)}`, text:`${x.have} of ${x.n} pieces`, st:'warn'})); });
  return out;
}

// Finishing the visit: the client always signs, then the seller sends the order to the commercial team (closed, waiting for
// confirmation, with a copy to the client; not while a style has no quantity) or back to the client to finish from an email link (still a draft). Women's and men's can go together or one at a time.
function FinishSheet({sh, S, act}) {
  const o = S.orders[sh.orderId], b = BUYERS[o.buyerId];
  const open = b.divs.filter(d => !partLocked(o, d)), filled = d => kpi(o, d).units > 0;
  const [pick, setPick] = useState(() => open.filter(filled));
  const sel = pick.filter(d => open.includes(d));
  const toggle = d => setPick(p => p.includes(d) ? p.filter(x => x !== d) : [...p, d]);
  const noQty = o.lines.filter(l => sel.includes(P[l.pid].div) && !units(l.qty)).length;
  const [name, setName] = useState(''), [email, setEmail] = useState(b.email || `buying@${b.shop.toLowerCase().replace(/[^a-z0-9]/g, '')}.com`);
  const [signed, setSigned] = useState(false), [done, setDone] = useState(null);
  const ok = sel.length > 0 && name.trim() && /^\S+@\S+\.\S+$/.test(email.trim()) && signed;
  const visit = isOngoing(S.appts[b.id]), shared = open.some(d => partOf(o, d).status === 'shared');
  const toTeam = () => { act.send(o.id, sel, 'client', name.trim(), email.trim());
    setDone({title:'Sent to the commercial team', line:`${visit ? b.shop + ' is checked out. ' : ''}A copy is on its way to ${email.trim()}.`}); };
  const toClient = () => { act.share(o.id, sel, name.trim(), email.trim());
    setDone({title:`Sent to ${b.shop}`, line:`The link is on its way to ${email.trim()}.`, client:true}); };
  // Continue ends the visit and goes back to Home, ready for the next client
  const next = () => visit ? act.endVisit(b.id, null) : act.close();
  if (done) return html`<${FullPage} title=${done.title} onClose=${next}
    foot=${html`<div class="finish-btns"><button class="btn black" onClick=${next}>Continue</button>
      ${done.client && html`<button class="btn ghost" onClick=${() => act.role('buyer', o.id)}>Open as the client (demo)</button>`}</div>`}>
    <div class="done" role="status"><span class="done-ic"><${Icon} n="check" s=${46} w=${3}/></span>
      <h1 class="h1">${done.title}</h1><p class="muted">${done.line}</p></div>
  <//>`;
  return html`<${FullPage} title="Finish order" onClose=${act.close}
    foot=${open.length > 0 && html`<div class="finish-btns">
      <button class="btn black" disabled=${!ok || noQty > 0} onClick=${toTeam}>Send to commercial team</button>
      <div class="small muted">The order is closed. The commercial team confirms it for production; the client gets a copy by email.</div>
      <button class="btn white" disabled=${!ok} onClick=${toClient}>Send to client to finish</button>
      <div class="small muted">It stays a draft. The client gets an email link to add or change quantities.</div>
    </div>`}>
    <div><h1 class="h1">Finish order</h1><div class="small muted">${b.shop}</div></div>
    ${!open.length ? html`<div class="callout good"><${Icon} n="check" s=${18}/><div>Everything is sent. The commercial team reviews the order and confirms it for production.</div></div>` : html`
      ${shared && html`<button class="btn secondary block" onClick=${() => act.role('buyer', o.id)}>Open as the client (demo)</button>`}
      ${b.divs.length > 1 && html`<div class="field"><span class="lbl">What to send</span>
        <div class="list">${b.divs.map(d => { const k = kpi(o, d), st = partOf(o, d).status, can = open.includes(d) && filled(d);
          return html`<button class="row opt" disabled=${!can} aria-pressed=${sel.includes(d)} onClick=${() => toggle(d)}>
            <div class="row-main"><div class="row-title">${DIV_LABEL[d]}</div><div class="row-sub"><${Pill} s=${st}/><span class="num">${k.units} units · ${fmt(k.total)}</span></div></div>
            <div class="row-side">${sel.includes(d) && html`<${Icon} n="check" s=${20} w=${2.4}/>`}</div>
          </button>`; })}</div></div>`}
      ${!sel.length && html`<div class="callout warn"><${Icon} n="alert" s=${18}/><div>Add quantities before sending the order.</div></div>`}

      <label class="field"><span class="lbl">Client name</span><input class="inp" value=${name} onInput=${e => setName(e.target.value)} autocomplete="off" placeholder="Name of the person signing"/></label>
      <label class="field"><span class="lbl">Email</span><input class="inp" type="email" inputmode="email" autocapitalize="off" value=${email} onInput=${e => setEmail(e.target.value)}/></label>
      <div class="field"><span class="lbl">Signature</span><${SignPad} onSigned=${setSigned}/></div>`}
  <//>`;

// Signature pad: finger or mouse, drawn on a canvas
function SignPad({onSigned}) {
  const ref = useRef(null), on = useRef(false);
  useEffect(() => { const c = ref.current, r = c.getBoundingClientRect(), k = window.devicePixelRatio || 1;
    c.width = r.width * k; c.height = r.height * k; const x = c.getContext('2d'); x.scale(k, k);
    x.lineWidth = 2.4; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = getComputedStyle(c).color; }, []);
  const at = e => { const r = ref.current.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const down = e => { ref.current.setPointerCapture(e.pointerId); on.current = true; const x = ref.current.getContext('2d'); x.beginPath(); x.moveTo(...at(e)); };
  const move = e => { if (!on.current) return; const x = ref.current.getContext('2d'); x.lineTo(...at(e)); x.stroke(); onSigned(true); };
  const up = () => { on.current = false; };
  const clear = () => { const c = ref.current; c.getContext('2d').clearRect(0, 0, c.width, c.height); onSigned(false); };
  return html`<div class="sign">
    <canvas ref=${ref} class="sign-pad" onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up} aria-label="Signature"></canvas>
    <span class="sign-hint">Sign here</span>
    <button class="linkbtn sign-clear" onClick=${clear}>Clear</button>
  </div>`;
}

function SignSheet({sh, S, act}) {

  const sent = `${sh.divs.map(d => DIV_TAB[d]).join(' + ')} sent`;

    if (isOngoing(S.appts[b.id])) act.endVisit(b.id, `${sent} · ${b.shop} checked out`); else { act.close(); act.toast(sent); } };
  return html`<${FullPage} title="Sign the order" onClose=${act.close}
    foot=${html`<button class="btn primary" disabled=${!name.trim() || !signed} onClick=${send}>Confirm and send · ${fmt(value)}</button>`}>

function makeActs(setS, setUi, onReset) {

    // opening an order only shows it; the client in session changes only with a check-in
    openOrder: bid => { const id = 'o-' + bid;
      setS(s => s.orders[id] ? s : {...s, orders:{...s.orders, [id]:newOrder(bid)}, savedAt:Date.now()});
      setUi(u => ({...u, view:id, div: u.view === id ? u.div : BUYERS[bid].divs[0], sheet:null, capture:false})); },
    back: () => setUi(u => ({...u, view:null, capture:false, sheet:null})),
    tab: t => setUi(u => ({...u, tab:t, view:null, sub:null})),
    sheet: sh => setUi(u => ({...u, sheet:sh, capture: sh && sh.type === 'picker' ? false : sh && sh.type === 'size' ? false : u.capture})),
    close: () => setUi(u => ({...u, sheet:null})),
    capture: on => setUi(u => ({...u, capture:on, sheet:null})),
    div: d => setUi(u => ({...u, div:d})),
    set: patch => setUi(u => ({...u, ...patch})),
    switchRep: id => { setS(s => ({...s, rep:id, signedOut:false})); setUi(u => ({...u, sheet:null, view:null, sub:null, session:null})); a.toast(`Signed in as ${REPS[id].name}`); },
    // signing out leaves any visit as it is: it is still there when that seller signs back in
    signOut: () => { setS(s => ({...s, signedOut:true})); setUi(u => ({...u, sheet:null, view:null, sub:null, session:null, tab:'calendar', capture:false, zoom:null})); },
    feedback: (text, shots) => { setS(s => ({...s, feedback:[...(s.feedback || []), {at:Date.now(), rep:s.rep, text, shots}], savedAt:Date.now()})); a.close(); a.toast('Thanks · feedback sent'); },
    setPin: pin => { setS(s => ({...s, pins:{...s.pins, [s.rep]:pin}, savedAt:Date.now()})); a.close(); a.toast('Passcode set'); },
    startSession: bid => { const id = 'o-' + bid;
      setS(s => s.orders[id] ? s : {...s, orders:{...s.orders, [id]:newOrder(bid)}, savedAt:Date.now()});
      setUi(u => ({...u, session:id, div: BUYERS[bid].divs[0]})); },
    // appointment record: every change is stored straight away (state persists on each update)
    appt: (bid, patch) => setS(s => ({...s, appts:{...s.appts, [bid]:{...(s.appts[bid] || {}), ...patch}}, savedAt:Date.now()})),
    // checking in starts the client session (black band on top) and opens the Collection; one client at a time, so whoever
    // was ongoing, for any seller on this device, is checked out. Checking in again after a check-out keeps the original start time.
    checkIn: (bid, stay) => { const now = Date.now(), id = 'o-' + bid;
      setS(s => { const appts = oneOngoing({...s.appts}, bid);
        const x = appts[bid] || {}; appts[bid] = x.in ? {...x, out:null, back:now} : {...x, in:now, out:null};
        return {...s, appts, orders: s.orders[id] ? s.orders : {...s.orders, [id]:newOrder(bid)}, savedAt:now}; });
      // no toast: the client pill appearing is the confirmation
      setUi(u => ({...u, session:id, div:BUYERS[bid].divs[0], sheet:null, capture:false, ...(stay ? {} : {tab:'catalogue', view:null})})); },
    // a visit ends from the order (Finish order: sent to the commercial team or to the client) and goes back to Home
    endVisit: (bid, msg) => { a.appt(bid, {out:Date.now()}); setUi(u => ({...u, session: u.session === 'o-' + bid ? null : u.session, view:null, sheet:null, sub:null, tab:'calendar'})); a.toast(msg); },
    checkOut: bid => { a.appt(bid, {out:Date.now()}); setUi(u => u.session === 'o-' + bid ? {...u, session:null} : u); a.toast(`Checked out · ${BUYERS[bid].shop}`); },
    note: (bid, text) => a.appt(bid, {notes:text}),
    // the client in session: land in the Collection to add products
    addProducts: () => setUi(u => ({...u, tab:'catalogue', view:null, sheet:null})),
    // add flow from Collection or a lookbook with nobody checked in: check that client in, then add the piece
    addFor: (bid, item) => { a.checkIn(bid, true); a.select('o-' + bid, item.pid, item.colour, item.via); },
    newBuyer: (b, item, appt) => { BUYERS[b.id] = b; setS(s => ({...s, buyers:{...s.buyers, [b.id]:b}}));
      if (item) a.addFor(b.id, item); else if (appt) a.sheet({type:'appt', bid:b.id}); else a.checkIn(b.id); },
    mut: (id, fn) => setS(s => { const o = JSON.parse(JSON.stringify(s.orders[id])); fn(o); syncStatus(o); return {...s, orders:{...s.orders, [id]:o}, savedAt:Date.now()}; }),
    role: (r, id) => setUi(u => ({...u, role:r, buyerOrder:id || u.buyerOrder, sheet:null, capture:false})),
    reset: onReset,
  };
  a.saveDraft = (id, pid, draft, via, by) => a.mut(id, o => applyDraft(o, pid, draft, via, by));
  // selection without quantity: the style-colour joins the order at zero units
  // adding a style from a division the client doesn't buy asks first, then opens that division on the order with no budget
  a.divOk = (id, d) => { const b = BUYERS[id.slice(2)]; if (b.divs.includes(d)) return true;
    if (!confirm(`${b.shop} doesn’t buy ${DIV_TAB[d]}. Add ${DIV_TAB[d]} to this order?`)) return false;
    const nb = {...b, divs:['W', 'M'].filter(x => x === d || b.divs.includes(x)), budget:{...b.budget, [d]:0}};
    BUYERS[b.id] = nb; setS(s => ({...s, buyers:{...s.buyers, [b.id]:nb}})); return true; };
  a.select = (id, pid, colour, via, qty={}) => { const p = P[pid], u = units(qty); if (!a.divOk(id, p.div)) return false;
    a.mut(id, o => { if (o.lines.some(l => l.pid === pid && l.colour === colour)) return;
      o.lines.push({id:uid(), pid, colour, qty:{...qty}, via, by:'salesperson', at:Date.now()});
      log(o, 'salesperson', `${u ? 'Added' : 'Selected'} ${p.name} · ${cname(colour)}${u ? ' ×' + u : ''}${via === 'photo' ? ' (photo match)' : ''}`); });
    a.toast(u ? `Added to order · ${u} ${u === 1 ? 'unit' : 'units'}` : 'Added to order', u > 0); };
  // the whole runway look in one go: every piece the client can buy that isn't in the order yet
  a.selectLook = (id, look) => { let k = 0; if (!a.divOk(id, look.div)) return;
    a.mut(id, o => { look.items.forEach(([pid, colour]) => { if (canTake(o, P[pid]) || o.lines.some(l => l.pid === pid && l.colour === colour)) return;
      o.lines.push({id:uid(), pid, colour, qty:{}, via:'look', by:'salesperson', at:Date.now()}); k++; });
      log(o, 'salesperson', `Added ${lookNo(look)} · ${k} pieces`); });
    a.close(); a.toast('Added to order'); };
  a.unselect = (id, pid, colour, by='salesperson') => { const p = P[pid];
    a.mut(id, o => { o.lines = o.lines.filter(l => !(l.pid === pid && (!colour || l.colour === colour))); log(o, by, `Removed ${p.name}${colour ? ' · ' + cname(colour) : ''}`); });
    setUi(u => u.sheet && u.sheet.type === 'size' ? {...u, sheet:null} : u); a.toast('Removed from order'); };
  // stepper on one-size styles; repeated taps update one log entry
  a.setUnits = (id, lineId, n) => { n = Math.max(0, Math.min(999, n)); a.mut(id, o => { const l = o.lines.find(x => x.id === lineId); if (!l) return; const p = P[l.pid]; l.qty = n ? {U: n} : {}; l.at = Date.now();
    const key = 'u:' + lineId, last = o.log[o.log.length - 1], text = `Set ${p.name} · ${cname(l.colour)} to ×${n}`;
    if (last && last.key === key) { last.text = text; last.at = Date.now(); } else o.log.push({at:Date.now(), by:'salesperson', text, key}); });
    a.toast(`Saved · ${n} ${n === 1 ? 'unit' : 'units'}`, true); };
  // sizes on a line from the product page; repeated taps update one log entry
  a.setQty = (id, lineId, qty) => { a.mut(id, o => { const l = o.lines.find(x => x.id === lineId); if (!l) return; const p = P[l.pid];
    l.qty = qty; l.at = Date.now();
    const key = 'u:' + lineId, last = o.log[o.log.length - 1], text = `Set ${p.name} · ${cname(l.colour)} to ×${units(qty)}`;
    if (last && last.key === key) { last.text = text; last.at = Date.now(); } else o.log.push({at:Date.now(), by:'salesperson', text, key}); });
    const n = units(qty); a.toast(`Saved · ${n} ${n === 1 ? 'unit' : 'units'}`, true); };
  // each division is sent on its own; the order's overall status follows from its parts
  a.share = (id, divs, signer, email) => a.mut(id, o => { const now = Date.now(); o.parts = o.parts || {};
    divs.forEach(d => { o.parts[d] = {status:'shared', at:now, signer, email}; }); o.sharedAt = now;
    log(o, 'salesperson', `${divs.map(d => DIV_LABEL[d]).join(' and ')} signed by ${signer} and sent to ${email} to finish · closes in 48h`); });
  a.send = (id, divs, by, signer, email) => a.mut(id, o => { const now = Date.now(); o.parts = o.parts || {};
    divs.forEach(d => { o.parts[d] = {status:'submitted', at:now, by, signer}; }); o.submittedBy = by; o.submittedAt = now;
    log(o, by, `${divs.map(d => DIV_LABEL[d]).join(' and ')} signed by ${signer} and sent${email ? ' · copy to ' + email : ''}`); });
  return a;
}

function App({onReset}) {
  const [S, setS] = useState(loadState);
  const [ui, setUi] = useState({tab:'calendar', view:null, sheet:null, capture:false, div:'W', role:'sales', toast:null, session:null, catSeason:'SS27', catDrop:null, catTag:null, catMat:null});
  useEffect(() => { saveState(S); }, [S]);
  useEffect(() => { saveSession(ui.session); }, [ui.session]);
  const act = useMemo(() => makeActs(setS, setUi, onReset), []);
  const order = ui.view && S.orders[ui.view];
  const sh = ui.sheet;
  const sheet = !sh ? null
    : sh.type === 'size' ? html`<${SizeSheet} key=${sh.pid + (sh.actor || '')} sh=${sh} S=${S} act=${act}/>`
    : sh.type === 'picker' ? html`<${PickerSheet} sh=${sh} act=${act}/>`
    : sh.type === 'finish' ? html`<${FinishSheet} sh=${sh} S=${S} act=${act}/>`
    : sh.type === 'kpis' ? html`<${KpiSheet} sh=${sh} S=${S} act=${act}/>`
    : sh.type === 'guide' ? html`<${GuideSheet} act=${act}/>`
    : sh.type === 'sign' ? html`<${SignSheet} sh=${sh} S=${S} act=${act}/>`
    : sh.type === 'look' ? html`<${LookSheet} id=${sh.id} S=${S} ui=${ui} act=${act}/>`
    : sh.type === 'product' ? html`<${ProductSheet} key=${sh.pid} pid=${sh.pid} colour=${sh.colour} orderId=${sh.orderId} S=${S} ui=${ui} act=${act}/>`
    : sh.type === 'filter' ? html`<${FilterSheet} ui=${ui} act=${act}/>`
    : sh.type === 'profile' ? html`<${ProfileSheet} S=${S} act=${act}/>`
    : sh.type === 'passcode' ? html`<${PasscodeSheet} S=${S} act=${act}/>`
    : sh.type === 'feedback' ? html`<${FeedbackSheet} act=${act}/>`
    : sh.type === 'newbuyer' ? html`<${NewBuyerSheet} S=${S} sh=${sh} act=${act}/>`
    : sh.type === 'pick' ? html`<${PickBuyerSheet} S=${S} sh=${sh} act=${act}/>`
    : sh.type === 'appt' ? html`<${ApptSheet} key=${sh.bid} sh=${sh} S=${S} act=${act}/>` : null;
  const toast = ui.toast && html`<div class=${'toast' + (ui.toastTop ? ' top' : '')} key=${ui.toastId} role="status"><${Icon} n="check" s=${16} w=${2.4}/>${ui.toast}</div>`;

  const buyerView = ui.role === 'buyer' && S.orders[ui.buyerOrder];
  // a checked-in client is always the client in session (after a reload or an account switch too)
  const ongoing = ongoingBuyer(S), sessionOk = !!activeOrder(S, ui);
  useEffect(() => { if (ongoing && !sessionOk && !buyerView) act.startSession(ongoing.id); }, [ongoing && ongoing.id, sessionOk, !!buyerView]);
  // the client in session rides as a pill above the tab bar on every tab; an open order is full screen, without either
  const so = activeOrder(S, ui), pill = !!(so && !order), capDiv = so && (BUYERS[so.buyerId].divs.includes(ui.capDiv) ? ui.capDiv : BUYERS[so.buyerId].divs[0]);
  if (buyerView) return html`<div class="app"><${BuyerView} S=${S} ui=${ui} act=${act}/>${sheet}${toast}</div>`;
  if (S.signedOut) return html`<div class="app"><${SignIn} S=${S} act=${act}/>${toast}</div>`;
  return html`<div class=${'app' + (pill ? ' with-pill' : '')}>
    ${order ? html`<${OrderView} S=${S} ui=${ui} act=${act} order=${order}/>` : html`
      <div class=${'screen tabbed' + (pill ? ' with-pill' : '')}>
        ${ui.tab === 'calendar' && html`<${CalendarTab} S=${S} act=${act}/>`}
        ${ui.tab === 'today' && html`<${Today} S=${S} ui=${ui} act=${act}/>`}
        ${ui.tab === 'catalogue' && html`<${CatalogueTab} key=${so ? so.id : 'none'} S=${S} ui=${ui} act=${act}/>`}
      </div>`}
    ${!order && html`<div class="dock">${pill && html`<${SessionBar} S=${S} ui=${ui} act=${act}/>`}<${TabBar} tab=${ui.tab} act=${act}/></div>`}
    ${ui.capture && so && html`<${Capture} order=${so} div=${capDiv} act=${act}/>`}
    ${ui.zoom && html`<${Zoom} z=${ui.zoom} act=${act}/>`}
    ${ui.pdf && html`<${PdfView} act=${act}/>`}
    ${sheet}${toast}
  </div>`;
}

function Shell() {
  const [orient, setOrient] = useState('portrait');
  const [k, setK] = useState(0);
  const reset = () => { clearState(); setK(x => x + 1); };
  return html`<div class="shell">
    <aside class="side">
      <div class="side-brand">Vega</div>
      <p class="side-lede">Showroom order capture for wholesale. A first web mockup of the iOS app: photo match, fast size entry, live guideline checks per client, and a signed record of each order sent.</p>
      <div class="lbl">Try this</div>
      <ol class="steps">${GUIDE_STEPS.map(s => html`<li>${s}</li>`)}</ol>
      <div class="side-ctrls"><${Seg} opts=${[['portrait', 'Portrait'], ['landscape', 'Landscape']]} val=${orient} on=${setOrient}/><button class="linkbtn" onClick=${reset}>Reset demo</button></div>
      <p class="fine">Prototype. Photo recognition is simulated against a catalogue built from loewe.com: real styles, colours and photos; wholesale prices are indicative. Orders save in this browser only.</p>
    </aside>
    <div class=${'device ' + orient}>
      <div class="statusbar"><span>9:41</span><span class="sb-r"><i style="height:5px"></i><i style="height:7px"></i><i style="height:9px"></i><i style="height:11px"></i><span class="sb-batt"><span></span></span></span></div>
      <${App} key=${k} onReset=${reset}/>
    </div>
  </div>`;
}

render(html`<${Shell}/>`, document.getElementById('root'));
</script>
</body>
</html>

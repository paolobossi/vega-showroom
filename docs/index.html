        <div class="lines-head"><span class="lbl">${lines.length} styles</span>${open && html`<button class="linkbtn" onClick=${() => act.sheet({type:'picker', orderId:o.id, div, actor:'client'})}>Add from the collection</button>`}</div>
        <div class="list">${lines.map(l => html`<${LineRow} key=${l.id} l=${l} onClick=${() => act.sheet({type:'size', orderId:o.id, pid:l.pid, colour:l.colour, via:l.via, actor:'client'})}/>`)}</div>
        ${!open && html`<div class="callout good"><${Icon} n="check" s=${18}/><div>Thank you. ${repOf(o).name} will review the order against the Maison guidelines within 3 days and confirm it for production.</div></div>`}
      </div>
    </div>
    ${open && html`<div class="ov-bar" style="flex-direction:column;align-items:stretch">
      ${confirming ? html`<div class="small muted" style="text-align:center">You’re submitting as ${b.buyer}. Quantities are produced exactly as ordered.</div>
        <div style="display:flex;gap:10px"><button class="btn secondary" style="flex:1" onClick=${() => setConfirming(false)}>Keep editing</button>
        <button class="btn primary" style="flex:1" onClick=${() => { act.submit(o.id, 'client'); setConfirming(false); act.toast('Order submitted'); }}>Submit order</button></div>`
      : html`<button class="btn primary block" onClick=${() => setConfirming(true)}>Review and submit · ${fmt(b.divs.reduce((a, d) => a + kpi(o, d).total, 0))}</button>`}
    </div>`}
  </div>`;
}

/* =====================================================================
   App shell
   ===================================================================== */
const GUIDE_STEPS = [
  'In Calendar, open Maison Dubois (already checked in): cluster and budgets per category. Tap Add products.',
  'In the Collection, tap + on a photo to select a style; the flag shows it is in the order, × takes it out. Tap a photo to see every shot.',
  'Tap the client bar at the top to open the order: set quantities line by line or in bulk, then check Budgets & KPIs.',
  'Tap the share button, share the basket, then open it as the buyer and submit.',
  'Back as the salesperson, review the guideline check, confirm, and open the factory export.',
];

function SessionBar({S, ui, act}) {
  const o = activeOrder(S, ui); if (!o) return null;
  const b = BUYERS[o.buyerId], v = b.divs.reduce((a, d) => a + kpi(o, d).total, 0), n = b.divs.reduce((a, d) => a + kpi(o, d).units, 0);
  return html`<div class="sbar" role="status">
    <button class="sbar-main" onClick=${() => act.openOrder(b.id)} aria-label=${`Ordering for ${b.shop} with ${b.buyer}: ${o.lines.length} selected, ${n} units, ${fmt(v)}. Open order`}>
      <span class="sbar-dot" aria-hidden="true"></span><span class="sbar-t">${b.shop}</span></button>
    <button class="sbar-x" onClick=${act.endSession} aria-label="End session"><${Icon} n="x" s=${15} w=${2}/></button>
  </div>`;
}

function TabBar({tab, act}) {
  const T = [['calendar', 'Calendar', 'today'], ['today', 'Home', 'home'], ['catalogue', 'Collection', 'grid'], ['orders', 'Orders', 'orders']];
  return html`<nav class="tabbar">${T.map(([k, l, i]) => html`<button class=${'tab' + (tab === k ? ' on' : '')} onClick=${() => act.tab(k)} aria-current=${tab === k ? 'page' : null}><${Icon} n=${i}/>${l}</button>`)}</nav>`;
}

function makeActs(setS, setUi, onReset) {
  let toastT = 0;
  const a = {
    toast: msg => { setUi(u => ({...u, toast:msg, toastId:Date.now()})); clearTimeout(toastT); toastT = setTimeout(() => setUi(u => ({...u, toast:null})), 2200); },
    openOrder: bid => { const id = 'o-' + bid;
      setS(s => s.orders[id] ? s : {...s, orders:{...s.orders, [id]:newOrder(bid)}, savedAt:Date.now()});
      setUi(u => ({...u, view:id, session:id, div: u.view === id ? u.div : BUYERS[bid].divs[0], sheet:null, capture:false})); },
    back: () => setUi(u => ({...u, view:null, capture:false, sheet:null})),
    tab: t => setUi(u => ({...u, tab:t, view:null})),
    sheet: sh => setUi(u => ({...u, sheet:sh, capture: sh && sh.type === 'picker' ? false : sh && sh.type === 'size' ? false : u.capture})),
    close: () => setUi(u => ({...u, sheet:null})),
    capture: on => setUi(u => ({...u, capture:on, sheet:null})),
    div: d => setUi(u => ({...u, div:d})),
    set: patch => setUi(u => ({...u, ...patch})),
    switchRep: id => { setS(s => ({...s, rep:id})); setUi(u => ({...u, sheet:null, view:null, session:null})); a.toast(`Signed in as ${REPS[id].name}`); },
    startSession: bid => { const id = 'o-' + bid;
      setS(s => s.orders[id] ? s : {...s, orders:{...s.orders, [id]:newOrder(bid)}, savedAt:Date.now()});
      setUi(u => ({...u, session:id, div: BUYERS[bid].divs[0]})); },
    endSession: () => { setUi(u => ({...u, session:null})); a.toast('Session ended'); },
    // appointment record: every change is stored straight away (state persists on each update)
    appt: (bid, patch) => setS(s => ({...s, appts:{...s.appts, [bid]:{...(s.appts[bid] || {}), ...patch}}, savedAt:Date.now()})),
    // checking in again after a check-out keeps the original start time
    checkIn: (bid, x={}) => { a.appt(bid, x.in ? {out:null, back:Date.now()} : {in:Date.now(), out:null});
      a.toast(x.in ? `Checked in again · since ${hhmm(x.in)}` : `Checked in · ${BUYERS[bid].shop}`); },
    checkOut: bid => { a.appt(bid, {out:Date.now()}); setUi(u => u.session === 'o-' + bid ? {...u, session:null} : u); a.toast(`Checked out · ${BUYERS[bid].shop}`); },
    note: (bid, text) => a.appt(bid, {notes:text}),
    // Create order: start that client's session and land in the Collection to add products
    createOrder: bid => { a.startSession(bid); setUi(u => ({...u, tab:'catalogue', view:null, sheet:null, catAvail:null})); a.toast(`Ordering for ${BUYERS[bid].shop}`); },
    // add flow from Collection or a lookbook: start (or switch to) that buyer's session, then enter sizes in place
    addFor: (bid, item) => { a.startSession(bid); a.close(); a.select('o-' + bid, item.pid, item.colour, item.via); },
    newBuyer: (b, item, appt) => { BUYERS[b.id] = b; setS(s => ({...s, buyers:{...s.buyers, [b.id]:b}}));
      if (item) a.addFor(b.id, item); else if (appt) a.sheet({type:'appt', bid:b.id}); else a.openOrder(b.id);
      a.toast(`Session started with ${b.shop}`); },
    mut: (id, fn) => setS(s => { const o = JSON.parse(JSON.stringify(s.orders[id])); fn(o); return {...s, orders:{...s.orders, [id]:o}, savedAt:Date.now()}; }),
    role: (r, id) => setUi(u => ({...u, role:r, buyerOrder:id || u.buyerOrder, sheet:null, capture:false})),
    reset: onReset,
  };
  a.saveDraft = (id, pid, draft, via, by) => a.mut(id, o => applyDraft(o, pid, draft, via, by));
  // selection without quantity: the style-colour joins the order at zero units
  a.select = (id, pid, colour, via) => { const p = P[pid];
    a.mut(id, o => { if (o.lines.some(l => l.pid === pid && l.colour === colour)) return;
      o.lines.push({id:uid(), pid, colour, qty:{}, via, by:'salesperson', at:Date.now()}); log(o, 'salesperson', `Selected ${p.name} · ${cname(colour)}${via === 'photo' ? ' (photo match)' : ''}`); });
    a.toast(`Added ${p.name} · ${BUYERS[id.slice(2)].shop}`); };
  a.unselect = (id, pid, colour, by='salesperson') => { const p = P[pid];
    a.mut(id, o => { o.lines = o.lines.filter(l => !(l.pid === pid && (!colour || l.colour === colour))); log(o, by, `Removed ${p.name}${colour ? ' · ' + cname(colour) : ''}`); });
    setUi(u => u.sheet && (u.sheet.type === 'size' || u.sheet.type === 'product') ? {...u, sheet:null} : u); a.toast(`Removed ${p.name}`); };
  // stepper: a bulk total with no size split; repeated taps update one log entry
  a.setUnits = (id, lineId, n) => a.mut(id, o => { const l = o.lines.find(x => x.id === lineId); if (!l) return; const p = P[l.pid];
    n = Math.max(0, Math.min(999, n)); l.qty = n ? {[bulkKey(p)]: n} : {}; l.at = Date.now();
    const key = 'u:' + lineId, last = o.log[o.log.length - 1], text = `Set ${p.name} · ${cname(l.colour)} to ×${n}`;
    if (last && last.key === key) { last.text = text; last.at = Date.now(); } else o.log.push({at:Date.now(), by:'salesperson', text, key}); });
  a.bulk = (id, n) => a.mut(id, o => { let k = 0; o.lines.forEach(l => { if (!units(l.qty)) { l.qty = {[bulkKey(P[l.pid])]: n}; k++; } }); log(o, 'salesperson', `Set ${n} units each on ${k} styles (sizes to split)`); });
  a.setBudget = (bid, d, c, v) => { const b = BUYERS[bid], cat = JSON.parse(JSON.stringify(b.cat || {}));
    b.divs.forEach(x => { cat[x] = Object.fromEntries(CATS.map(k => [k, cat[x] && cat[x][k] != null ? cat[x][k] : catBudget(b, x, k)])); });
    cat[d][c] = v; b.cat = cat; setS(s => ({...s, budgets:{...s.budgets, [bid]:cat}, savedAt:Date.now()})); };
  a.share = id => a.mut(id, o => { if (o.status === 'draft') { o.status = 'shared'; o.sharedAt = Date.now(); log(o, 'salesperson', `Basket shared with ${BUYERS[o.buyerId].buyer} · closes in 48h`); } });
  a.submit = (id, by) => a.mut(id, o => { o.status = 'submitted'; o.submittedBy = by; o.submittedAt = Date.now(); log(o, by, by === 'client' ? 'Order submitted by the buyer' : 'Order submitted by the salesperson on the buyer’s behalf'); });
  a.confirm = id => a.mut(id, o => { o.status = 'confirmed'; o.confirmedAt = Date.now(); log(o, 'salesperson', 'Reviewed against guidelines and confirmed for production'); });
  return a;
}

function App({onReset}) {
  const [S, setS] = useState(loadState);
  const [ui, setUi] = useState({tab:'calendar', view:null, sheet:null, capture:false, div:'W', role:'sales', toast:null, session:loadSession(), catSeason:'SS27', catAvail:null});
  useEffect(() => { saveState(S); }, [S]);
  useEffect(() => { saveSession(ui.session); }, [ui.session]);
  const act = useMemo(() => makeActs(setS, setUi, onReset), []);
  const order = ui.view && S.orders[ui.view];
  const sh = ui.sheet;
  const sheet = !sh ? null
    : sh.type === 'size' ? html`<${SizeSheet} key=${sh.pid + (sh.actor || '')} sh=${sh} S=${S} act=${act}/>`
    : sh.type === 'picker' ? html`<${PickerSheet} sh=${sh} act=${act}/>`
    : sh.type === 'finish' ? html`<${FinishSheet} sh=${sh} S=${S} act=${act}/>`
    : sh.type === 'export' ? html`<${ExportSheet} sh=${sh} S=${S} act=${act}/>`
    : sh.type === 'history' ? html`<${HistorySheet} sh=${sh} S=${S} act=${act}/>`
    : sh.type === 'look' ? html`<${LookSheet} id=${sh.id} S=${S} ui=${ui} act=${act}/>`
    : sh.type === 'product' ? html`<${ProductSheet} key=${sh.pid} pid=${sh.pid} S=${S} ui=${ui} act=${act}/>`
    : sh.type === 'season' ? html`<${SeasonSheet} ui=${ui} act=${act}/>`
    : sh.type === 'filter' ? html`<${FilterSheet} ui=${ui} act=${act}/>`
    : sh.type === 'account' ? html`<${AccountSheet} S=${S} act=${act}/>`
    : sh.type === 'newbuyer' ? html`<${NewBuyerSheet} S=${S} sh=${sh} act=${act}/>`
    : sh.type === 'pick' ? html`<${PickBuyerSheet} S=${S} sh=${sh} act=${act}/>`
    : sh.type === 'appt' ? html`<${ApptSheet} key=${sh.bid} sh=${sh} S=${S} act=${act}/>`
    : sh.type === 'budget' ? html`<${BudgetSheet} sh=${sh} S=${S} act=${act}/>`
    : sh.type === 'bulk' ? html`<${BulkSheet} sh=${sh} S=${S} act=${act}/>` : null;
  const toast = ui.toast && html`<div class="toast" key=${ui.toastId} role="status"><${Icon} n="check" s=${16} w=${2.4}/>${ui.toast}</div>`;

  if (ui.role === 'buyer' && S.orders[ui.buyerOrder]) return html`<div class="app"><${BuyerView} S=${S} ui=${ui} act=${act}/>${sheet}${toast}</div>`;
  // the client in session stays on top of every tab, in the layout so it never covers products; the tab bar is always there
  const so = activeOrder(S, ui), capDiv = so && (BUYERS[so.buyerId].divs.includes(ui.capDiv) ? ui.capDiv : BUYERS[so.buyerId].divs[0]);
  return html`<div class="app">
    ${order ? html`<${OrderView} S=${S} ui=${ui} act=${act} order=${order}/>` : html`
      <${SessionBar} S=${S} ui=${ui} act=${act}/>
      <div class="screen tabbed">
        ${ui.tab === 'calendar' && html`<${CalendarTab} S=${S} act=${act}/>`}
        ${ui.tab === 'today' && html`<${Today} S=${S} act=${act}/>`}
        ${ui.tab === 'orders' && html`<${OrdersTab} S=${S} act=${act}/>`}
        ${ui.tab === 'catalogue' && html`<${CatalogueTab} key=${so ? so.id : 'none'} S=${S} ui=${ui} act=${act}/>`}
      </div>`}
    <${TabBar} tab=${ui.tab} act=${act}/>
    ${ui.capture && so && html`<${Capture} order=${so} div=${capDiv} act=${act}/>`}
    ${ui.zoom && html`<${Zoom} z=${ui.zoom} act=${act}/>`}
    ${sheet}${toast}
  </div>`;
}

function Shell() {
  const [orient, setOrient] = useState('portrait');
  const [k, setK] = useState(0);
  const reset = () => { clearState(); setK(x => x + 1); };
  return html`<div class="shell">
    <aside class="side">
      <div class="side-brand">Vega</div>
      <p class="side-lede">Showroom order capture for wholesale. A first web mockup of the iOS app: photo match, fast size entry, live guideline checks per cluster, and a record of who submitted each order.</p>
      <div class="lbl">Try this</div>
      <ol class="steps">${GUIDE_STEPS.map(s => html`<li>${s}</li>`)}</ol>
      <div class="side-ctrls"><${Seg} opts=${[['portrait', 'Portrait'], ['landscape', 'Landscape']]} val=${orient} on=${setOrient}/><button class="linkbtn" onClick=${reset}>Reset demo</button></div>
      <p class="fine">Prototype. Photo recognition is simulated against a catalogue built from loewe.com: real styles, colours and photos; wholesale prices are indicative. Orders save in this browser only.</p>
    </aside>
    <div class=${'device ' + orient}>
      <div class="statusbar"><span>9:41</span><span class="sb-r"><i style="height:5px"></i><i style="height:7px"></i><i style="height:9px"></i><i style="height:11px"></i><span class="sb-batt"><span></span></span></span></div>
      <${App} key=${k} onReset=${reset}/>
    </div>
  </div>`;
}

render(html`<${Shell}/>`, document.getElementById('root'));
</script>
</body>
</html>

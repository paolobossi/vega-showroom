<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vega Showroom</title>
<meta name="description" content="Vega: showroom order capture for wholesale. Clickable prototype.">
<meta name="theme-color" content="#EFF0EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1113" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vega">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
/* Layout: one phone-first app (portrait or landscape). On desktop it sits in a device frame beside a short demo guide. */
:root{
  --stage:#E1E2DE; --frame:#17181A;
  --bg:#EFF0EC; --surface:#FFFFFF; --surface-2:#F5F6F2; --studio:#E3E4DF;
  --ink:#141619; --muted:#62666B; --faint:#999DA1; --line:#DCDED8;
  --band:#000000; --band-ink:#FFFFFF; /* client band: black in light and dark mode */
  --accent:#2238A6; --accent-ink:#FFFFFF; --accent-soft:#E3E7F8;
  --good:#1D7448; --good-bg:#E0EFE6; --warn:#946000; --warn-bg:#F7EAD2; --bad:#AE281C; --bad-bg:#F7E1DE;
  --scrim:rgba(10,12,16,.42);
  --vf-bg:#0C0D0F; --vf-ink:#F2F2EF; --vf-dim:rgba(242,242,239,.62);
  --f-display:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-ui:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#050607; --frame:#2A2C30;
  --bg:#0F1113; --surface:#181A1E; --surface-2:#202328; --studio:#43464B;
  --ink:#ECEDEA; --muted:#A0A4A9; --faint:#6E7277; --line:#2C3036;
  --accent:#8C9DFF; --accent-ink:#0F1113; --accent-soft:#222A4C;
  --good:#58C48D; --good-bg:#15291E; --warn:#E5A93E; --warn-bg:#2E2414; --bad:#F27D72; --bad-bg:#331A18;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --stage:#050607; --frame:#2A2C30;
  --bg:#0F1113; --surface:#181A1E; --surface-2:#202328; --studio:#43464B;
  --ink:#ECEDEA; --muted:#A0A4A9; --faint:#6E7277; --line:#2C3036;
  --accent:#8C9DFF; --accent-ink:#0F1113; --accent-soft:#222A4C;
  --good:#58C48D; --good-bg:#15291E; --warn:#E5A93E; --warn-bg:#2E2414; --bad:#F27D72; --bad-bg:#331A18;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-ui);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
/* home-screen app: the status bar is see-through with white icons (fixed by iOS at launch), so the strip behind it is always black like the client band */
html::before{content:"";position:fixed;z-index:100;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--band);pointer-events:none}
@media (min-width:900px){html,body{background:var(--stage)}}
[hidden]{display:none!important}
#root{height:100%}
/* no double-tap zoom anywhere; scrolling and pinch still work */
*,*::before,*::after{touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.code{font-size:12.5px;line-height:1.3;color:var(--muted)}

/* ---------- shell / device ---------- */
.shell{height:100%;display:flex;align-items:center;justify-content:center;gap:48px}
.device{position:relative;height:100%;width:100%;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.statusbar{display:none}
.side{display:none}
@media (min-width:900px){
  .shell{padding:24px}
  .device{height:min(844px,calc(100vh - 48px));width:auto;aspect-ratio:390/844;border-radius:46px;box-shadow:0 0 0 11px var(--frame),0 30px 80px rgba(0,0,0,.28)}
  .device.landscape{height:auto;width:min(844px,calc(100vw - 440px));aspect-ratio:844/390}
  .device.portrait .statusbar{display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 30px 0 34px;font-weight:600;font-size:14px;flex:none;background:var(--bg)}
  .side{display:flex;flex-direction:column;gap:18px;width:300px;flex:none}
}
.sb-r{display:flex;gap:5px;align-items:center}
.sb-r i{display:block;width:4px;border-radius:1px;background:var(--ink)}
.sb-batt{width:24px;height:11px;border:1.5px solid var(--ink);border-radius:3px;padding:1.5px}
.sb-batt span{display:block;height:100%;width:70%;background:var(--ink);border-radius:1px}
.side-brand{font:650 44px/1 var(--f-display);letter-spacing:-.035em}
.side-lede{margin:0;color:var(--muted);line-height:1.5;text-wrap:pretty}
.steps{margin:0;padding:0 0 0 20px;display:flex;flex-direction:column;gap:8px;line-height:1.45}
.steps li::marker{font:600 12px var(--f-ui);color:var(--muted)}
.side-ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fine{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.linkbtn{color:var(--accent);font-weight:600;font-size:14px;padding:6px 2px}

/* ---------- app frame ---------- */
.app{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;container-type:size;container-name:app;background:var(--bg)}
.screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
/* floating pill tab bar; content scrolls underneath */
.screen.tabbed{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.screen.tabbed.with-pill{padding-bottom:calc(134px + env(safe-area-inset-bottom,0px))}
/* the client pill and the tab bar float together at the bottom; the pill takes the tab bar's width */
.dock{position:absolute;z-index:20;left:50%;transform:translateX(-50%);bottom:max(14px,calc(env(safe-area-inset-bottom,0px) - 6px));display:flex;flex-direction:column;gap:8px}
.tabbar{display:flex;gap:2px;padding:5px;border-radius:999px;
  background:color-mix(in srgb,var(--surface) 78%,transparent);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:0 10px 30px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.08)}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:600;color:var(--muted);min-width:74px;padding:7px 10px 6px;border-radius:999px;transition:background .2s,color .2s}
.tab.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
/* client in session: a thin black pill 8px above the tab bar, on every tab; tapping it opens the order */
.sbar{display:flex;border-radius:999px;background:var(--band);color:var(--band-ink);border:1px solid rgba(255,255,255,.1);box-shadow:0 6px 18px rgba(0,0,0,.16);animation:rise .3s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.sbar-main{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;color:inherit;min-height:28px;padding:0 14px}
.sbar-dot{position:relative;flex:none;width:6px;height:6px;border-radius:50%;background:#3CCB7F}
.sbar-dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:#3CCB7F;animation:beat 1.8s ease-out infinite}
@keyframes beat{from{transform:scale(1);opacity:.7}to{transform:scale(3.2);opacity:0}}
.sbar-t{flex:0 1 auto;min-width:0;display:flex;align-items:baseline;gap:6px;line-height:1.2}
.sbar-t b,.sbar-t span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar-t b{font-size:12.5px;font-weight:600}
.sbar-t span{font-size:12.5px;font-weight:400;opacity:.65}
.top{padding:14px 18px 6px}
.maison{font:600 11.5px var(--f-display);letter-spacing:.28em;text-transform:uppercase}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.h1{font:650 32px/1.1 var(--f-display);margin:4px 0 0;letter-spacing:-.03em}
.sec{padding:16px 18px 6px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-head h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:20px;color:var(--ink)}
.avatar{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:650 13px var(--f-ui);letter-spacing:.02em}
.avatar.sm{width:34px;height:34px;font-size:12px}
.round-btn{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--ink);margin-top:6px}
.top-bar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.top-bar.mid{align-items:center;padding-top:18px}
.h1-btn{font:inherit;letter-spacing:inherit;color:inherit;text-align:left}
.h1-btn:active{opacity:.5}
.fpage{position:absolute;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;animation:fade .2s ease}
.fpage-head{flex:none;display:flex;justify-content:space-between;align-items:center;padding:8px 8px 0}
.fpage-body{flex:1;min-height:0;overflow-y:auto;width:100%;max-width:640px;margin:0 auto;padding:4px 20px max(24px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.fpage-body > *{flex-shrink:0}
.fpage-body > .pin{margin:auto 0}
.fpage-body:has(+ .fpage-foot){padding-bottom:18px}
.fpage-foot{width:100%}
.pd-head{display:flex;flex-direction:column;gap:4px;margin-top:-4px}
.pd-name{margin:0;font:650 26px/1.15 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.pd-sub{font-size:14px;color:var(--muted)}
.pd-sub .code{color:var(--ink);font-weight:600}
.pin{display:flex;flex-direction:column;align-items:center;gap:14px;padding:4px 0 6px}
.pin-t{font-size:16px;font-weight:600}
.pin-dots{display:flex;gap:16px;margin:2px 0 6px}
.pin-dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink);transition:background .12s}
.pin-dots i.on{background:var(--ink)}
.pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 26px}
.pin-k{width:72px;height:72px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:28px;font-weight:500;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.pin-k:active:not(:disabled){background:var(--surface-2)}
.pin-k.txt{background:none;border:0;font-size:15px;font-weight:600;color:var(--accent)}
.top-acts{display:flex;align-items:center;gap:10px}.top-acts .round-btn{margin-top:0}
.field{display:flex;flex-direction:column;gap:6px}
.inp.area{height:auto;min-height:104px;padding:12px 14px;line-height:1.45;resize:vertical}
.days{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin:0 -18px;padding:0 18px;scroll-padding:0 18px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 66px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.day b{font-size:19px;font-weight:650;line-height:1.15}
.day span{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day.on{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.day.on span{color:inherit;opacity:.8}
.inp{height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;font:16px var(--f-ui);color:var(--ink);outline:0;width:100%}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.icon-btn:active{background:var(--surface-2)}

/* ---------- chips, pills ---------- */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.s-none{background:var(--surface-2);color:var(--muted)}
.s-draft{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.s-shared{background:var(--warn-bg);color:var(--warn)}
.s-submitted,.s-partial{background:var(--accent-soft);color:var(--accent)}
.s-confirmed{background:var(--good);color:var(--surface)}
.s-in{background:var(--good-bg);color:var(--good)}
.s-out{background:var(--surface-2);color:var(--muted)}
.live-dot{position:relative;width:7px;height:7px;border-radius:50%;background:currentColor}
.live-dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;animation:beat 1.8s ease-out infinite}
.by{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.by.client{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.ai{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{padding:6px 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg.full{display:flex}.seg.full button{flex:1}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:650;font-size:15.5px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.secondary{background:var(--surface-2);border:1px solid var(--line)}
.btn.go{background:var(--good);color:var(--surface)}
.btn.ghost{color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn:active:not(:disabled){transform:scale(.985)}

/* ---------- product art ---------- */
.thumb{flex:none;display:grid;place-items:center;background:var(--studio);border-radius:12px;overflow:hidden;width:56px;height:56px}
.thumb.sm{width:44px;height:44px;border-radius:10px}
.thumb.lg{width:96px;height:96px;border-radius:16px}
.thumb img,.ph{width:100%;height:100%;object-fit:cover;display:block}
.ph{background:#EDEDED}
.cc{display:inline-flex;align-items:center;gap:5px;min-width:0}
.cc .code{font-weight:600;color:var(--ink);opacity:.7}
.pc-code{font-size:12.5px;font-weight:650;letter-spacing:.02em;color:var(--ink)}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.prices span{display:flex;flex-direction:column;min-width:0}
.prices small{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.prices b{font-size:14px;font-weight:650;color:var(--ink)}
.prices.lg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.prices.lg b{font-size:19px}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.stp button{width:38px;height:36px;display:grid;place-items:center;color:var(--ink)}
.stp button:active{background:var(--surface-2)}
.stp span{min-width:30px;text-align:center;font-weight:650;font-size:15px}
.st-ok{color:var(--good)}.st-warn{color:var(--warn)}.st-bad{color:var(--bad)}.st-none{color:var(--muted)}
.flag-txt{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--good)}
.flag-dot{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--good);color:#fff}
/* carousel: portrait shots, swipe or tap to enlarge */
.car{position:relative;display:flex;flex-direction:column;gap:8px}
.car-exp{position:absolute;z-index:2;top:10px;right:10px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.88);color:#141619;box-shadow:0 1px 4px rgba(0,0,0,.12);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.car-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:18px;background:#F0F0F0}
.car-track::-webkit-scrollbar{display:none}
.car-slide{position:relative;flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/5;max-height:52cqh;background:#F0F0F0}
.car-slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.car.cover .car-slide img{object-fit:cover;object-position:50% 30%}
.car-dots{display:flex;justify-content:center;gap:6px}
.car-dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .2s,width .2s}
.car-dots i.on{background:var(--ink);width:16px;border-radius:3px}
.zoom{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;animation:fade .2s ease}
.zoom-top{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 8px 8px 18px}
.zoom-t{font:650 18px/1.2 var(--f-display);letter-spacing:-.015em}
.zoom .car{flex:1;min-height:0;padding-bottom:6px}
.zoom .car-track{flex:1;min-height:0;border-radius:0}
.zoom .car-slide{aspect-ratio:auto;max-height:none;height:100%}
.zoom-foot{flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 18px max(14px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}

/* ---------- today ---------- */
.look{scroll-snap-align:start;flex:none;width:236px;text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 8px 12px}
.look-tile{position:relative;border-radius:12px;overflow:hidden;background:var(--studio)}
/* the runway front shot, cropped to the model */
.look-tile{aspect-ratio:4/5}
.look-tile img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.look-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.look-t{font:600 17px/1.2 var(--f-display);letter-spacing:-.01em}
.look-vm{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.look-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.look-list .look{width:auto}
.appts{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.appt{display:flex;gap:14px;align-items:stretch;text-align:left;width:100%;padding:14px;border-top:1px solid var(--line)}
.appt:first-child{border-top:0}
.appts.now{border:1.5px solid var(--good)}
.appt-time{font:600 13px var(--f-ui);font-variant-numeric:tabular-nums;color:var(--muted);padding-top:3px;width:42px;flex:none}
.appt-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.appt-shop{font:600 18px/1.2 var(--f-display);letter-spacing:-.015em}
.appt-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.appt-buyer{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--ink);margin-top:-3px}
.appt-buyer svg{flex:none;color:var(--muted)}
.appt-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.appt-head .pill{flex:none;margin-top:1px}
.appt-cats{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt-lbl{margin-top:14px}
.appt-cats b{color:var(--ink);font-weight:600;margin-right:4px}
.kv{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.live{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.tile b{display:block;font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.foot{padding:18px;font-size:12px;color:var(--faint);text-align:center}
.today-grid{display:flex;flex-direction:column;padding-bottom:12px}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;text-align:left;width:100%;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-title{font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;text-align:right}
.row-val{font-weight:650;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);flex:none}
.szs{display:flex;gap:4px;flex-wrap:wrap}
.sz-chip{font:500 11.5px var(--f-ui);font-variant-numeric:tabular-nums;padding:1px 5px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.lock{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:650;color:var(--warn)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px;color:var(--muted)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;height:100%;color:var(--ink)}
.searchrow{display:flex;gap:8px}.searchrow .search{flex:1;min-width:0}
.sq-btn{position:relative;flex:none;width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;color:var(--ink)}
.sq-btn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.fchip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 8px 5px 12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.fchip svg{color:var(--muted)}
.opt .row-side{color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* collection: category rail on the left, products grouped by category and family */
/* category tabs stick under the top while the grid scrolls; sub-categories of the current one sit beneath */
.cat-nav{position:sticky;top:0;z-index:5;margin:0 -18px;padding:6px 0 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid var(--line)}
.cn-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 18px;scroll-padding:0 18px}
.cn-row::-webkit-scrollbar{display:none}
.cn-cat{flex:none;position:relative;display:flex;align-items:baseline;gap:5px;font-size:15px;font-weight:650;color:var(--muted);padding:9px 6px 10px;margin-right:8px;white-space:nowrap}
.cn-cat span{font-size:12px;font-weight:600;opacity:.75}
.cn-cat::after{content:"";position:absolute;left:6px;right:6px;bottom:2px;height:2.5px;border-radius:2px;background:var(--ink);transform:scaleX(0);transition:transform .25s ease}
.cn-cat.on{color:var(--ink)}.cn-cat.on::after{transform:scaleX(1)}
/* Women / Men as the page title: the current one in ink, the other faded beside it */
.div-title{display:flex;gap:16px}
.div-title button{font:inherit;letter-spacing:inherit;color:var(--faint);transition:color .2s}
.div-title button.on{color:var(--ink)}
/* family headings run across the grid */
.fam-h{grid-column:1 / -1;display:flex;align-items:baseline;gap:6px;margin:10px 2px 0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fam-h:first-child{margin-top:0}
/* filter chips (Orders) */
.ftabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.ftabs::-webkit-scrollbar{display:none}
.ftab{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;transition:background .2s,color .2s}
.ftab span{font-weight:500;opacity:.6}
.ftab.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.cat-main{display:flex;flex-direction:column;gap:24px;min-width:0;padding-top:4px}
.cat-sec{display:flex;flex-direction:column;gap:8px}
.cat-h{margin:0;display:flex;align-items:baseline;gap:8px;font:650 20px/1.2 var(--f-display);letter-spacing:-.02em}
.cat-h span{font-size:13px;font-weight:600;color:var(--muted)}
.pc-fam{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pcard.has{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.pc-photo{position:relative}
.pc-img{display:block;width:100%}
.pc-photo .thumb{width:100%;height:auto;aspect-ratio:1;border-radius:10px}
.pcard.locked .pc-img{opacity:.5}
.pc-btn{position:absolute;right:5px;bottom:5px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.pc-btn.x{top:5px;bottom:auto;width:30px;height:30px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.pc-flag,.pc-lock{position:absolute;left:5px;top:5px;display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:3px 7px 3px 5px;border-radius:99px;max-width:calc(100% - 44px);white-space:nowrap;overflow:hidden}
.pc-flag{background:var(--good);color:#fff}
.pc-lock{background:var(--surface);color:var(--warn);border:1px solid var(--line)}
.pc-info{display:flex;flex-direction:column;gap:4px;text-align:left;padding:0 1px 4px;min-width:0}
.pname{font-weight:620;font-size:13.5px;line-height:1.25}
.pcard .prices{grid-template-columns:1fr;gap:1px}
.pcard .prices span{flex-direction:row;justify-content:space-between;align-items:baseline;gap:4px}
.pcard .prices small{text-transform:none;letter-spacing:0;font-size:10.5px}
.pcard .prices b{font-size:13px}
.dots{display:flex;gap:4px}
.dots .sw{width:10px;height:10px}

/* ---------- order view ---------- */
.ov{display:flex;flex-direction:column;height:100%;min-height:0}
.ov-nav{flex:none;display:flex;align-items:center;gap:4px;padding:4px 8px 0;min-height:48px}
.ov-nav-t{flex:1;min-width:0;text-align:center}
.ov-shop{font:600 17px/1.2 var(--f-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-id{font-size:12px;color:var(--muted)}
.saved{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;color:var(--good);font-weight:600;animation:pulse .6s ease}
@keyframes pulse{from{opacity:.2}to{opacity:1}}
.ov-sub{flex:none;display:flex;flex-direction:column;gap:10px;padding:6px 16px 10px;border-bottom:1px solid var(--line)}
.ov-buyer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px}
.ov-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.ov-actions{position:absolute;z-index:19;left:50%;transform:translateX(-50%);bottom:calc(max(14px,calc(env(safe-area-inset-bottom,0px) - 6px)) + 70px);width:min(calc(100% - 28px),420px);display:flex;gap:10px}
.ov-actions .cap-btn{box-shadow:0 8px 24px rgba(0,0,0,.18)}
.ov-actions .round{background:var(--surface);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.sel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 4px;padding:12px 8px 12px 14px;border-top:1px solid var(--line)}
.sel:first-child{border-top:0}
.sel-info{display:flex;gap:12px;align-items:center;text-align:left;min-width:0}
.sel-x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);align-self:start}
.sel-ctl{grid-column:1 / -1;display:flex;align-items:center;gap:10px;padding-left:68px;padding-right:6px;flex-wrap:wrap}
.sel-sz{font-size:13px;font-weight:650;color:var(--accent);padding:6px 2px}
.sel-val{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.sel-val small{font-size:11.5px;color:var(--muted)}
.sel-meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.sel-meta small{font-size:10px;font-weight:700}
.sel.open .sel-val small{color:var(--warn);font-weight:650}
/* Women / Men on the order: underlined tabs; the budget summary below opens Budgets & KPIs */
.ov-divs{display:flex;gap:6px;margin:0 -6px -10px}
.ov-sum{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px 12px}
.ov-sum .bar{margin-top:8px}
.ov-sum-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.ov-sum-top .num{white-space:nowrap}
.ov-sum-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:13px;font-weight:600;white-space:nowrap}
.ov-sum-foot > span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ov-sum-go{flex:none;display:inline-flex;align-items:center;gap:2px;color:var(--accent)}
.ov-sum-go svg{transform:rotate(-90deg)}
.ov-lines{padding:6px 16px 20px;display:flex;flex-direction:column;gap:14px}
.lines-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px}
.grp-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:0 2px 6px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.ov-bar{flex:none;display:flex;gap:10px;align-items:center;padding:10px 14px max(12px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.cap-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:27px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;white-space:nowrap;min-width:0}
.round{width:54px;height:54px;border-radius:27px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);flex:none}

/* ---------- KPI ---------- */
.kpi{display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.kpi-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi-label.row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi-label .chip{text-transform:none;letter-spacing:0}
.kpi-big{margin-top:4px;font-size:15px}
.kpi-big .num{font-size:28px;font-weight:650;letter-spacing:-.01em}
.bar{position:relative;height:8px;border-radius:4px;background:var(--surface-2);margin-top:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--accent);transition:width .35s ease}
.bar-fill.warn{background:var(--warn)}.bar-fill.bad{background:var(--bad)}
.kpi-meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:6px}
.bud-div{display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid var(--line)}
.bud-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:650;font-size:15px;padding-bottom:4px}
.bud-head .num{font-weight:500;font-size:14px}.bud-head .num b{font-weight:700}
.bud-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px 10px;align-items:baseline;font-size:14px;padding:6px 0}
.bud-row b{min-width:42px;text-align:right}
.bud-row .mix-track{grid-column:1 / -1;margin-top:4px}
.kpi > .bud-div:first-child{border-top:0;padding-top:0}
.bud-total{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.sign{position:relative}
.sign-pad{display:block;width:100%;height:170px;border-radius:14px;border:1.5px dashed var(--line);background:var(--surface);color:var(--ink);touch-action:none;cursor:crosshair}
.sign-hint{position:absolute;left:14px;bottom:10px;font-size:12px;color:var(--faint);pointer-events:none}
.sign-clear{position:absolute;right:12px;top:8px}
.bud-row.off{color:var(--faint);grid-template-columns:1fr auto;font-size:13.5px}
.inp-eur{position:relative}.inp-eur span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.inp-eur .inp{padding-left:28px;text-align:right;font-variant-numeric:tabular-nums}
.mix-track{position:relative;height:6px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.mix-fill{height:100%;border-radius:3px;background:var(--faint);transition:width .35s ease}
.mix-fill.ok{background:var(--good)}.mix-fill.warn{background:var(--warn)}.mix-fill.bad{background:var(--bad)}
.kpi-foot{font-size:12px;color:var(--faint);line-height:1.45}

/* ---------- sheets ---------- */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:40;animation:fade .2s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:88%;z-index:41;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet.tall{height:88%}
.sheet-grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:8px 10px 6px 18px;flex:none}
.sheet-title{font:650 21px/1.2 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.sheet-sub{font-size:13px;color:var(--muted);margin-top:3px}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:14px}
.sheet-body > *, .match > *, .ov-lines > *{flex-shrink:0}
.sheet-foot{flex:none;display:flex;gap:10px;padding:10px 18px max(14px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.sheet-foot .btn{flex:1}
.sheet-body:last-child{padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
/* media sheet: photos run edge to edge under the rounded top, close floats on the top left */
.sheet.media{overflow:hidden}
.sheet.media .sheet-grab{position:absolute;z-index:3;top:0;left:0;right:0;background:rgba(20,22,25,.22)}
.sheet.media .sheet-body{padding-top:0}
.sheet.media .car{margin:0 -18px}
.sheet.media .car-track{border-radius:0}
.sheet-x{position:absolute;z-index:3;top:12px;left:12px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.88);color:#141619;box-shadow:0 1px 4px rgba(0,0,0,.12);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sheet.media .car-exp{top:12px;right:12px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.callout{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.4;padding:10px 12px;border-radius:12px}
.callout.warn{background:var(--warn-bg);color:var(--warn)}
.callout.bad{background:var(--bad-bg);color:var(--bad)}
.callout.info{background:var(--accent-soft);color:var(--accent)}
.callout.good{background:var(--good-bg);color:var(--good)}
.callout svg{flex:none;margin-top:1px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}

/* size sheet */
.ss-top{display:flex;gap:14px;align-items:center}
.ss-info{display:flex;flex-direction:column;gap:6px;min-width:0}
.ss-total{font-size:15px}.ss-total b{font-size:20px;font-variant-numeric:tabular-nums}
.colours{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:0 18px 2px;scrollbar-width:none}
.colour{display:flex;align-items:center;gap:7px;padding:0 12px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap;flex:none}
.colour .sw{width:16px;height:16px}
.colour.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cnt{font-size:11.5px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:1px 6px}
.sizes{display:flex;gap:6px;overflow-x:auto;margin:0 -18px;padding:0 18px 2px;scrollbar-width:none}
.size-cell{flex:1 0 54px;display:flex;flex-direction:column;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.size-cell.has{border-color:var(--accent)}
.sz{font:600 13px var(--f-ui);font-variant-numeric:tabular-nums;text-align:center;padding:7px 0 3px;color:var(--muted)}
.size-cell.has .sz{color:var(--accent)}
.step{height:42px;font-size:22px;font-weight:500;display:grid;place-items:center;color:var(--ink)}
.step:active{background:var(--surface-2)}
.qty{text-align:center;font-size:24px;font-weight:650;padding:2px 0}
.size-cell .step:first-of-type{border-bottom:1px solid var(--line)}
.size-cell .step:last-of-type{border-top:1px solid var(--line)}
.single{display:flex;align-items:center;justify-content:center;gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.step.lg{width:64px;height:64px;border-radius:32px;font-size:30px;background:var(--surface-2)}
.qty.xl{font-size:44px;min-width:70px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.qbtn{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.qbtn:active{background:var(--surface-2)}
.impact{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.impact-row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.sugs{display:flex;gap:10px;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}
.sug{flex:none;width:118px;text-align:left;display:flex;flex-direction:column;gap:5px}
.sug .thumb{width:118px;height:118px}
.sug-n{font-size:13px;font-weight:600;line-height:1.25}
.pre{font:12px/1.5 var(--f-ui);font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;white-space:pre;max-height:340px;color:var(--ink);margin:0}
.log{display:flex;flex-direction:column}
.log-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.log-row:first-child{border-top:0}
.log-t{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);padding-top:2px}
.log-who{margin-top:3px}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px}
.linkbox code{flex:1;min-width:0;font:13px var(--f-ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:all}
.linkbox .btn{min-height:38px;padding:0 14px;font-size:14px}
.issue{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.issue:first-of-type{border-top:0}

/* ---------- capture ---------- */
.capture{position:absolute;inset:0;z-index:30;background:var(--vf-bg);color:var(--vf-ink);display:flex;flex-direction:column;animation:fade .2s ease}
.vf-top{position:absolute;z-index:3;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:8px 10px 28px;background:linear-gradient(rgba(0,0,0,.5),transparent)}
.vf-btn{width:42px;height:42px;border-radius:21px;display:grid;place-items:center;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--vf-ink)}
.vf-title{font-size:14px;font-weight:600;color:var(--vf-ink);text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.5)}
/* live viewfinder: the shelf photo fills the screen like the iPhone camera (cover); brackets stay locked on the sample */
.vf-scene{position:absolute;inset:0;overflow:hidden;background:#000}
.vf-stage{position:absolute;left:50%;top:50%;width:max(100cqw,calc(100cqh * 941 / 1672));height:max(100cqh,calc(100cqw * 1672 / 941));transform:translate(-50%,-50%)}
.vf-stage img{width:100%;height:100%;display:block;animation:hand 5s ease-in-out infinite;transition:filter .3s}
.vf-stage.s-scan img,.vf-stage.s-match img{animation:none}
.vf-stage.s-match img{filter:brightness(.5)}
@keyframes hand{0%,100%{transform:scale(1.03) translate(0,0)}35%{transform:scale(1.03) translate(-.5%,.35%) rotate(.25deg)}70%{transform:scale(1.03) translate(.4%,-.25%) rotate(-.2deg)}}
.brackets{position:absolute;left:18%;right:19%;top:25%;bottom:39%}
.brackets i{position:absolute;width:30px;height:30px;border:3px solid var(--vf-ink);opacity:.9;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.brackets i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.brackets i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.brackets i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 10px}
.brackets i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.scanline{position:absolute;left:4%;right:4%;height:2px;background:#9fb0ff;box-shadow:0 0 18px 4px rgba(140,157,255,.6);animation:scan 1.1s ease-in-out infinite alternate}
@keyframes scan{from{top:2%}to{top:98%}}
.flash{position:absolute;inset:0;z-index:4;background:#fff;pointer-events:none;animation:flash .4s ease-out forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.vf-status,.vf-hint{position:absolute;z-index:3;left:0;right:0;bottom:calc(128px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;color:var(--vf-ink)}
.vf-status span,.vf-hint span{background:rgba(0,0,0,.55);padding:6px 12px;border-radius:99px}
.vf-bottom{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:40px 0 max(20px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.shutter-row{display:flex;justify-content:center;padding-top:4px}
.shutter{width:72px;height:72px;border-radius:36px;border:4px solid var(--vf-ink);display:grid;place-items:center}
.shutter span{width:56px;height:56px;border-radius:28px;background:var(--vf-ink);transition:transform .15s}
.shutter:active span{transform:scale(.9)}
.match{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:86%;overflow-y:auto;z-index:5;background:var(--bg);color:var(--ink);border-radius:22px 22px 0 0;padding:16px 18px max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .26s cubic-bezier(.2,.8,.2,1)}
.match-main{display:flex;gap:14px;align-items:center}
.m-name{font:650 21px/1.2 var(--f-display);letter-spacing:-.02em}
.alts{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}

/* ---------- buyer view ---------- */
.bv-head{flex:none;padding:12px 18px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.demo-bar{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 12px 6px 16px;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600}
.demo-bar button{color:var(--bg);text-decoration:underline;font-weight:700;padding:6px 4px}
.toast{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;animation:up .2s ease;display:flex;gap:6px;align-items:center}
.app.with-pill .toast{bottom:calc(130px + env(safe-area-inset-bottom,0px))}

/* ---------- landscape: horizontal working layout ---------- */
@container app (orientation: landscape){
  .ov-nav{min-height:40px;padding-top:2px}
  .ov-sub{flex-direction:row;align-items:center;gap:12px;padding:2px 16px 6px}
  .ov-bar{padding:6px 14px max(6px,env(safe-area-inset-bottom,0px))}
  .cap-btn,.round{height:42px}
  .round{width:42px}
  .dock{bottom:max(8px,calc(env(safe-area-inset-bottom,0px) - 8px))}
  .tabbar{padding:4px}
  .tab{flex-direction:row;gap:6px;font-size:12.5px;padding:6px 16px}
  .screen.tabbed{padding-bottom:64px}
  .screen.tabbed.with-pill{padding-bottom:96px}
  .sbar-main{min-height:24px}
  .ov-body{padding-bottom:116px}
  .ov-actions{bottom:calc(max(8px,calc(env(safe-area-inset-bottom,0px) - 8px)) + 54px)}
}
@container app (orientation: landscape) and (min-width: 600px){
  .ov-sub{flex-direction:row;align-items:center;justify-content:space-between;padding:4px 16px 8px}
  .today-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
  .h1{font-size:28px}
  .pgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .vf-stage{transform:translate(-50%,-42%)}
  .sheet,.match{max-height:94%}
  .sheet.tall{height:94%}
  .toast{bottom:80px}
}
@container app (min-width: 700px) and (orientation: portrait){
  .pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

// Spend against budget per division and per category; percentages are on each category's own budget
function kpi(order, div) {
  const b = BUYERS[order.buyerId];
  const byCat = {bags:0, rtw:0, shoes:0, acc:0};
  let total = 0, u = 0, open = 0;
  order.lines.forEach(l => { const p = P[l.pid]; if (p.div !== div) return; const v = lineValue(l); byCat[p.cat] += v; total += v; u += units(l.qty); if (!units(l.qty)) open++; });
  const budget = divBudget(b, div);
  const mix = CATS.map(c => { const bud = catBudget(b, div, c), v = byCat[c];
    return {cat:c, value:v, budget:bud, used: bud ? v / bud * 100 : 0, st: usedSt(v, bud)}; });
  const used = budget ? total / budget * 100 : 0;
  const mine = order.lines.filter(l => P[l.pid].div === div);
  const valueOf = has => mine.filter(l => has(P[l.pid])).reduce((a, l) => a + lineValue(l), 0);
  const rules = (RULES[div] || []).map(r => { const v = valueOf(r.has), share = total ? v / total * 100 : 0;
    return {...r, value:v, share, limit: total * (r.max != null ? r.max : r.min) / 100, st: !total ? 'none' : r.max != null ? (share > r.max ? 'bad' : 'ok') : (share < r.min ? 'warn' : 'ok')}; });
  // required looks the client can buy: done when every piece is in the order with a quantity
  const looks = LOOKS.filter(l => l.div === div && l.req && l.items.every(([pid]) => available(b, P[pid]))).map(l => {
    const have = l.items.filter(([pid, c]) => mine.some(x => x.pid === pid && x.colour === c && units(x.qty))).length;
    return {l, have, n:l.items.length, done: have === l.items.length}; });
  const drops = Object.keys(DROPS).map(k => { const ls = mine.filter(l => P[l.pid].drop === k);
    return {k, units: ls.reduce((a, l) => a + units(l.qty), 0), value: ls.reduce((a, l) => a + lineValue(l), 0)}; });
  return {total, units:u, open, budget, used, bst: usedSt(total, budget) === 'none' ? 'ok' : usedSt(total, budget), mix, rules, looks, drops};
}

function applyDraft(o, pid, draft, via, by) {
  const p = P[pid], now = Date.now();
  const idx = o.lines.findIndex(l => l.pid === pid);
  const old = o.lines.filter(l => l.pid === pid);
  const rest = o.lines.filter(l => l.pid !== pid);
  const fresh = [], msgs = [];
  for (const c of p.colours) {
    const q = {}; Object.entries(draft[c] || {}).forEach(([s, n]) => { if (n > 0) q[s] = n; });
    const prev = old.find(l => l.colour === c), u = units(q), pu = prev ? units(prev.qty) : 0;
    if (!prev && !u) continue;
    // a colour already in the order stays selected at zero; only Remove takes it out
    const same = prev && qkey(prev.qty) === qkey(q);
    fresh.push(same ? prev : prev ? {...prev, qty:q, at:now} : {id:uid(), pid, colour:c, qty:q, via, by, at:now});
    if (!prev) msgs.push(`Added ${p.name} · ${cname(c)} ×${u}${via === 'photo' ? ' (photo match)' : via === 'suggestion' ? ' (suggestion)' : ''}`);
    else if (!same) msgs.push(u ? `Changed ${p.name} · ${cname(c)} ×${pu} → ×${u}` : `Cleared quantities for ${p.name} · ${cname(c)}`);
  }
  const at = idx < 0 ? rest.length : o.lines.slice(0, idx).filter(l => l.pid !== pid).length;
  rest.splice(at, 0, ...fresh);
  o.lines = rest;
  msgs.forEach(m => log(o, by, m));
  return msgs.length;
}

// During a visit only the ongoing client's order shows; with no one ongoing, every order with filter chips
const SENT = ['submitted', 'partial', 'confirmed'];
function OrdersTab({S, ui, act}) {
  const so = activeOrder(S, ui), [f, setF] = useState('all');
  const all = Object.values(S.orders).filter(o => BUYERS[o.buyerId].rep === S.rep || (so && o.id === so.id)).map(o => { const b = BUYERS[o.buyerId];
    return {id:o.id, buyerId:o.buyerId, shop:b.shop, city:b.city, status:o.status,
      value:b.divs.reduce((a, d) => a + kpi(o, d).total, 0), units:b.divs.reduce((a, d) => a + kpi(o, d).units, 0),
      hoursLeft:o.status === 'shared' ? Math.max(0, 48 - Math.floor((Date.now() - o.sharedAt) / 36e5)) : null}; });
  const sent = all.filter(r => SENT.includes(r.status)).length;
  const F = [['all', 'All', () => true], ['draft', 'Draft', r => !SENT.includes(r.status)], ['sent', 'Sent', r => SENT.includes(r.status)]];

const matches = (p, ql) => !ql || (p.name + ' ' + p.code + ' ' + p.family + ' ' + CAT_LABEL[p.cat]).toLowerCase().includes(ql);
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-');
const SUBTYPE = {rtw:p => p.family, acc:p => p.family === 'Puzzle' ? 'Small leather goods' : p.family};

function ProductList({div, q, b, season, onPick}) {
  const ql = q.trim().toLowerCase();

  if (!items.length) return html`<div class="empty">${ql ? `No styles match “${q}”. Try a style name or code.` : `No ${DIV_LABEL[div].toLowerCase()} styles in this collection.`}</div>`;

// Three levels, two controls: Women / Men is the page title, categories are one sticky row, and families are headings in the grid
function CatalogueTab({S, ui, act}) {
  const so = activeOrder(S, ui), sb = so && BUYERS[so.buyerId], divs = sb ? sb.divs : ['W', 'M'];
  const [q, setQ] = useState(''), [div, setDiv] = useState(divs[0]), [cur, setCur] = useState(null);
  const season = SEASONS.find(x => x.id === ui.catSeason);
  const ql = q.trim().toLowerCase();
  const items = PRODUCTS.filter(p => p.div === div && p.season === season.id && (!sb || available(sb, p)) && (!ui.catDrop || p.drop === ui.catDrop) && matches(p, ql));
  // category, then a sub-heading only where the family is a kind of product (Dresses, Hats); bags and shoes families are lines (Puzzle, Pebble), so they just sit together
  const groups = CATS.map(c => { const ps = items.filter(p => p.cat === c), sub = SUBTYPE[c];
    return {cat:c, n:ps.length, fams:sub ? [...new Set(ps.map(sub))].map(f => ({f, id:c + '-' + slug(f), ps:ps.filter(p => sub(p) === f)}))
      : [...new Set(ps.map(p => p.family))].map(f => ({f:null, id:c + '-' + slug(f), ps:ps.filter(p => p.family === f)}))}; }).filter(g => g.n);
  const ref = useRef(null), nav = useRef(null), hold = useRef(0);
  const navBottom = () => nav.current ? nav.current.getBoundingClientRect().bottom : 0;
  // scroll-spy: the last category heading that has passed under the sticky tabs is the current one
  useEffect(() => { const sc = ref.current && ref.current.closest('.screen'); if (!sc) return;
    const spy = () => { if (Date.now() < hold.current) return; const top = navBottom() + 12; let id = null;
      ref.current.querySelectorAll('[data-spy]').forEach(el => { if (el.getBoundingClientRect().top <= top) id = el.dataset.spy; }); setCur(id); };
    spy(); sc.addEventListener('scroll', spy, {passive:true}); return () => sc.removeEventListener('scroll', spy); }, [div, ql, season.id, ui.catDrop, groups.length]);
  // tap: glide to the target just below the tabs; the spy waits so the tabs don't flicker on the way
  const go = id => { const el = document.getElementById('c-' + id), sc = ref.current && ref.current.closest('.screen'); if (!el || !sc) return;
    hold.current = Date.now() + 700; setCur(id);
    // aim for where the tabs end once they are stuck to the top, not where they sit before the page scrolls
    const stuck = sc.getBoundingClientRect().top + nav.current.offsetHeight;
    sc.scrollTo({top: sc.scrollTop + el.getBoundingClientRect().top - stuck - 10, behavior:'smooth'}); };
  const curCat = groups.some(g => g.cat === cur) ? cur : groups[0] && groups[0].cat;
  // keep the active tab in view inside its scrolling row
  useEffect(() => { if (!nav.current) return; nav.current.querySelectorAll('.cn-cat.on').forEach(el => { const row = el.parentElement;
    row.scrollLeft = el.offsetLeft - row.clientWidth / 2 + el.offsetWidth / 2; }); }, [curCat]); // instant: a second smooth scroll would cancel the vertical glide in Chrome
  const pickDiv = d => { setDiv(d); setCur(null); const sc = ref.current && ref.current.closest('.screen'); if (sc) sc.scrollTop = 0; };
  return html`
    <header class="top top-bar mid"><h1 class="h1 div-title" role="tablist" aria-label="Collection">${divs.map(d => html`<button role="tab" aria-selected=${d === div} class=${d === div ? 'on' : ''} onClick=${() => pickDiv(d)}>${DIV_TAB[d]}</button>`)}</h1></header>
    <section class="sec">
      <div class="searchrow">
        <label class="search"><${Icon} n="search" s=${18}/><input id="cat-q" placeholder="Search" aria-label="Search style, code or family" value=${q} onInput=${e => setQ(e.target.value)}/></label>
        ${so && html`<button class="sq-btn" onClick=${() => { act.set({capDiv:div}); act.capture(true); }} aria-label="Photograph a sample"><${Icon} n="cam" s=${20} w=${2}/></button>`}
        <button class=${'sq-btn' + (ui.catDrop || season.id !== SEASONS[0].id ? ' on' : '')} onClick=${() => act.sheet({type:'filter'})} aria-label=${`Filters: ${season.name}` + (ui.catDrop ? `, ${DROPS[ui.catDrop].split(' · ')[0]}` : '')}><${Icon} n="filter" s=${20} w=${2}/></button>
      </div>
      ${ui.catDrop && html`<button class="fchip" onClick=${() => act.set({catDrop:null})} aria-label="Clear drop filter">${DROPS[ui.catDrop]}<${Icon} n="x" s=${14} w=${2.2}/></button>`}
      ${!items.length ? html`<div class="empty">${ql ? `No styles match “${q}”. Try a style name or code.` : `No ${DIV_LABEL[div].toLowerCase()} styles in this collection.`}</div>`
      : html`<div ref=${ref}>
        <nav class="cat-nav" ref=${nav} aria-label="Categories">
          <div class="cn-row" role="tablist">${groups.map(g => html`<button role="tab" aria-selected=${curCat === g.cat} class=${'cn-cat' + (curCat === g.cat ? ' on' : '')} onClick=${() => go(g.cat)}>${CAT_LABEL[g.cat]}</button>`)}</div>
        </nav>
        <div class="cat-main">${groups.map(g => html`<div class="cat-sec">
          <h2 class="cat-h" id=${'c-' + g.cat} data-spy=${g.cat}>${CAT_LABEL[g.cat]}</h2>
          <div class="pgrid">${g.fams.map(f => html`${f.f && html`<div class="fam-h" key=${f.id}>${f.f}</div>`}${f.ps.map(p => html`<${PCard} key=${p.id} p=${p} o=${so} act=${act}/>`)}`)}</div>
        </div>`)}</div>
      </div>`}
    </section>`;
}

// Switching seller asks for that seller's 4-digit code (demo: any 4 digits are accepted)
function PinPad({rep, onDone, onBack}) {
  const [pin, setPin] = useState('');
  const press = k => setPin(p => k === 'del' ? p.slice(0, -1) : p.length < 4 ? p + k : p);
  useEffect(() => { if (pin.length === 4) { const t = setTimeout(onDone, 180); return () => clearTimeout(t); } }, [pin]);
  useEffect(() => { const key = e => { if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('del'); };
    window.addEventListener('keydown', key); return () => window.removeEventListener('keydown', key); }, []);
  return html`<div class="pin">
    <span class="avatar">${rep.ini}</span>
    <div class="pin-t">Enter ${rep.name}’s code</div>
    <div class="pin-dots" role="status" aria-label=${pin.length + ' of 4 digits entered'}>${[0, 1, 2, 3].map(i => html`<i class=${i < pin.length ? 'on' : ''}></i>`)}</div>
    <div class="pin-pad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', 'back', '0', 'del'].map(k => k === 'back'
      ? html`<button class="pin-k txt" onClick=${onBack}>Cancel</button>`
      : k === 'del' ? html`<button class="pin-k txt" onClick=${() => press('del')} aria-label="Delete" disabled=${!pin}><${Icon} n="back" s=${22}/></button>`
      : html`<button class="pin-k" onClick=${() => press(k)}>${k}</button>`)}</div>
  </div>`;
}

/* =====================================================================
   Size & quantity entry — the step a photo can't do
   ===================================================================== */
const CURVES = {5:[['Core 1·2·2·1', [0,1,2,2,1]], ['Full 1·2·3·2·1', [1,2,3,2,1]]], 6:[['Core 1·2·2·1', [0,1,2,2,1,0]], ['Full 1·2·3·3·2·1', [1,2,3,3,2,1]]]};

function SizeSheet({sh, S, act}) {
  const order = S.orders[sh.orderId], p = P[sh.pid], b = BUYERS[order.buyerId];
  const actor = sh.actor || 'salesperson';
  const init = useMemo(() => Object.fromEntries(p.colours.map(c => [c, {...((order.lines.find(l => l.pid === p.id && l.colour === c) || {}).qty || {})}])), []);
  const [draft, setDraft] = useState(init);
  const existing = order.lines.some(l => l.pid === p.id);
  const [col, setCol] = useState(sh.colour || (order.lines.find(l => l.pid === p.id) || {}).colour || p.colours[0]);
  const locked = !available(b, p);
  // once a part is sent it is read-only for the seller and the client alike
  const readOnly = partLocked(order, p.div);
  const q = draft[col] || {};
  const dirty = JSON.stringify(Object.fromEntries(Object.entries(draft).map(([c, x]) => [c, qkey(Object.fromEntries(Object.entries(x).filter(([, n]) => n > 0)))]))) !==
                JSON.stringify(Object.fromEntries(Object.entries(init).map(([c, x]) => [c, qkey(x)])));
  const setQty = (s, n) => setDraft(d => ({...d, [col]: {...d[col], [s]: Math.max(0, Math.min(99, n))}}));
  const setAll = arr => setDraft(d => ({...d, [col]: Object.fromEntries(p.sizes.map((s, i) => [s, arr[i] || 0]))}));
  const save = () => { if (dirty && !locked && !readOnly) { act.saveDraft(order.id, p.id, draft, sh.via || 'search', actor); return true; } return false; };
  const close = () => { if (save()) act.toast('Saved to order'); act.close(); };
  const done = () => { save(); act.close(); act.toast(existing ? 'Order updated' : 'Added to order'); };
  const go = (pid, colour) => { if (save()) act.toast('Saved to order'); act.sheet({type:'size', orderId:order.id, pid, colour, via:'suggestion', actor}); };

  const projected = useMemo(() => { const o = JSON.parse(JSON.stringify(order)); applyDraft(o, p.id, draft, 'x', actor); return o; }, [draft, order]);
  const k0 = kpi(order, p.div), k1 = kpi(projected, p.div);
  const m0 = k0.mix.find(m => m.cat === p.cat), m1 = k1.mix.find(m => m.cat === p.cat);
  const tUnits = Object.values(draft).reduce((a, x) => a + units(x), 0);
  const family = PRODUCTS.filter(x => x.family === p.family && x.id !== p.id && x.div === p.div && available(b, x));
  const sug = (pid, colour) => { const xp = P[pid], has = order.lines.some(l => l.pid === pid);
    return html`<button class="sug" onClick=${() => go(pid, colour)}><${Thumb} pid=${pid} colour=${colour}/><div class="sug-n">${xp.name}</div>
      <div class="small muted">${has ? 'In order' : fmt(xp.price)}</div></button>`; };
  const curves = CURVES[p.sizes.length] || [];

  return html`<${Sheet} tall title=${p.name} sub=${`${p.code} · ${prices(p)}`} onClose=${close}
    foot=${readOnly ? html`<button class="btn secondary" onClick=${act.close}>Close</button>` : html`
      ${existing && html`<button class="btn danger" style="flex:0 0 auto" onClick=${() => act.unselect(order.id, p.id, null, actor)}>Remove</button>`}
      <button class="btn primary" disabled=${locked || (!existing && tUnits === 0)} onClick=${done}>${existing ? 'Save changes' : tUnits ? `Add ${tUnits} to order` : 'Enter quantities'}</button>`}>
    <div class="ss-top">
      <${Thumb} cls="lg" pid=${p.id} colour=${col}/>
      <div class="ss-info">
        <div class="small muted">${DIV_LABEL[p.div]} · ${CAT_LABEL[p.cat]} · ${DROPS[p.drop]}</div>
        <div class="ss-total"><b>${tUnits}</b> units · <span class="num">${fmt(tUnits * p.price)}</span></div>
      </div>
    </div>
    ${locked && html`<div class="callout bad"><${Icon} n="lock" s=${18}/><div>${p.name} isn’t available to ${b.shop}, so it can’t go on this order.</div></div>`}
    ${readOnly && html`<div class="callout info"><${Icon} n="lock" s=${18}/><div>The ${DIV_LABEL[p.div].toLowerCase()} order has been sent and can’t be changed here.</div></div>`}
    <div class="lbl">Colour <span style="text-transform:none;letter-spacing:0;font-weight:500">· ${p.colours.length} options</span></div>
    <div class="colours">${p.colours.map(c => html`<button class=${'colour' + (c === col ? ' on' : '')} onClick=${() => setCol(c)}><span class="sw" style=${{background:COL[c][0]}}></span>${c}<span class="code">${COL[c][1]}</span>${units(draft[c]) > 0 && html`<span class="cnt">${units(draft[c])}</span>`}</button>`)}</div>
    ${!locked && !readOnly && html`
      <div class="lbl">${p.sizes.length > 1 ? 'Sizes' : 'Quantity'} · ${col}</div>
      ${p.sizes.length > 1 ? html`
        <div class="sizes">${p.sizes.map(s => html`<div class=${'size-cell' + (q[s] ? ' has' : '')}>
          <div class="sz">${s}</div>
          <button class="step" aria-label=${'Add one size ' + s} onClick=${() => setQty(s, (q[s] || 0) + 1)}>+</button>
          <div class="qty num">${q[s] || 0}</div>
          <button class="step" aria-label=${'Remove one size ' + s} onClick=${() => setQty(s, (q[s] || 0) - 1)}>−</button>
        </div>`)}</div>
        <div class="quick">${curves.map(([l, arr]) => html`<button class="qbtn" onClick=${() => setAll(arr)}>${l}</button>`)}
          <button class="qbtn" onClick=${() => setAll(p.sizes.map(s => (q[s] || 0) + 1))}>+1 each</button>
          <button class="qbtn" onClick=${() => setAll([])}>Clear</button></div>` : html`
        <div class="single">
          <button class="step lg" aria-label="Remove one" onClick=${() => setQty('U', (q.U || 0) - 1)}>−</button>
          <div class="qty xl num">${q.U || 0}</div>
          <button class="step lg" aria-label="Add one" onClick=${() => setQty('U', (q.U || 0) + 1)}>+</button>
        </div>
        <div class="quick">${[1, 2, 3, 4, 6].map(n => html`<button class="qbtn" onClick=${() => setQty('U', n)}>${n}</button>`)}<button class="qbtn" onClick=${() => setQty('U', 0)}>Clear</button></div>`}
      <div class="panel impact">
        <div class="impact-row"><span class="muted">${CAT_LABEL[p.cat]} budget</span>
          <span class="num"><span class="muted">${fmt(m0.value)} →</span> <b class=${'st-' + m1.st}>${fmt(m1.value)}</b> <span class="muted">of ${fmt(m1.budget)}</span></span></div>
        <div class="impact-row"><span class="muted">${DIV_LABEL[p.div]} budget</span>
          <span class="num"><span class="muted">${fmt(k0.total)} →</span> <b>${fmt(k1.total)}</b> <span class="muted">of ${fmt(k1.budget)}</span></span></div>
      </div>`}
    ${family.length > 0 && html`<div class="lbl">Same family · ${p.family}</div><div class="sugs">${family.map(x => sug(x.id, x.colours.includes(col) ? col : x.colours[0]))}</div>`}
  <//>`;
}

    ${stage === 'match' && html`<div class="match" role="dialog" aria-label=${p.name}>

function issuesOf(o, divs) {
  const out = [];
  divs.forEach(d => { const k = kpi(o, d); if (!k.total) return;
    k.mix.filter(m => m.st === 'warn' || m.st === 'bad').forEach(m => out.push({label:`${DIV_LABEL[d]} ${CAT_LABEL[m.cat].toLowerCase()}`, text: m.budget ? `${fmt(m.value)} of ${fmt(m.budget)}` : 'No budget', st:m.st}));
    if (k.bst !== 'ok') out.push({label:`${DIV_LABEL[d]} budget`, text:`${fmt(k.total)} of ${fmt(k.budget)}`, st:k.bst});
    k.rules.filter(r => r.st === 'bad' || r.st === 'warn').forEach(r => out.push({label:`${DIV_TAB[d]} · ${r.label}`, text:`${fmt(r.value)}, ${ruleLimit(r)}`, st:r.st}));
    k.looks.filter(x => !x.done).forEach(x => out.push({label:`${DIV_TAB[d]} · ${lookNo(x.l)}`, text:`${x.have} of ${x.n} pieces`, st:'warn'})); });
  return out;
}

// Closing the visit: send women's and men's together or one at a time. The client signs here, or reviews from a link within 48 hours.
// Confirming for production happens in the back office, never here.
function FinishSheet({sh, S, act}) {
  const o = S.orders[sh.orderId], b = BUYERS[o.buyerId];
  const open = b.divs.filter(d => !partLocked(o, d)), filled = d => kpi(o, d).units > 0;

  const issues = issuesOf(o, sel), noQty = o.lines.filter(l => sel.includes(P[l.pid].div) && !units(l.qty)).length;
  const value = sel.reduce((a, d) => a + kpi(o, d).total, 0);
  const shared = sel.length > 0 && sel.every(d => partOf(o, d).status === 'shared');
  const link = `loewe.vega.app/o/${b.code}-${sel.join('')}${String(o.lines.length).padStart(2, '0')}`;
  return html`<${Sheet} title="Review and sign" sub=${orderNo(o)} onClose=${act.close}>
    ${!open.length ? html`<div class="callout good"><${Icon} n="check" s=${18}/><div>Everything is sent. The commercial team reviews the order and confirms it for production.</div></div>` : html`
      <div class="lbl">What to send</div>

          <div class="row-main"><div class="row-title">${DIV_LABEL[d]}</div><div class="row-sub"><${Pill} s=${st}/><span class="num">${k.units} units · ${fmt(k.total)}</span></div></div>
          <div class="row-side">${sel.includes(d) && html`<${Icon} n="check" s=${20} w=${2.4}/>`}</div>
        </button>`; })}</div>
      ${noQty > 0 && html`<div class="callout warn"><${Icon} n="alert" s=${18}/><div>${noQty} selected ${noQty === 1 ? 'style has' : 'styles have'} no quantity and won’t be produced.</div></div>`}
      ${issues.length > 0 && html`<div class="panel">
        <div style="font-weight:650">Outside the guidelines</div>
        <div>${issues.map(x => html`<div class="issue"><span>${x.label}</span><span class=${'chip ' + x.st}>${x.text}</span></div>`)}</div>
        <div class="small muted">You can still send. The commercial team sees the same check.</div>

      </div>

        ${shared ? html`<div class="linkbox"><code>${link}</code><button class="btn secondary" onClick=${() => copyText('https://' + link, act)}><${Icon} n="copy" s=${16}/>Copy</button></div>
            <button class="btn secondary block" onClick=${() => act.role('buyer', o.id)}>Open as the client (demo)</button>`
          : html`<button class="btn secondary block" disabled=${!sel.length} onClick=${() => { act.share(o.id, sel); act.toast('Link sent · closes in 48h'); }}><${Icon} n="share" s=${18}/>Send the link to the client</button>`}
      </div>
      <div class="small muted">Close this to keep working. Whatever isn’t sent stays a draft.</div>`}
  <//>`;
}

// Signature pad: finger or mouse, drawn on a canvas
function SignPad({onSigned}) {
  const ref = useRef(null), on = useRef(false);
  useEffect(() => { const c = ref.current, r = c.getBoundingClientRect(), k = window.devicePixelRatio || 1;
    c.width = r.width * k; c.height = r.height * k; const x = c.getContext('2d'); x.scale(k, k);
    x.lineWidth = 2.4; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = getComputedStyle(c).color; }, []);
  const at = e => { const r = ref.current.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const down = e => { ref.current.setPointerCapture(e.pointerId); on.current = true; const x = ref.current.getContext('2d'); x.beginPath(); x.moveTo(...at(e)); };
  const move = e => { if (!on.current) return; const x = ref.current.getContext('2d'); x.lineTo(...at(e)); x.stroke(); onSigned(true); };
  const up = () => { on.current = false; };
  const clear = () => { const c = ref.current; c.getContext('2d').clearRect(0, 0, c.width, c.height); onSigned(false); };
  return html`<div class="sign">
    <canvas ref=${ref} class="sign-pad" onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up} aria-label="Signature"></canvas>
    <span class="sign-hint">Sign here</span>
    <button class="linkbtn sign-clear" onClick=${clear}>Clear</button>
  </div>`;
}

const GUIDE_STEPS = [

  'In the Collection, tap + on a photo to select a style. Only styles the client can buy show; Filters choose the collection and the drop.',

function TabBar({tab, act}) {

function makeActs(setS, setUi, onReset) {
  let toastT = 0;
  const a = {
    toast: msg => { setUi(u => ({...u, toast:msg, toastId:Date.now()})); clearTimeout(toastT); toastT = setTimeout(() => setUi(u => ({...u, toast:null})), 2200); },
    // opening an order only shows it; the client in session changes only with a check-in
    openOrder: bid => { const id = 'o-' + bid;
      setS(s => s.orders[id] ? s : {...s, orders:{...s.orders, [id]:newOrder(bid)}, savedAt:Date.now()});
      setUi(u => ({...u, view:id, div: u.view === id ? u.div : BUYERS[bid].divs[0], sheet:null, capture:false})); },
    back: () => setUi(u => ({...u, view:null, capture:false, sheet:null})),
    tab: t => setUi(u => ({...u, tab:t, view:null})),
    sheet: sh => setUi(u => ({...u, sheet:sh, capture: sh && sh.type === 'picker' ? false : sh && sh.type === 'size' ? false : u.capture})),
    close: () => setUi(u => ({...u, sheet:null})),
    capture: on => setUi(u => ({...u, capture:on, sheet:null})),
    div: d => setUi(u => ({...u, div:d})),
    set: patch => setUi(u => ({...u, ...patch})),
    switchRep: id => { setS(s => ({...s, rep:id})); setUi(u => ({...u, sheet:null, view:null, session:null})); a.toast(`Signed in as ${REPS[id].name}`); },
    startSession: bid => { const id = 'o-' + bid;
      setS(s => s.orders[id] ? s : {...s, orders:{...s.orders, [id]:newOrder(bid)}, savedAt:Date.now()});
      setUi(u => ({...u, session:id, div: BUYERS[bid].divs[0]})); },
    // appointment record: every change is stored straight away (state persists on each update)
    appt: (bid, patch) => setS(s => ({...s, appts:{...s.appts, [bid]:{...(s.appts[bid] || {}), ...patch}}, savedAt:Date.now()})),
    // checking in starts the client session (black band on top) and opens the Collection; one client at a time, so whoever
    // was ongoing, for any seller on this device, is checked out. Checking in again after a check-out keeps the original start time.
    checkIn: (bid, stay) => { const now = Date.now(), id = 'o-' + bid;
      setS(s => { const appts = oneOngoing({...s.appts}, bid);
        const x = appts[bid] || {}; appts[bid] = x.in ? {...x, out:null, back:now} : {...x, in:now, out:null};
        return {...s, appts, orders: s.orders[id] ? s.orders : {...s.orders, [id]:newOrder(bid)}, savedAt:now}; });
      setUi(u => ({...u, session:id, div:BUYERS[bid].divs[0], sheet:null, capture:false, ...(stay ? {} : {tab:'catalogue', view:null})}));
      a.toast(`Checked in · ${BUYERS[bid].shop}`); },
    checkOut: bid => { a.appt(bid, {out:Date.now()}); setUi(u => u.session === 'o-' + bid ? {...u, session:null} : u); a.toast(`Checked out · ${BUYERS[bid].shop}`); },
    note: (bid, text) => a.appt(bid, {notes:text}),
    // the client in session: land in the Collection to add products
    addProducts: () => setUi(u => ({...u, tab:'catalogue', view:null, sheet:null})),
    // add flow from Collection or a lookbook with nobody checked in: check that client in, then add the piece
    addFor: (bid, item) => { a.checkIn(bid, true); a.select('o-' + bid, item.pid, item.colour, item.via); },
    newBuyer: (b, item, appt) => { BUYERS[b.id] = b; setS(s => ({...s, buyers:{...s.buyers, [b.id]:b}}));
      if (item) a.addFor(b.id, item); else if (appt) a.sheet({type:'appt', bid:b.id}); else a.checkIn(b.id); },
    mut: (id, fn) => setS(s => { const o = JSON.parse(JSON.stringify(s.orders[id])); fn(o); syncStatus(o); return {...s, orders:{...s.orders, [id]:o}, savedAt:Date.now()}; }),
    role: (r, id) => setUi(u => ({...u, role:r, buyerOrder:id || u.buyerOrder, sheet:null, capture:false})),
    reset: onReset,
  };
  a.saveDraft = (id, pid, draft, via, by) => a.mut(id, o => applyDraft(o, pid, draft, via, by));
  // selection without quantity: the style-colour joins the order at zero units
  a.select = (id, pid, colour, via) => { const p = P[pid];
    a.mut(id, o => { if (o.lines.some(l => l.pid === pid && l.colour === colour)) return;
      o.lines.push({id:uid(), pid, colour, qty:{}, via, by:'salesperson', at:Date.now()}); log(o, 'salesperson', `Selected ${p.name} · ${cname(colour)}${via === 'photo' ? ' (photo match)' : ''}`); });
    a.toast('Added to order'); };
  // the whole runway look in one go: every piece the client can buy that isn't in the order yet
  a.selectLook = (id, look) => { let k = 0;
    a.mut(id, o => { look.items.forEach(([pid, colour]) => { if (canTake(o, P[pid]) || o.lines.some(l => l.pid === pid && l.colour === colour)) return;
      o.lines.push({id:uid(), pid, colour, qty:{}, via:'look', by:'salesperson', at:Date.now()}); k++; });
      log(o, 'salesperson', `Added ${lookNo(look)} · ${k} pieces`); });
    a.close(); a.toast('Added to order'); };
  a.unselect = (id, pid, colour, by='salesperson') => { const p = P[pid];
    a.mut(id, o => { o.lines = o.lines.filter(l => !(l.pid === pid && (!colour || l.colour === colour))); log(o, by, `Removed ${p.name}${colour ? ' · ' + cname(colour) : ''}`); });
    setUi(u => u.sheet && (u.sheet.type === 'size' || u.sheet.type === 'product') ? {...u, sheet:null} : u); a.toast('Removed from order'); };
  // stepper on one-size styles; repeated taps update one log entry
  a.setUnits = (id, lineId, n) => a.mut(id, o => { const l = o.lines.find(x => x.id === lineId); if (!l) return; const p = P[l.pid];
    n = Math.max(0, Math.min(999, n)); l.qty = n ? {U: n} : {}; l.at = Date.now();
    const key = 'u:' + lineId, last = o.log[o.log.length - 1], text = `Set ${p.name} · ${cname(l.colour)} to ×${n}`;
    if (last && last.key === key) { last.text = text; last.at = Date.now(); } else o.log.push({at:Date.now(), by:'salesperson', text, key}); });
  // each division is sent on its own; the order's overall status follows from its parts
  a.share = (id, divs) => a.mut(id, o => { const now = Date.now(); o.parts = o.parts || {};
    divs.forEach(d => { o.parts[d] = {status:'shared', at:now}; }); o.sharedAt = now;
    log(o, 'salesperson', `${divs.map(d => DIV_LABEL[d]).join(' and ')} shared with ${BUYERS[o.buyerId].shop} · closes in 48h`); });
  a.send = (id, divs, by, signer) => a.mut(id, o => { const now = Date.now(); o.parts = o.parts || {};
    divs.forEach(d => { o.parts[d] = {status:'submitted', at:now, by, signer}; }); o.submittedBy = by; o.submittedAt = now;
    log(o, by, `${divs.map(d => DIV_LABEL[d]).join(' and ')} signed by ${signer} and sent`); });
  return a;
}

function App({onReset}) {

  useEffect(() => { saveState(S); }, [S]);
  useEffect(() => { saveSession(ui.session); }, [ui.session]);
  const act = useMemo(() => makeActs(setS, setUi, onReset), []);
  const order = ui.view && S.orders[ui.view];
  const sh = ui.sheet;
  const sheet = !sh ? null
    : sh.type === 'size' ? html`<${SizeSheet} key=${sh.pid + (sh.actor || '')} sh=${sh} S=${S} act=${act}/>`
    : sh.type === 'picker' ? html`<${PickerSheet} sh=${sh} act=${act}/>`

    : sh.type === 'guide' ? html`<${GuideSheet} act=${act}/>`
    : sh.type === 'sign' ? html`<${SignSheet} sh=${sh} S=${S} act=${act}/>`
    : sh.type === 'look' ? html`<${LookSheet} id=${sh.id} S=${S} ui=${ui} act=${act}/>`
    : sh.type === 'product' ? html`<${ProductSheet} key=${sh.pid} pid=${sh.pid} S=${S} ui=${ui} act=${act}/>`
    : sh.type === 'filter' ? html`<${FilterSheet} ui=${ui} act=${act}/>`
    : sh.type === 'account' ? html`<${AccountSheet} S=${S} act=${act}/>`
    : sh.type === 'newbuyer' ? html`<${NewBuyerSheet} S=${S} sh=${sh} act=${act}/>`
    : sh.type === 'pick' ? html`<${PickBuyerSheet} S=${S} sh=${sh} act=${act}/>`
    : sh.type === 'appt' ? html`<${ApptSheet} key=${sh.bid} sh=${sh} S=${S} act=${act}/>` : null;
  const toast = ui.toast && html`<div class="toast" key=${ui.toastId} role="status"><${Icon} n="check" s=${16} w=${2.4}/>${ui.toast}</div>`;

  const buyerView = ui.role === 'buyer' && S.orders[ui.buyerOrder];
  // a checked-in client is always the client in session (after a reload or an account switch too)
  const ongoing = ongoingBuyer(S), sessionOk = !!activeOrder(S, ui);
  useEffect(() => { if (ongoing && !sessionOk && !buyerView) act.startSession(ongoing.id); }, [ongoing && ongoing.id, sessionOk, !!buyerView]);
  // the client in session rides as a pill above the tab bar on every tab; the tab bar is always there
  const so = activeOrder(S, ui), pill = !!(so && !order), capDiv = so && (BUYERS[so.buyerId].divs.includes(ui.capDiv) ? ui.capDiv : BUYERS[so.buyerId].divs[0]);
  if (buyerView) return html`<div class="app"><${BuyerView} S=${S} ui=${ui} act=${act}/>${sheet}${toast}</div>`;
  return html`<div class=${'app' + (pill ? ' with-pill' : '')}>
    ${order ? html`<${OrderView} S=${S} ui=${ui} act=${act} order=${order}/>` : html`
      <div class=${'screen tabbed' + (pill ? ' with-pill' : '')}>
        ${ui.tab === 'calendar' && html`<${CalendarTab} S=${S} act=${act}/>`}
        ${ui.tab === 'today' && html`<${Today} S=${S} ui=${ui} act=${act}/>`}
        ${ui.tab === 'orders' && html`<${OrdersTab} S=${S} ui=${ui} act=${act}/>`}
        ${ui.tab === 'catalogue' && html`<${CatalogueTab} key=${so ? so.id : 'none'} S=${S} ui=${ui} act=${act}/>`}
      </div>`}
    <div class="dock">${pill && html`<${SessionBar} S=${S} ui=${ui} act=${act}/>`}<${TabBar} tab=${ui.tab} act=${act}/></div>
    ${ui.capture && so && html`<${Capture} order=${so} div=${capDiv} act=${act}/>`}
    ${ui.zoom && html`<${Zoom} z=${ui.zoom} act=${act}/>`}
    ${sheet}${toast}
  </div>`;
}

function Shell() {
  const [orient, setOrient] = useState('portrait');
  const [k, setK] = useState(0);
  const reset = () => { clearState(); setK(x => x + 1); };
  return html`<div class="shell">
    <aside class="side">
      <div class="side-brand">Vega</div>
      <p class="side-lede">Showroom order capture for wholesale. A first web mockup of the iOS app: photo match, fast size entry, live guideline checks per client, and a signed record of each order sent.</p>
      <div class="lbl">Try this</div>
      <ol class="steps">${GUIDE_STEPS.map(s => html`<li>${s}</li>`)}</ol>
      <div class="side-ctrls"><${Seg} opts=${[['portrait', 'Portrait'], ['landscape', 'Landscape']]} val=${orient} on=${setOrient}/><button class="linkbtn" onClick=${reset}>Reset demo</button></div>
      <p class="fine">Prototype. Photo recognition is simulated against a catalogue built from loewe.com: real styles, colours and photos; wholesale prices are indicative. Orders save in this browser only.</p>
    </aside>
    <div class=${'device ' + orient}>
      <div class="statusbar"><span>9:41</span><span class="sb-r"><i style="height:5px"></i><i style="height:7px"></i><i style="height:9px"></i><i style="height:11px"></i><span class="sb-batt"><span></span></span></span></div>
      <${App} key=${k} onReset=${reset}/>
    </div>
  </div>`;
}

render(html`<${Shell}/>`, document.getElementById('root'));
</script>
</body>
</html>
